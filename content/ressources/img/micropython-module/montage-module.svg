<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <style>
      .h1 { font-size:15px; font-weight:600; fill:#2A2A2A; }
      .sub { font-size:11px; fill:#6E6E6E; }
      .wire { fill:none; stroke:#6E6E6E; stroke-width:2; }
      .boxN { fill:#FFFFFF; stroke:#B9B6AC; stroke-width:1.4; }
      .comp { fill:#F7EBD6; stroke:#BA7517; stroke-width:1.6; }
      .dot { fill:#6E6E6E; }
      .lblBox { font-size:14px; font-weight:600; fill:#3A3A3A; }
      .lblPin { font-size:11px; font-weight:600; fill:#2A2A2A; }
      .pin { font-size:11px; font-weight:600; fill:#7A5310; }
      .n { font-size:11px; fill:#5A5A5A; }
      .nStrong { font-size:11.5px; font-weight:600; fill:#3A3A3A; }
      @media (prefers-color-scheme: dark) {
        .h1 { fill:#EDEDED; }
        .sub { fill:#A8A8A8; }
        .wire { stroke:#B0B0B0; }
        .boxN { fill:#1F1F1F; stroke:#5A5A5A; }
        .comp { fill:#3A2E19; stroke:#E0A24A; }
        .dot { fill:#B0B0B0; }
        .lblBox { fill:#DADADA; }
        .lblPin { fill:#ECECEC; }
        .pin { fill:#E0A24A; }
        .n { fill:#B0B0B0; }
        .nStrong { fill:#DADADA; }
      }
    </style>
  </defs>

  <text x="300" y="26" class="h1" text-anchor="middle">Câblage — module I2C sur Pico (MicroPython)</text>
  <text x="300" y="46" class="sub" text-anchor="middle">Broches du code : SDA = GP4, SCL = GP5 · alimentation 3,3 V, masse commune</text>

  <rect x="44" y="84" width="150" height="190" rx="10" class="boxN"/>
  <text x="119" y="110" class="lblBox" text-anchor="middle">Pico</text>
  <text x="186" y="132" class="lblPin" text-anchor="end">3V3</text>
  <text x="186" y="174" class="lblPin" text-anchor="end">GP4 (SDA)</text>
  <text x="186" y="216" class="lblPin" text-anchor="end">GP5 (SCL)</text>
  <text x="186" y="258" class="lblPin" text-anchor="end">GND</text>
  <circle cx="194" cy="128" r="3" class="dot"/>
  <circle cx="194" cy="170" r="3" class="dot"/>
  <circle cx="194" cy="212" r="3" class="dot"/>
  <circle cx="194" cy="254" r="3" class="dot"/>

  <rect x="406" y="84" width="150" height="190" rx="10" class="comp"/>
  <text x="481" y="110" class="lblBox" text-anchor="middle">Module I2C</text>
  <circle cx="406" cy="128" r="3" class="dot"/><text x="414" y="132" class="pin" text-anchor="start">VCC</text>
  <circle cx="406" cy="170" r="3" class="dot"/><text x="414" y="174" class="pin" text-anchor="start">SDA</text>
  <circle cx="406" cy="212" r="3" class="dot"/><text x="414" y="216" class="pin" text-anchor="start">SCL</text>
  <circle cx="406" cy="254" r="3" class="dot"/><text x="414" y="258" class="pin" text-anchor="start">GND</text>

  <line x1="194" y1="128" x2="406" y2="128" class="wire"/>
  <line x1="194" y1="170" x2="406" y2="170" class="wire"/>
  <line x1="194" y1="212" x2="406" y2="212" class="wire"/>
  <line x1="194" y1="254" x2="406" y2="254" class="wire"/>

  <text x="300" y="122" class="n" text-anchor="middle">3,3 V</text>
  <text x="300" y="164" class="n" text-anchor="middle">données</text>
  <text x="300" y="206" class="n" text-anchor="middle">horloge</text>
  <text x="300" y="248" class="n" text-anchor="middle">masse</text>

  <text x="44" y="300" class="nStrong" text-anchor="start">Bon à savoir</text>
  <text x="44" y="318" class="n" text-anchor="start">Deux fils suffisent (SDA + SCL) pour dialoguer. La plupart des modules I2C ont déjà leurs résistances de tirage intégrées.</text>
</svg>
<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <style>
      .h1 { font-size:15px; font-weight:600; fill:#2A2A2A; }
      .sub { font-size:11px; fill:#6E6E6E; }
      .wire { fill:none; stroke:#6E6E6E; stroke-width:2; }
      .boxN { fill:#FFFFFF; stroke:#B9B6AC; stroke-width:1.4; }
      .comp { fill:#F7EBD6; stroke:#BA7517; stroke-width:1.6; }
      .dot { fill:#6E6E6E; }
      .lblBox { font-size:14px; font-weight:600; fill:#3A3A3A; }
      .lblPin { font-size:11px; font-weight:600; fill:#2A2A2A; }
      .pin { font-size:11px; font-weight:600; fill:#7A5310; }
      .cross { font-size:11px; font-weight:600; fill:#BA7517; }
      .n { font-size:11px; fill:#5A5A5A; }
      .nStrong { font-size:11.5px; font-weight:600; fill:#3A3A3A; }
      @media (prefers-color-scheme: dark) {
        .h1 { fill:#EDEDED; }
        .sub { fill:#A8A8A8; }
        .wire { stroke:#B0B0B0; }
        .boxN { fill:#1F1F1F; stroke:#5A5A5A; }
        .comp { fill:#3A2E19; stroke:#E0A24A; }
        .dot { fill:#B0B0B0; }
        .lblBox { fill:#DADADA; }
        .lblPin { fill:#ECECEC; }
        .pin { fill:#E0A24A; }
        .cross { fill:#E0A24A; }
        .n { fill:#B0B0B0; }
        .nStrong { fill:#DADADA; }
      }
    </style>
  </defs>

  <text x="300" y="26" class="h1" text-anchor="middle">Câblage — liaison UART sur Pico (MicroPython)</text>
  <text x="300" y="46" class="sub" text-anchor="middle">Broches du code : TX = GP0, RX = GP1 · TX et RX sont CROISÉS · masse commune</text>

  <rect x="44" y="84" width="150" height="150" rx="10" class="boxN"/>
  <text x="119" y="110" class="lblBox" text-anchor="middle">Pico</text>
  <text x="186" y="132" class="lblPin" text-anchor="end">GP0 (TX)</text>
  <text x="186" y="174" class="lblPin" text-anchor="end">GP1 (RX)</text>
  <text x="186" y="216" class="lblPin" text-anchor="end">GND</text>
  <circle cx="194" cy="128" r="3" class="dot"/>
  <circle cx="194" cy="170" r="3" class="dot"/>
  <circle cx="194" cy="212" r="3" class="dot"/>

  <rect x="406" y="84" width="150" height="150" rx="10" class="comp"/>
  <text x="481" y="110" class="lblBox" text-anchor="middle">Périphérique</text>
  <text x="481" y="126" class="n" text-anchor="middle">(GPS, autre carte…)</text>
  <circle cx="406" cy="142" r="3" class="dot"/><text x="414" y="146" class="pin" text-anchor="start">RX</text>
  <circle cx="406" cy="184" r="3" class="dot"/><text x="414" y="188" class="pin" text-anchor="start">TX</text>
  <circle cx="406" cy="212" r="3" class="dot"/><text x="414" y="216" class="pin" text-anchor="start">GND</text>

  <!-- TX Pico -> RX périph -->
  <line x1="194" y1="128" x2="300" y2="128" class="wire"/>
  <line x1="300" y1="128" x2="300" y2="142" class="wire"/>
  <line x1="300" y1="142" x2="406" y2="142" class="wire"/>

  <!-- RX Pico <- TX périph -->
  <line x1="194" y1="170" x2="340" y2="170" class="wire"/>
  <line x1="340" y1="170" x2="340" y2="184" class="wire"/>
  <line x1="340" y1="184" x2="406" y2="184" class="wire"/>

  <text x="300" y="160" class="cross" text-anchor="middle">croisé</text>

  <!-- GND commun -->
  <line x1="194" y1="212" x2="406" y2="212" class="wire"/>
  <text x="300" y="206" class="n" text-anchor="middle">masse commune</text>

  <text x="44" y="266" class="nStrong" text-anchor="start">Bon à savoir</text>
  <text x="44" y="284" class="n" text-anchor="start">Le TX d'une carte va toujours sur le RX de l'autre (et inversement). Sans masse commune, rien ne fonctionne.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="t2 d2">
  <title id="t2">Masse en chaînage contre masse en étoile</title>
  <desc id="d2">Trois charges (microcontrôleur, capteur, moteur) et leurs retours de masse. À gauche, en chaînage : les retours sont mis en série sur un tronc commun, et le fort courant du moteur traverse le segment de masse partagé par la logique, dont il décale la référence. À droite, en étoile : chaque retour rejoint séparément un point de masse commun unique, si bien que le courant du moteur n'emprunte jamais le chemin du signal.</desc>
  <defs>
    <style>
      .ttl { font:700 14px sans-serif; text-anchor:middle; fill:#2C2C2A; letter-spacing:.3px; }
      .hd  { font:700 12px sans-serif; text-anchor:middle; fill:#888780; letter-spacing:.5px; }
      .be  { fill:#DDDBD3; stroke:#BA7517; stroke-width:2.4; }
      .bi  { fill:#DDDBD3; stroke:#888780; stroke-width:2; }
      .bt  { font:700 11px sans-serif; text-anchor:middle; fill:#2C2C2A; }
      .io  { font:700 11px sans-serif; text-anchor:middle; fill:#BA7517; }
      .cap { font:400 11px sans-serif; text-anchor:middle; fill:#888780; }
      .note{ font:600 10.5px sans-serif; text-anchor:middle; fill:#BA7517; }
      .vrail{ stroke:#888780; stroke-width:1.4; fill:none; }
      .gnd { stroke:#888780; stroke-width:1.8; fill:none; }
      .gndm{ stroke:#888780; stroke-width:2.8; fill:none; }
      .gndbad{ stroke:#BA7517; stroke-width:3; fill:none; }
      .node{ fill:#888780; }
      .acc { fill:#BA7517; }
      .div { stroke:#DDDBD3; stroke-width:1.5; }
      @media (prefers-color-scheme: dark) {
        .ttl { fill:#F1EFE8; } .hd { fill:#BBBBBB; }
        .be { fill:#4A4A48; stroke:#EF9F27; } .bi { fill:#4A4A48; stroke:#BBBBBB; } .bt { fill:#F1EFE8; }
        .io { fill:#EF9F27; } .cap { fill:#BBBBBB; } .note { fill:#EF9F27; }
        .vrail { stroke:#BBBBBB; } .gnd { stroke:#BBBBBB; } .gndm { stroke:#BBBBBB; } .gndbad { stroke:#EF9F27; }
        .node { fill:#BBBBBB; } .acc { fill:#EF9F27; } .div { stroke:#5A5A57; }
      }
    </style>
  </defs>

  <text x="380" y="26" class="ttl">Router les masses : chaînage (le moteur pollue le signal) — étoile (chemins séparés)</text>
  <line x1="385" y1="48" x2="385" y2="300" class="div"/>

  <!-- Panneau A : chaînage -->
  <text x="200" y="60" class="hd"><tspan class="acc">✗</tspan> MASSE EN CHAÎNAGE</text>
  <text x="60" y="82" class="io">+V</text>
  <line x1="74" y1="78" x2="326" y2="78" class="vrail"/>
  <line x1="110" y1="78" x2="110" y2="92" class="vrail"/>
  <line x1="200" y1="78" x2="200" y2="92" class="vrail"/>
  <line x1="290" y1="78" x2="290" y2="92" class="vrail"/>
  <rect x="74"  y="92" width="72" height="38" rx="7" class="bi"/><text x="110" y="115" class="bt">MCU</text>
  <rect x="164" y="92" width="72" height="38" rx="7" class="bi"/><text x="200" y="115" class="bt">Capteur</text>
  <rect x="254" y="92" width="72" height="38" rx="7" class="be"/><text x="290" y="115" class="bt">Moteur</text>
  <!-- retours -->
  <line x1="110" y1="130" x2="110" y2="240" class="gnd"/>
  <line x1="200" y1="130" x2="200" y2="240" class="gnd"/>
  <line x1="290" y1="130" x2="290" y2="240" class="gndbad"/>
  <line x1="54" y1="240" x2="290" y2="240" class="gndbad"/>
  <!-- masse source -->
  <line x1="44" y1="246" x2="64" y2="246" class="gnd"/>
  <line x1="47" y1="250" x2="61" y2="250" class="gnd"/>
  <line x1="50" y1="254" x2="58" y2="254" class="gnd"/>
  <text x="54" y="272" class="cap">masse source</text>
  <text x="172" y="290" class="note">le courant moteur traverse</text>
  <text x="172" y="304" class="note">la masse du signal → référence décalée</text>

  <!-- Panneau B : étoile -->
  <text x="565" y="60" class="hd"><tspan class="acc">✓</tspan> MASSE EN ÉTOILE</text>
  <text x="432" y="82" class="io">+V</text>
  <line x1="444" y1="78" x2="686" y2="78" class="vrail"/>
  <line x1="480" y1="78" x2="480" y2="92" class="vrail"/>
  <line x1="565" y1="78" x2="565" y2="92" class="vrail"/>
  <line x1="650" y1="78" x2="650" y2="92" class="vrail"/>
  <rect x="444" y="92" width="72" height="38" rx="7" class="bi"/><text x="480" y="115" class="bt">MCU</text>
  <rect x="529" y="92" width="72" height="38" rx="7" class="bi"/><text x="565" y="115" class="bt">Capteur</text>
  <rect x="614" y="92" width="72" height="38" rx="7" class="be"/><text x="650" y="115" class="bt">Moteur</text>
  <!-- retours convergents vers le point commun -->
  <line x1="480" y1="130" x2="565" y2="246" class="gnd"/>
  <line x1="565" y1="130" x2="565" y2="246" class="gnd"/>
  <line x1="650" y1="130" x2="565" y2="246" class="gndm"/>
  <circle cx="565" cy="248" r="5" class="node"/>
  <text x="565" y="272" class="cap">point de masse commun unique</text>
  <text x="565" y="290" class="cap">un seul potentiel de référence</text>
</svg>

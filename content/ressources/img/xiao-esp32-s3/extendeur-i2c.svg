<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img" aria-labelledby="t d">
  <title id="t">Manque de broches : l'extendeur d'E/S sur le bus I²C</title>
  <desc id="d">Le XIAO ESP32-S3 a gauche expose deux fils I2C, SDA sur D4 et SCL sur D5, avec deux resistances de tirage de 4,7 kilo-ohms vers 3V3. Ces deux fils rejoignent un expandeur d'entrees-sorties (PCF8574 huit sorties, ou MCP23017 seize sorties) qui fournit huit a seize entrees-sorties supplementaires. Chaque expandeur a une adresse, on peut en placer plusieurs sur le meme bus.</desc>
  <defs>
    <style>
      .ti { font: 700 15px sans-serif; fill: #2C2C2A; }
      .hd { font: 600 12px sans-serif; fill: #2C2C2A; }
      .nm { font: 700 12px sans-serif; fill: #2C2C2A; }
      .sm { font: 400 10px sans-serif; fill: #555450; }
      .bx { fill: #DDDBD3; stroke: #888780; stroke-width: 1.2; }
      .obx { fill: #F4E2C0; stroke: #BA7517; stroke-width: 1.4; }
      .res { fill: #ECEAE2; stroke: #BA7517; stroke-width: 1.3; }
      .wire { stroke: #BA7517; stroke-width: 1.8; fill: none; }
      .gnd { stroke: #888780; stroke-width: 1.3; fill: none; }
      .nd { fill: #BA7517; }
      .foot { font: italic 400 10.5px sans-serif; fill: #888780; }
      .ah { fill: #BA7517; }
      @media (prefers-color-scheme: dark) {
        .ti, .hd, .nm { fill: #F1EFE8; }
        .sm { fill: #C9C7C0; }
        .foot { fill: #BBBBBB; }
        .bx { fill: #4A4A48; stroke: #BBBBBB; }
        .obx { fill: #5A4A2E; stroke: #EF9F27; }
        .res { fill: #3C3C3A; stroke: #EF9F27; }
        .wire { stroke: #EF9F27; }
        .gnd { stroke: #BBBBBB; }
        .nd { fill: #EF9F27; }
        .ah { fill: #EF9F27; }
      }
    </style>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" class="ah"/></marker>
  </defs>

  <text x="300" y="24" text-anchor="middle" class="ti">Manque de broches ? L'extendeur d'E/S (I²C)</text>

  <text x="270" y="54" text-anchor="middle" class="sm">3V3</text>
  <line x1="222" y1="58" x2="318" y2="58" class="gnd"/>
  <rect x="234" y="70" width="12" height="22" rx="2" class="res"/>
  <line x1="240" y1="58" x2="240" y2="70" class="gnd"/>
  <line x1="240" y1="92" x2="240" y2="112" class="gnd"/>
  <rect x="294" y="70" width="12" height="22" rx="2" class="res"/>
  <line x1="300" y1="58" x2="300" y2="70" class="gnd"/>
  <line x1="300" y1="92" x2="300" y2="144" class="gnd"/>
  <text x="324" y="82" text-anchor="start" class="sm">tirage 4,7 kΩ</text>

  <rect x="40" y="92" width="120" height="92" rx="5" class="bx"/>
  <text x="100" y="132" text-anchor="middle" class="nm">XIAO</text>
  <text x="100" y="148" text-anchor="middle" class="nm">ESP32-S3</text>

  <line x1="160" y1="112" x2="372" y2="112" class="wire" marker-end="url(#aw)"/>
  <text x="168" y="107" text-anchor="start" class="sm">SDA · D4</text>
  <circle cx="240" cy="112" r="3" class="nd"/>
  <line x1="160" y1="144" x2="372" y2="144" class="wire" marker-end="url(#aw)"/>
  <text x="168" y="159" text-anchor="start" class="sm">SCL · D5</text>
  <circle cx="300" cy="144" r="3" class="nd"/>

  <rect x="374" y="92" width="120" height="92" rx="5" class="obx"/>
  <text x="434" y="126" text-anchor="middle" class="hd">expandeur</text>
  <text x="434" y="143" text-anchor="middle" class="sm">PCF8574 (8)</text>
  <text x="434" y="158" text-anchor="middle" class="sm">MCP23017 (16)</text>

  <line x1="494" y1="116" x2="556" y2="116" class="wire" marker-end="url(#aw)"/>
  <line x1="494" y1="138" x2="556" y2="138" class="wire" marker-end="url(#aw)"/>
  <line x1="494" y1="160" x2="556" y2="160" class="wire" marker-end="url(#aw)"/>
  <text x="528" y="180" text-anchor="middle" class="sm">8 à 16 E/S</text>

  <text x="300" y="214" text-anchor="middle" class="foot">Deux fils partagés (SDA/SCL) + tirage vers 3V3. Chaque expandeur a une adresse</text>
  <text x="300" y="230" text-anchor="middle" class="foot">→ on en chaîne plusieurs sur le même bus pour multiplier les E/S.</text>
</svg>

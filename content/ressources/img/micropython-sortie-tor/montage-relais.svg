<svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <style>
      .h1 { font-size:15px; font-weight:600; fill:#2A2A2A; }
      .sub { font-size:11px; fill:#6E6E6E; }
      .wire { fill:none; stroke:#6E6E6E; stroke-width:2; }
      .boxN { fill:#FFFFFF; stroke:#B9B6AC; stroke-width:1.4; }
      .comp { fill:#F7EBD6; stroke:#BA7517; stroke-width:1.6; }
      .dot { fill:#6E6E6E; }
      .lbl { font-size:12px; fill:#2A2A2A; }
      .lblBox { font-size:14px; font-weight:600; fill:#3A3A3A; }
      .lblPin { font-size:11px; font-weight:600; fill:#2A2A2A; }
      .pin { font-size:11px; font-weight:600; fill:#7A5310; }
      .nStrong { font-size:11.5px; font-weight:600; fill:#3A3A3A; }
      .n { font-size:11px; fill:#5A5A5A; }
      @media (prefers-color-scheme: dark) {
        .h1 { fill:#EDEDED; }
        .sub { fill:#A8A8A8; }
        .wire { stroke:#B0B0B0; }
        .boxN { fill:#1F1F1F; stroke:#5A5A5A; }
        .comp { fill:#3A2E19; stroke:#E0A24A; }
        .dot { fill:#B0B0B0; }
        .lbl { fill:#ECECEC; }
        .lblBox { fill:#DADADA; }
        .lblPin { fill:#ECECEC; }
        .pin { fill:#E0A24A; }
        .nStrong { fill:#DADADA; }
        .n { fill:#B0B0B0; }
      }
    </style>
  </defs>

  <text x="330" y="26" class="h1" text-anchor="middle">Câblage — relais (sortie de puissance) sur Pico</text>
  <text x="330" y="46" class="sub" text-anchor="middle">Broche du code : GP16 · le relais commute une alimentation séparée</text>

  <rect x="30" y="96" width="120" height="92" rx="10" class="boxN"/>
  <text x="90" y="122" class="lblBox" text-anchor="middle">Pico</text>
  <text x="146" y="144" class="lblPin" text-anchor="end">GP16</text>
  <text x="146" y="176" class="lblPin" text-anchor="end">GND</text>
  <circle cx="150" cy="140" r="3" class="dot"/>
  <circle cx="150" cy="172" r="3" class="dot"/>

  <rect x="250" y="86" width="160" height="160" rx="10" class="comp"/>
  <text x="330" y="106" class="lblBox" text-anchor="middle">Module relais</text>
  <circle cx="250" cy="140" r="3" class="dot"/><text x="258" y="144" class="pin" text-anchor="start">IN</text>
  <circle cx="250" cy="176" r="3" class="dot"/><text x="258" y="180" class="pin" text-anchor="start">VCC</text>
  <circle cx="250" cy="212" r="3" class="dot"/><text x="258" y="216" class="pin" text-anchor="start">GND</text>
  <circle cx="410" cy="150" r="3" class="dot"/><text x="402" y="154" class="pin" text-anchor="end">COM</text>
  <circle cx="410" cy="200" r="3" class="dot"/><text x="402" y="204" class="pin" text-anchor="end">NO</text>

  <rect x="150" y="214" width="70" height="26" rx="5" class="boxN"/>
  <text x="185" y="231" class="lbl" text-anchor="middle">5 V</text>

  <rect x="520" y="104" width="110" height="56" rx="10" class="boxN"/>
  <text x="575" y="138" class="lblBox" text-anchor="middle">Moteur</text>
  <circle cx="520" cy="120" r="3" class="dot"/>
  <circle cx="520" cy="148" r="3" class="dot"/>

  <rect x="520" y="210" width="110" height="48" rx="10" class="boxN"/>
  <text x="575" y="230" class="lbl" text-anchor="middle">Alim. séparée</text>
  <text x="575" y="246" class="n" text-anchor="middle">(ex. 12 V)</text>
  <circle cx="520" cy="220" r="3" class="dot"/><text x="512" y="224" class="lblPin" text-anchor="end">+</text>
  <circle cx="520" cy="244" r="3" class="dot"/><text x="512" y="248" class="lblPin" text-anchor="end">−</text>

  <!-- Côté commande -->
  <line x1="150" y1="140" x2="250" y2="140" class="wire"/>
  <line x1="220" y1="227" x2="235" y2="227" class="wire"/>
  <line x1="235" y1="227" x2="235" y2="176" class="wire"/>
  <line x1="235" y1="176" x2="250" y2="176" class="wire"/>

  <!-- Masse commune -->
  <line x1="150" y1="172" x2="190" y2="172" class="wire"/>
  <line x1="190" y1="172" x2="190" y2="312" class="wire"/>
  <line x1="250" y1="212" x2="230" y2="212" class="wire"/>
  <line x1="230" y1="212" x2="230" y2="312" class="wire"/>
  <line x1="185" y1="240" x2="185" y2="312" class="wire"/>
  <line x1="100" y1="312" x2="300" y2="312" class="wire"/>
  <line x1="118" y1="318" x2="142" y2="318" class="wire"/>
  <line x1="123" y1="323" x2="137" y2="323" class="wire"/>
  <line x1="127" y1="328" x2="133" y2="328" class="wire"/>
  <text x="130" y="344" class="n" text-anchor="middle">masse commune</text>

  <!-- Côté charge (isolé par le relais) -->
  <line x1="520" y1="220" x2="460" y2="220" class="wire"/>
  <line x1="460" y1="220" x2="460" y2="150" class="wire"/>
  <line x1="460" y1="150" x2="410" y2="150" class="wire"/>
  <line x1="410" y1="200" x2="478" y2="200" class="wire"/>
  <line x1="478" y1="200" x2="478" y2="120" class="wire"/>
  <line x1="478" y1="120" x2="520" y2="120" class="wire"/>
  <line x1="520" y1="148" x2="500" y2="148" class="wire"/>
  <line x1="500" y1="148" x2="500" y2="244" class="wire"/>
  <line x1="500" y1="244" x2="520" y2="244" class="wire"/>

  <text x="30" y="350" class="n" text-anchor="start">GP16 ne pilote que l'entrée IN (faible courant) ; le contact du relais isole la charge du Pico.</text>
</svg>
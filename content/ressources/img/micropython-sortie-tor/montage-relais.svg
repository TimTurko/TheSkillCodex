<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <style>
      .h1 { font-size:15px; font-weight:600; fill:#2A2A2A; }
      .sub { font-size:11px; fill:#6E6E6E; }
      .wire { fill:none; stroke:#6E6E6E; stroke-width:2; }
      .boxN { fill:#FFFFFF; stroke:#B9B6AC; stroke-width:1.4; }
      .comp { fill:#F7EBD6; stroke:#BA7517; stroke-width:1.6; }
      .sym { fill:none; stroke:#BA7517; stroke-width:1.8; }
      .symf { fill:#BA7517; stroke:none; }
      .dot { fill:#6E6E6E; }
      .lbl { font-size:12px; fill:#2A2A2A; }
      .lblBox { font-size:14px; font-weight:600; fill:#3A3A3A; }
      .lblPin { font-size:11px; font-weight:600; fill:#2A2A2A; }
      .pin { font-size:11.5px; font-weight:700; fill:#7A5310; }
      .n { font-size:11px; fill:#5A5A5A; }
      @media (prefers-color-scheme: dark) {
        .h1 { fill:#EDEDED; }
        .sub { fill:#A8A8A8; }
        .wire { stroke:#B0B0B0; }
        .boxN { fill:#1F1F1F; stroke:#5A5A5A; }
        .comp { fill:#3A2E19; stroke:#E0A24A; }
        .sym { stroke:#E0A24A; }
        .symf { fill:#E0A24A; }
        .dot { fill:#B0B0B0; }
        .lbl { fill:#ECECEC; }
        .lblBox { fill:#DADADA; }
        .lblPin { fill:#ECECEC; }
        .pin { fill:#E0A24A; }
        .n { fill:#B0B0B0; }
      }
    </style>
  </defs>

  <text x="360" y="26" class="h1" text-anchor="middle">Câblage — trois interfaces de sortie TOR sur Pico</text>
  <text x="360" y="46" class="sub" text-anchor="middle">Broches du code : LED → GP8 · transistor (buzzer) → GP9 · module relais → GP10</text>

  <!-- Rail +5 V -->
  <line x1="180" y1="116" x2="560" y2="116" class="wire"/>
  <text x="560" y="108" class="lblPin" text-anchor="end">+5 V (VBUS)</text>

  <!-- Pico -->
  <rect x="44" y="120" width="120" height="275" rx="10" class="boxN"/>
  <text x="104" y="150" class="lblBox" text-anchor="middle">Pico</text>
  <circle cx="164" cy="160" r="3" class="dot"/><text x="158" y="164" class="lblPin" text-anchor="end">VBUS 5 V</text>
  <circle cx="164" cy="200" r="3" class="dot"/><text x="158" y="204" class="pin" text-anchor="end">GP8</text>
  <circle cx="164" cy="265" r="3" class="dot"/><text x="158" y="269" class="pin" text-anchor="end">GP9</text>
  <circle cx="164" cy="330" r="3" class="dot"/><text x="158" y="334" class="pin" text-anchor="end">GP10</text>
  <circle cx="164" cy="375" r="3" class="dot"/><text x="158" y="379" class="lblPin" text-anchor="end">GND</text>

  <!-- VBUS vers rail -->
  <line x1="164" y1="160" x2="180" y2="160" class="wire"/>
  <line x1="180" y1="160" x2="180" y2="116" class="wire"/>
  <circle cx="180" cy="116" r="3" class="dot"/>

  <!-- Pico GND -> masse -->
  <line x1="164" y1="375" x2="196" y2="375" class="wire"/>
  <line x1="196" y1="375" x2="196" y2="386" class="wire"/>
  <line x1="184" y1="386" x2="208" y2="386" class="wire"/>
  <line x1="188" y1="391" x2="204" y2="391" class="wire"/>
  <line x1="192" y1="396" x2="200" y2="396" class="wire"/>

  <!-- ===== Branche LED (GP8) ===== -->
  <line x1="164" y1="200" x2="214" y2="200" class="wire"/>
  <rect x="214" y="188" width="54" height="24" rx="4" class="boxN"/>
  <text x="241" y="204" class="lbl" text-anchor="middle">220 Ω</text>
  <line x1="268" y1="200" x2="300" y2="200" class="wire"/>
  <polygon points="300,189 300,211 326,200" class="comp"/>
  <line x1="329" y1="189" x2="329" y2="211" class="sym"/>
  <line x1="313" y1="186" x2="323" y2="176" class="sym"/>
  <polygon points="323,176 316,178 321,183" class="symf"/>
  <line x1="320" y1="190" x2="330" y2="180" class="sym"/>
  <polygon points="330,180 323,182 328,187" class="symf"/>
  <text x="312" y="232" class="lbl" text-anchor="middle">LED</text>
  <line x1="329" y1="200" x2="360" y2="200" class="wire"/>
  <line x1="360" y1="200" x2="360" y2="247" class="wire"/>
  <line x1="348" y1="247" x2="372" y2="247" class="wire"/>
  <line x1="352" y1="252" x2="368" y2="252" class="wire"/>
  <line x1="356" y1="257" x2="364" y2="257" class="wire"/>

  <!-- ===== Branche buzzer (GP9 -> transistor NPN) ===== -->
  <line x1="164" y1="265" x2="214" y2="265" class="wire"/>
  <rect x="214" y="253" width="54" height="24" rx="4" class="boxN"/>
  <text x="241" y="269" class="lbl" text-anchor="middle">1 kΩ</text>
  <line x1="268" y1="265" x2="304" y2="265" class="wire"/>
  <line x1="304" y1="251" x2="304" y2="279" class="sym"/>
  <line x1="304" y1="259" x2="340" y2="242" class="sym"/>
  <line x1="304" y1="271" x2="326" y2="289" class="sym"/>
  <polygon points="326,289 317,287 322,280" class="symf"/>
  <text x="352" y="262" class="lbl" text-anchor="start">2N2222</text>
  <text x="352" y="277" class="lbl" text-anchor="start">(NPN)</text>
  <!-- collecteur -> buzzer(-) -->
  <line x1="340" y1="242" x2="340" y2="172" class="wire"/>
  <line x1="340" y1="172" x2="418" y2="172" class="wire"/>
  <circle cx="440" cy="150" r="22" class="comp"/>
  <text x="440" y="154" class="lbl" text-anchor="middle">Buzzer</text>
  <circle cx="440" cy="172" r="3" class="dot"/><text x="449" y="176" class="lblPin" text-anchor="start">−</text>
  <circle cx="440" cy="128" r="3" class="dot"/><text x="449" y="124" class="lblPin" text-anchor="start">+</text>
  <line x1="418" y1="172" x2="440" y2="172" class="wire"/>
  <!-- buzzer(+) -> rail -->
  <line x1="440" y1="128" x2="440" y2="116" class="wire"/>
  <circle cx="440" cy="116" r="3" class="dot"/>
  <!-- émetteur -> masse -->
  <line x1="326" y1="289" x2="326" y2="309" class="wire"/>
  <line x1="314" y1="309" x2="338" y2="309" class="wire"/>
  <line x1="318" y1="314" x2="334" y2="314" class="wire"/>
  <line x1="322" y1="319" x2="330" y2="319" class="wire"/>

  <!-- ===== Branche relais (GP10) ===== -->
  <line x1="164" y1="330" x2="360" y2="330" class="wire"/>
  <rect x="360" y="300" width="170" height="120" rx="10" class="comp"/>
  <text x="445" y="290" class="lblBox" text-anchor="middle">Module relais</text>
  <circle cx="360" cy="330" r="3" class="dot"/><text x="368" y="334" class="pin" text-anchor="start">IN</text>
  <circle cx="470" cy="300" r="3" class="dot"/><text x="470" y="293" class="lblPin" text-anchor="middle">VCC</text>
  <circle cx="360" cy="392" r="3" class="dot"/><text x="368" y="396" class="lblPin" text-anchor="start">GND</text>
  <circle cx="530" cy="344" r="3" class="dot"/><text x="522" y="348" class="lblPin" text-anchor="end">COM</text>
  <circle cx="530" cy="380" r="3" class="dot"/><text x="522" y="384" class="lblPin" text-anchor="end">NO</text>
  <!-- VCC (haut) -> rail -->
  <line x1="470" y1="300" x2="470" y2="116" class="wire"/>
  <circle cx="470" cy="116" r="3" class="dot"/>
  <!-- relais GND -> masse -->
  <line x1="360" y1="392" x2="344" y2="392" class="wire"/>
  <line x1="344" y1="392" x2="344" y2="404" class="wire"/>
  <line x1="332" y1="404" x2="356" y2="404" class="wire"/>
  <line x1="336" y1="409" x2="352" y2="409" class="wire"/>
  <line x1="340" y1="414" x2="348" y2="414" class="wire"/>
  <!-- contact -> charge -->
  <rect x="580" y="320" width="110" height="80" rx="10" class="boxN"/>
  <text x="635" y="352" class="lblBox" text-anchor="middle">Charge</text>
  <text x="635" y="370" class="n" text-anchor="middle">(secteur ou inductive)</text>
  <circle cx="580" cy="344" r="3" class="dot"/>
  <circle cx="580" cy="380" r="3" class="dot"/>
  <line x1="530" y1="344" x2="580" y2="344" class="wire"/>
  <line x1="530" y1="380" x2="580" y2="380" class="wire"/>

  <text x="44" y="450" class="n" text-anchor="start">Le Pico ne fournit que le niveau logique (broche directe, base du transistor, entrée IN) ; le transistor et le relais commutent la puissance. Masse commune.</text>
</svg>

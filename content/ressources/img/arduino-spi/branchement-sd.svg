<svg viewBox="0 0 560 370" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Branchement SPI d'un module microSD : SCK vers D13, MOSI vers D11, MISO vers D12, CS vers D10, plus VCC et GND">
  <defs>
    <style>
      .box  { fill:#DDDBD3; stroke:#8a7a55; stroke-width:1.5; }
      .pw   { fill:none; stroke:#6b6b6b; stroke-width:2.4; }
      .bus  { fill:none; stroke:#BA7517; stroke-width:2.6; }
      .dot  { fill:#BA7517; }
      .gdot { fill:#6b6b6b; }
      .t    { fill:#2a2a2a; }
      .tg   { fill:#6b6b6b; }
      @media (prefers-color-scheme: dark) {
        .box  { fill:#3a3a3a; stroke:#b89a5e; }
        .pw   { stroke:#b0b0b0; }
        .bus  { stroke:#E0A040; }
        .dot  { fill:#E0A040; }
        .gdot { fill:#b0b0b0; }
        .t    { fill:#e8e6df; }
        .tg   { fill:#b0b0b0; }
      }
    </style>
  </defs>

  <rect class="box" x="40" y="100" width="150" height="240" rx="6"/>
  <rect class="box" x="400" y="100" width="150" height="240" rx="6"/>
  <text class="t" x="115" y="90" text-anchor="middle" font-size="16" font-weight="bold">Arduino Uno</text>
  <text class="t" x="475" y="90" text-anchor="middle" font-size="16" font-weight="bold">Module microSD</text>

  <text class="t"  x="182" y="140" text-anchor="end" font-size="13">5V</text>
  <text class="tg" x="182" y="175" text-anchor="end" font-size="13">GND</text>
  <text class="t"  x="182" y="210" text-anchor="end" font-size="13">D13 (SCK)</text>
  <text class="t"  x="182" y="245" text-anchor="end" font-size="13">D11 (MOSI)</text>
  <text class="t"  x="182" y="280" text-anchor="end" font-size="13">D12 (MISO)</text>
  <text class="t"  x="182" y="315" text-anchor="end" font-size="13">D10 (CS)</text>
  <circle class="dot"  cx="190" cy="135" r="4.5"/>
  <circle class="gdot" cx="190" cy="170" r="4.5"/>
  <circle class="dot"  cx="190" cy="205" r="4.5"/>
  <circle class="dot"  cx="190" cy="240" r="4.5"/>
  <circle class="dot"  cx="190" cy="275" r="4.5"/>
  <circle class="dot"  cx="190" cy="310" r="4.5"/>

  <text class="t"  x="408" y="140" text-anchor="start" font-size="13">VCC</text>
  <text class="tg" x="408" y="175" text-anchor="start" font-size="13">GND</text>
  <text class="t"  x="408" y="210" text-anchor="start" font-size="13">SCK</text>
  <text class="t"  x="408" y="245" text-anchor="start" font-size="13">MOSI</text>
  <text class="t"  x="408" y="280" text-anchor="start" font-size="13">MISO</text>
  <text class="t"  x="408" y="315" text-anchor="start" font-size="13">CS</text>
  <circle class="dot"  cx="400" cy="135" r="4.5"/>
  <circle class="gdot" cx="400" cy="170" r="4.5"/>
  <circle class="dot"  cx="400" cy="205" r="4.5"/>
  <circle class="dot"  cx="400" cy="240" r="4.5"/>
  <circle class="dot"  cx="400" cy="275" r="4.5"/>
  <circle class="dot"  cx="400" cy="310" r="4.5"/>

  <path class="pw"  d="M190,135 L400,135"/>
  <path class="pw"  d="M190,170 L400,170"/>
  <path class="bus" d="M190,205 L400,205"/>
  <path class="bus" d="M190,240 L400,240"/>
  <path class="bus" d="M190,275 L400,275"/>
  <path class="bus" d="M190,310 L400,310"/>

  <text class="tg" x="280" y="358" text-anchor="middle" font-size="12">SCK / MOSI / MISO partag\u00e9s &#183; un CS d\u00e9di\u00e9 par device (ici D10)</text>
</svg>

<svg viewBox="0 0 560 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <style>
      .h1 { font-size:15px; font-weight:600; fill:#2A2A2A; }
      .sub { font-size:11px; fill:#6E6E6E; }
      .wire { fill:none; stroke:#6E6E6E; stroke-width:2; }
      .boxN { fill:#FFFFFF; stroke:#B9B6AC; stroke-width:1.4; }
      .compLine { fill:none; stroke:#BA7517; stroke-width:2; }
      .dot { fill:#6E6E6E; }
      .lbl { font-size:12px; fill:#2A2A2A; }
      .lblBox { font-size:14px; font-weight:600; fill:#3A3A3A; }
      .lblPin { font-size:11px; font-weight:600; fill:#2A2A2A; }
      .nStrong { font-size:11.5px; font-weight:600; fill:#3A3A3A; }
      .n { font-size:11px; fill:#5A5A5A; }
      @media (prefers-color-scheme: dark) {
        .h1 { fill:#EDEDED; }
        .sub { fill:#A8A8A8; }
        .wire { stroke:#B0B0B0; }
        .boxN { fill:#1F1F1F; stroke:#5A5A5A; }
        .compLine { stroke:#E0A24A; }
        .dot { fill:#B0B0B0; }
        .lbl { fill:#ECECEC; }
        .lblBox { fill:#DADADA; }
        .lblPin { fill:#ECECEC; }
        .nStrong { fill:#DADADA; }
        .n { fill:#B0B0B0; }
      }
    </style>
  </defs>

  <text x="280" y="26" class="h1" text-anchor="middle">Câblage — bouton (entrée tout-ou-rien) sur Pico</text>
  <text x="280" y="46" class="sub" text-anchor="middle">Broche du code : GP14, en entrée avec tirage interne (PULL_UP)</text>

  <rect x="44" y="72" width="140" height="120" rx="10" class="boxN"/>
  <text x="114" y="98" class="lblBox" text-anchor="middle">Pico</text>
  <text x="176" y="120" class="lblPin" text-anchor="end">GP14</text>
  <text x="176" y="172" class="lblPin" text-anchor="end">GND</text>

  <circle cx="184" cy="116" r="3" class="dot"/>
  <line x1="184" y1="116" x2="300" y2="116" class="wire"/>

  <circle cx="300" cy="116" r="3" class="dot"/>
  <circle cx="344" cy="116" r="3" class="dot"/>
  <line x1="300" y1="116" x2="300" y2="104" class="compLine"/>
  <line x1="344" y1="116" x2="344" y2="104" class="compLine"/>
  <line x1="294" y1="104" x2="350" y2="104" class="compLine"/>
  <line x1="322" y1="104" x2="322" y2="94" class="compLine"/>
  <text x="322" y="140" class="lbl" text-anchor="middle">Bouton</text>

  <line x1="344" y1="116" x2="460" y2="116" class="wire"/>
  <line x1="460" y1="116" x2="460" y2="168" class="wire"/>
  <line x1="460" y1="168" x2="184" y2="168" class="wire"/>
  <circle cx="184" cy="168" r="3" class="dot"/>

  <text x="44" y="226" class="nStrong" text-anchor="start">Bon à savoir</text>
  <text x="44" y="244" class="n" text-anchor="start">Au repos GP14 lit 1 (tiré au 3,3 V en interne) ; l'appui relie la broche à GND, qui lit alors 0.</text>
  <text x="44" y="262" class="n" text-anchor="start">Anti-rebond : après un changement, ignorer les lectures pendant ~20 ms (le contact « rebondit »).</text>
</svg>
<svg viewBox="0 0 580 348" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <style>
      .h1 { font-size:15px; font-weight:600; fill:#2A2A2A; }
      .sub { font-size:11px; fill:#6E6E6E; }
      .wire { fill:none; stroke:#6E6E6E; stroke-width:2; }
      .boxN { fill:#FFFFFF; stroke:#B9B6AC; stroke-width:1.4; }
      .compLine { fill:none; stroke:#BA7517; stroke-width:2; }
      .compFill { fill:#BA7517; stroke:#BA7517; stroke-width:2; }
      .dot { fill:#6E6E6E; }
      .lbl { font-size:12px; fill:#2A2A2A; }
      .lblBox { font-size:14px; font-weight:600; fill:#3A3A3A; }
      .lblPin { font-size:11px; font-weight:600; fill:#2A2A2A; }
      .nStrong { font-size:11.5px; font-weight:600; fill:#3A3A3A; }
      .n { font-size:11px; fill:#5A5A5A; }
      @media (prefers-color-scheme: dark) {
        .h1 { fill:#EDEDED; }
        .sub { fill:#A8A8A8; }
        .wire { stroke:#B0B0B0; }
        .boxN { fill:#1F1F1F; stroke:#5A5A5A; }
        .compLine { stroke:#E0A24A; }
        .compFill { fill:#E0A24A; stroke:#E0A24A; }
        .dot { fill:#B0B0B0; }
        .lbl { fill:#ECECEC; }
        .lblBox { fill:#DADADA; }
        .lblPin { fill:#ECECEC; }
        .nStrong { fill:#DADADA; }
        .n { fill:#B0B0B0; }
      }
    </style>
  </defs>

  <text x="290" y="26" class="h1" text-anchor="middle">Câblage — bouton (GP14) + LED (GP15) sur Pico</text>
  <text x="290" y="46" class="sub" text-anchor="middle">Broches du code : bouton en entrée PULL_UP sur GP14, LED en sortie sur GP15</text>

  <rect x="44" y="78" width="150" height="200" rx="10" class="boxN"/>
  <text x="119" y="104" class="lblBox" text-anchor="middle">Pico</text>
  <text x="186" y="132" class="lblPin" text-anchor="end">GP14</text>
  <text x="186" y="186" class="lblPin" text-anchor="end">GP15</text>
  <text x="186" y="250" class="lblPin" text-anchor="end">GND</text>

  <!-- Branche bouton : GP14 vers bouton vers GND -->
  <circle cx="194" cy="128" r="3" class="dot"/>
  <line x1="194" y1="128" x2="300" y2="128" class="wire"/>
  <circle cx="300" cy="128" r="3" class="dot"/>
  <circle cx="344" cy="128" r="3" class="dot"/>
  <line x1="300" y1="128" x2="300" y2="116" class="compLine"/>
  <line x1="344" y1="128" x2="344" y2="116" class="compLine"/>
  <line x1="294" y1="116" x2="350" y2="116" class="compLine"/>
  <line x1="322" y1="116" x2="322" y2="106" class="compLine"/>
  <text x="322" y="150" class="lbl" text-anchor="middle">Bouton</text>
  <line x1="344" y1="128" x2="470" y2="128" class="wire"/>
  <line x1="470" y1="128" x2="470" y2="246" class="wire"/>

  <!-- Branche LED : GP15 vers resistance vers LED vers GND -->
  <circle cx="194" cy="182" r="3" class="dot"/>
  <line x1="194" y1="182" x2="252" y2="182" class="wire"/>
  <rect x="252" y="174" width="46" height="16" class="compLine"/>
  <text x="275" y="168" class="lbl" text-anchor="middle">220 Ω</text>
  <line x1="298" y1="182" x2="352" y2="182" class="wire"/>
  <path d="M352,172 L352,192 L372,182 Z" class="compFill"/>
  <line x1="372" y1="172" x2="372" y2="192" class="compLine"/>
  <text x="362" y="210" class="lbl" text-anchor="middle">LED</text>
  <line x1="372" y1="182" x2="430" y2="182" class="wire"/>
  <line x1="430" y1="182" x2="430" y2="246" class="wire"/>

  <!-- Rail GND commun -->
  <circle cx="194" cy="246" r="3" class="dot"/>
  <line x1="194" y1="246" x2="470" y2="246" class="wire"/>
  <circle cx="430" cy="246" r="3" class="dot"/>
  <circle cx="470" cy="246" r="3" class="dot"/>

  <text x="44" y="300" class="nStrong" text-anchor="start">Bon à savoir</text>
  <text x="44" y="318" class="n" text-anchor="start">Bouton : repos GP14 lit 1 (tiré au 3,3 V en interne) ; l'appui relie à GND, qui lit 0.</text>
  <text x="44" y="336" class="n" text-anchor="start">LED sur GP15 via 220 Ω vers GND ; allumée quand GP15 vaut 1 (réutilisée dans l'exemple).</text>
</svg>

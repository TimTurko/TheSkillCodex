<svg viewBox="0 0 720 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Montage du carrefour sur Pico : cinq LED avec resistances 220 ohms sur les broches GP12 GP11 GP10 GP9 GP8, et un bouton entre GP14 et GND, broches nommees comme dans le code">
  <defs>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#33312B;}
      .t-title{font-size:13px;font-weight:600;}
      .pin{font-size:11px;font-weight:600;}
      .role{font-size:11px;fill:#6B6862;}
      .t-sm{font-size:11px;fill:#6B6862;}
      .box{fill:#DDDBD3;stroke:#9A958A;stroke-width:1.5;}
      .wire{stroke:#7A766C;stroke-width:2;fill:none;}
      .amber{stroke:#BA7517;stroke-width:2;fill:none;}
      .amber-f{fill:#F3E4C8;stroke:#BA7517;stroke-width:2;}
      .led{fill:none;stroke:#BA7517;stroke-width:2;}
      .led-f{fill:#BA7517;}
      .node{fill:#7A766C;}
      @media (prefers-color-scheme: dark){
        text{fill:#DDDBD3;}
        .role,.t-sm{fill:#A9A59B;}
        .box{fill:#3B3A34;stroke:#8A867C;}
        .wire{stroke:#A9A59B;}
        .amber{stroke:#E0A24A;}
        .amber-f{fill:#4A3E26;stroke:#E0A24A;}
        .led{stroke:#E0A24A;}
        .led-f{fill:#E0A24A;}
        .node{fill:#A9A59B;}
      }
    </style>
  </defs>

  <text class="t-title" x="100" y="40" text-anchor="middle">Pico</text>
  <rect class="box" x="40" y="55" width="120" height="330"/>

  <text class="pin" x="152" y="100" text-anchor="end">GP12</text>
  <text class="pin" x="152" y="150" text-anchor="end">GP11</text>
  <text class="pin" x="152" y="200" text-anchor="end">GP10</text>
  <text class="pin" x="152" y="250" text-anchor="end">GP9</text>
  <text class="pin" x="152" y="300" text-anchor="end">GP8</text>
  <text class="pin" x="152" y="350" text-anchor="end">GP14</text>
  <text class="pin" x="152" y="378" text-anchor="end">GND</text>

  <line class="wire" x1="160" y1="378" x2="678" y2="378"/>
  <line class="wire" x1="678" y1="96" x2="678" y2="378"/>
  <text class="t-sm" x="686" y="382" text-anchor="start">GND</text>

  <text class="t-sm" x="273" y="78" text-anchor="middle">220 Ω</text>

  <!-- GP12 FEU_VERT -->
  <line class="wire" x1="160" y1="96" x2="250" y2="96"/>
  <rect class="amber-f" x="250" y="88" width="46" height="16"/>
  <line class="wire" x1="296" y1="96" x2="360" y2="96"/>
  <polygon class="led" points="360,88 360,104 376,96"/>
  <line class="led" x1="376" y1="88" x2="376" y2="104"/>
  <line class="wire" x1="376" y1="96" x2="678" y2="96"/>
  <text class="role" x="392" y="92" text-anchor="start">FEU_VERT — LED verte voiture</text>

  <!-- GP11 FEU_JAUNE -->
  <line class="wire" x1="160" y1="146" x2="250" y2="146"/>
  <rect class="amber-f" x="250" y="138" width="46" height="16"/>
  <line class="wire" x1="296" y1="146" x2="360" y2="146"/>
  <polygon class="led" points="360,138 360,154 376,146"/>
  <line class="led" x1="376" y1="138" x2="376" y2="154"/>
  <line class="wire" x1="376" y1="146" x2="678" y2="146"/>
  <text class="role" x="392" y="142" text-anchor="start">FEU_JAUNE — LED orange voiture</text>

  <!-- GP10 FEU_ROUGE -->
  <line class="wire" x1="160" y1="196" x2="250" y2="196"/>
  <rect class="amber-f" x="250" y="188" width="46" height="16"/>
  <line class="wire" x1="296" y1="196" x2="360" y2="196"/>
  <polygon class="led" points="360,188 360,204 376,196"/>
  <line class="led" x1="376" y1="188" x2="376" y2="204"/>
  <line class="wire" x1="376" y1="196" x2="678" y2="196"/>
  <text class="role" x="392" y="192" text-anchor="start">FEU_ROUGE — LED rouge voiture</text>

  <!-- GP9 PIETON_VERT -->
  <line class="wire" x1="160" y1="246" x2="250" y2="246"/>
  <rect class="amber-f" x="250" y="238" width="46" height="16"/>
  <line class="wire" x1="296" y1="246" x2="360" y2="246"/>
  <polygon class="led" points="360,238 360,254 376,246"/>
  <line class="led" x1="376" y1="238" x2="376" y2="254"/>
  <line class="wire" x1="376" y1="246" x2="678" y2="246"/>
  <text class="role" x="392" y="242" text-anchor="start">PIETON_VERT — LED verte piéton</text>

  <!-- GP8 PIETON_ROUGE -->
  <line class="wire" x1="160" y1="296" x2="250" y2="296"/>
  <rect class="amber-f" x="250" y="288" width="46" height="16"/>
  <line class="wire" x1="296" y1="296" x2="360" y2="296"/>
  <polygon class="led" points="360,288 360,304 376,296"/>
  <line class="led" x1="376" y1="288" x2="376" y2="304"/>
  <line class="wire" x1="376" y1="296" x2="678" y2="296"/>
  <text class="role" x="392" y="292" text-anchor="start">PIETON_ROUGE — LED rouge piéton</text>

  <!-- GP14 button branch -->
  <line class="wire" x1="160" y1="346" x2="360" y2="346"/>
  <line class="amber" x1="360" y1="346" x2="392" y2="334"/>
  <circle class="node" cx="360" cy="346" r="3"/>
  <circle class="node" cx="404" cy="346" r="3"/>
  <line class="wire" x1="404" y1="346" x2="678" y2="346"/>
  <text class="role" x="420" y="342" text-anchor="start">BOUTON — poussoir (PULL_UP, actif-bas)</text>

  <text class="t-sm" x="40" y="412" text-anchor="start">Chaque broche du schéma porte le nom du code : FEU_VERT = GP12, FEU_JAUNE = GP11, FEU_ROUGE = GP10, PIETON_VERT = GP9, PIETON_ROUGE = GP8.</text>
  <text class="t-sm" x="40" y="430" text-anchor="start">Une LED s'allume quand sa broche passe à HIGH ; le bouton n'a pas de résistance externe (pull-up interne).</text>
</svg>

<svg viewBox="0 0 560 290" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <style>
      .h1 { font-size:15px; font-weight:600; fill:#2A2A2A; }
      .sub { font-size:11px; fill:#6E6E6E; }
      .wire { fill:none; stroke:#6E6E6E; stroke-width:2; }
      .boxN { fill:#FFFFFF; stroke:#B9B6AC; stroke-width:1.4; }
      .comp { fill:#F7EBD6; stroke:#BA7517; stroke-width:1.6; }
      .dot { fill:#6E6E6E; }
      .lbl { font-size:12px; fill:#2A2A2A; }
      .lblBox { font-size:14px; font-weight:600; fill:#3A3A3A; }
      .lblPin { font-size:11px; font-weight:600; fill:#2A2A2A; }
      .nStrong { font-size:11.5px; font-weight:600; fill:#3A3A3A; }
      .n { font-size:11px; fill:#5A5A5A; }
      @media (prefers-color-scheme: dark) {
        .h1 { fill:#EDEDED; }
        .sub { fill:#A8A8A8; }
        .wire { stroke:#B0B0B0; }
        .boxN { fill:#1F1F1F; stroke:#5A5A5A; }
        .comp { fill:#3A2E19; stroke:#E0A24A; }
        .dot { fill:#B0B0B0; }
        .lbl { fill:#ECECEC; }
        .lblBox { fill:#DADADA; }
        .lblPin { fill:#ECECEC; }
        .nStrong { fill:#DADADA; }
        .n { fill:#B0B0B0; }
      }
    </style>
  </defs>

  <text x="280" y="26" class="h1" text-anchor="middle">Câblage — module DHT11 sur le Pico</text>
  <text x="280" y="46" class="sub" text-anchor="middle">Broche du code : OUT → GP2 · alimentation 3,3 V</text>

  <!-- Pico -->
  <rect x="44" y="84" width="140" height="150" rx="10" class="boxN"/>
  <text x="114" y="110" class="lblBox" text-anchor="middle">Pico</text>
  <text x="176" y="134" class="lblPin" text-anchor="end">3V3</text>
  <text x="176" y="169" class="lblPin" text-anchor="end">GP2</text>
  <text x="176" y="204" class="lblPin" text-anchor="end">GND</text>
  <circle cx="184" cy="130" r="3" class="dot"/>
  <circle cx="184" cy="165" r="3" class="dot"/>
  <circle cx="184" cy="200" r="3" class="dot"/>

  <!-- DHT11 -->
  <rect x="386" y="116" width="120" height="110" rx="8" class="comp"/>
  <text x="446" y="108" class="lbl" text-anchor="middle">DHT11</text>
  <circle cx="386" cy="130" r="3" class="dot"/>
  <circle cx="386" cy="165" r="3" class="dot"/>
  <circle cx="386" cy="200" r="3" class="dot"/>
  <text x="398" y="134" class="lblPin" text-anchor="start">+</text>
  <text x="398" y="169" class="lblPin" text-anchor="start">OUT</text>
  <text x="398" y="204" class="lblPin" text-anchor="start">−</text>

  <!-- Fils -->
  <line x1="184" y1="130" x2="386" y2="130" class="wire"/>
  <line x1="184" y1="165" x2="386" y2="165" class="wire"/>
  <line x1="184" y1="200" x2="386" y2="200" class="wire"/>
  <text x="285" y="124" class="n" text-anchor="middle">3,3 V</text>
  <text x="285" y="159" class="n" text-anchor="middle">données</text>
  <text x="285" y="194" class="n" text-anchor="middle">masse</text>

  <text x="44" y="262" class="nStrong" text-anchor="start">Bon à savoir</text>
  <text x="44" y="280" class="n" text-anchor="start">Module 3 broches alimenté en 3,3 V ; la résistance de tirage sur OUT est intégrée. 1 mesure/s max.</text>
</svg>

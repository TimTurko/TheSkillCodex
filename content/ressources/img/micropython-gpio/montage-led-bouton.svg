<svg viewBox="0 0 640 384" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <style>
      .h1 { font-size:16px; font-weight:600; fill:#2A2A2A; }
      .sub { font-size:11px; fill:#6E6E6E; }
      .wire { fill:none; stroke:#6E6E6E; stroke-width:2; }
      .boxN { fill:#FFFFFF; stroke:#B9B6AC; stroke-width:1.4; }
      .comp { fill:#F7EBD6; stroke:#BA7517; stroke-width:1.6; }
      .compLine { fill:none; stroke:#BA7517; stroke-width:2; }
      .dot { fill:#6E6E6E; }
      .lbl { font-size:12px; fill:#2A2A2A; }
      .lblBox { font-size:14px; font-weight:600; fill:#3A3A3A; }
      .lblPin { font-size:11px; font-weight:600; fill:#2A2A2A; }
      .nStrong { font-size:11.5px; font-weight:600; fill:#3A3A3A; }
      .n { font-size:11px; fill:#5A5A5A; }
      @media (prefers-color-scheme: dark) {
        .h1 { fill:#EDEDED; }
        .sub { fill:#A8A8A8; }
        .wire { stroke:#B0B0B0; }
        .boxN { fill:#1F1F1F; stroke:#5A5A5A; }
        .comp { fill:#3A2E19; stroke:#E0A24A; }
        .compLine { stroke:#E0A24A; }
        .dot { fill:#B0B0B0; }
        .lbl { fill:#ECECEC; }
        .lblBox { fill:#DADADA; }
        .lblPin { fill:#ECECEC; }
        .nStrong { fill:#DADADA; }
        .n { fill:#B0B0B0; }
      }
    </style>
  </defs>

  <text x="320" y="28" class="h1" text-anchor="middle">Câblage — LED et bouton sur Pico (MicroPython)</text>
  <text x="320" y="48" class="sub" text-anchor="middle">Les noms de broches sont ceux du code : GP15, GP14, GND</text>

  <rect x="44" y="110" width="150" height="180" rx="10" class="boxN"/>
  <text x="119" y="136" class="lblBox" text-anchor="middle">Pico</text>
  <text x="186" y="164" class="lblPin" text-anchor="end">GP15</text>
  <text x="186" y="228" class="lblPin" text-anchor="end">GP14</text>
  <text x="186" y="274" class="lblPin" text-anchor="end">GND</text>

  <circle cx="194" cy="160" r="3" class="dot"/>
  <line x1="194" y1="160" x2="300" y2="160" class="wire"/>
  <rect x="300" y="149" width="56" height="22" rx="2" class="comp"/>
  <text x="328" y="142" class="lbl" text-anchor="middle">R 220 Ω</text>
  <line x1="356" y1="160" x2="430" y2="160" class="wire"/>
  <polygon points="430,150 430,170 456,160" class="comp"/>
  <line x1="456" y1="150" x2="456" y2="170" class="compLine"/>
  <line x1="446" y1="146" x2="456" y2="136" class="compLine"/>
  <line x1="438" y1="148" x2="448" y2="138" class="compLine"/>
  <text x="443" y="190" class="lbl" text-anchor="middle">LED</text>
  <line x1="456" y1="160" x2="560" y2="160" class="wire"/>

  <circle cx="194" cy="224" r="3" class="dot"/>
  <line x1="194" y1="224" x2="358" y2="224" class="wire"/>
  <line x1="358" y1="224" x2="358" y2="212" class="compLine"/>
  <line x1="386" y1="224" x2="386" y2="212" class="compLine"/>
  <line x1="352" y1="210" x2="392" y2="210" class="compLine"/>
  <line x1="372" y1="210" x2="372" y2="200" class="compLine"/>
  <line x1="386" y1="224" x2="560" y2="224" class="wire"/>
  <text x="372" y="248" class="lbl" text-anchor="middle">Bouton</text>

  <line x1="194" y1="270" x2="560" y2="270" class="wire"/>
  <line x1="560" y1="160" x2="560" y2="286" class="wire"/>
  <circle cx="560" cy="160" r="3" class="dot"/>
  <circle cx="560" cy="224" r="3" class="dot"/>
  <circle cx="560" cy="270" r="3" class="dot"/>
  <line x1="548" y1="286" x2="572" y2="286" class="wire"/>
  <line x1="552" y1="291" x2="568" y2="291" class="wire"/>
  <line x1="556" y1="296" x2="564" y2="296" class="wire"/>
  <text x="560" y="314" class="lbl" text-anchor="middle">GND</text>

  <text x="44" y="338" class="nStrong" text-anchor="start">Bon à savoir</text>
  <text x="44" y="356" class="n" text-anchor="start">Pin(14, Pin.IN, Pin.PULL_UP) active la résistance interne : au repos GP14 lit 1 ; l'appui le relie à GND (0).</text>
  <text x="44" y="372" class="n" text-anchor="start">Pas de résistance pour le bouton. La résistance de 220 Ω protège la LED. Logique 3,3 V.</text>
</svg>
<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Carte memoire d'un Arduino : en haut la Flash de 32 Ko (programme en lecture seule, plus les constantes deportees par F() et PROGMEM) ; en bas la SRAM de 2 Ko decoupee en variables globales fixes, tas qui grandit vers la droite, espace libre, et pile qui grandit vers la gauche ; si tas et pile se rejoignent, c'est le plantage ; une fleche montre F() et PROGMEM sortant les constantes de la SRAM vers la Flash">
  <defs>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#33312B;}
      .t-title{font-size:13px;font-weight:600;}
      .zlbl{font-size:11px;font-weight:600;}
      .sub{font-size:10px;fill:#6B6862;}
      .lbl{font-size:11px;fill:#6B6862;}
      .bar{fill:#DDDBD3;stroke:#9A958A;stroke-width:1.4;}
      .const{fill:#F3E4C8;stroke:#BA7517;stroke-width:1.6;}
      .free{fill:none;stroke:#BFB8A6;stroke-width:1.4;stroke-dasharray:5 4;}
      .div{stroke:#9A958A;stroke-width:1.2;}
      .gr{stroke:#BA7517;stroke-width:2.2;fill:none;}
      .arrh{fill:#BA7517;}
      @media (prefers-color-scheme: dark){
        text{fill:#DDDBD3;}
        .sub,.lbl{fill:#A9A59B;}
        .bar{fill:#3B3A34;stroke:#8A867C;}
        .const{fill:#4A3E26;stroke:#E0A24A;}
        .free{stroke:#5A574E;}
        .div{stroke:#8A867C;}
        .gr{stroke:#E0A24A;}
        .arrh{fill:#E0A24A;}
      }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" class="arrh"/></marker>
  </defs>

  <!-- FLASH -->
  <text class="t-title" x="60" y="58" text-anchor="start">Flash — 32 Ko · programme (lecture seule)</text>
  <rect class="bar"   x="60"  y="68" width="480" height="40"/>
  <text class="zlbl"  x="300" y="92" text-anchor="middle">code du programme</text>
  <rect class="const" x="540" y="68" width="160" height="40"/>
  <text class="zlbl"  x="620" y="86" text-anchor="middle">constantes</text>
  <text class="sub"   x="620" y="100" text-anchor="middle">F() · PROGMEM</text>

  <!-- flèche F() : de la SRAM vers la Flash -->
  <path class="gr" d="M250,196 C300,150 520,150 600,112" marker-end="url(#ah)"/>
  <text class="lbl" x="430" y="150" text-anchor="middle">F() / PROGMEM : sortir les constantes de la SRAM</text>

  <!-- SRAM -->
  <text class="t-title" x="60" y="190" text-anchor="start">SRAM — 2 Ko · variables (mémoire vive, la ressource rare)</text>

  <!-- zones -->
  <rect class="bar"  x="60"  y="200" width="140" height="52"/>
  <text class="zlbl" x="130" y="222" text-anchor="middle">globales /</text>
  <text class="zlbl" x="130" y="236" text-anchor="middle">statiques</text>
  <text class="sub"  x="130" y="249" text-anchor="middle">(fixe)</text>

  <rect class="bar"  x="200" y="200" width="110" height="52"/>
  <text class="zlbl" x="255" y="226" text-anchor="middle">tas</text>
  <text class="sub"  x="255" y="240" text-anchor="middle">(heap)</text>

  <rect class="free" x="310" y="200" width="230" height="52"/>
  <text class="lbl"  x="425" y="224" text-anchor="middle">espace libre</text>
  <text class="sub"  x="425" y="240" text-anchor="middle">mesuré par freeMemory()</text>

  <rect class="bar"  x="540" y="200" width="160" height="52"/>
  <text class="zlbl" x="620" y="226" text-anchor="middle">pile</text>
  <text class="sub"  x="620" y="240" text-anchor="middle">(stack)</text>

  <!-- sens de croissance, convergence dans l'espace libre -->
  <line class="gr" x1="320" y1="176" x2="360" y2="176" marker-end="url(#ah)"/>
  <text class="sub" x="318" y="172" text-anchor="end">le tas grandit →</text>
  <line class="gr" x1="530" y1="176" x2="490" y2="176" marker-end="url(#ah)"/>
  <text class="sub" x="538" y="172" text-anchor="start">← la pile grandit</text>

  <text class="lbl" x="425" y="284" text-anchor="middle">s'ils se rejoignent dans l'espace libre, c'est le plantage</text>
</svg>

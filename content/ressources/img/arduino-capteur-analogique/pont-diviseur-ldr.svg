<svg viewBox="0 0 620 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pont diviseur LDR : la LDR et une résistance fixe de 10 kΩ sont en série entre +5 V et GND ; le point milieu est lu sur A1. La résistance de la LDR varie avec la lumière, ce qui déplace la tension du point milieu.">
  <defs>
    <style>
      .board { fill: #EFEEE9; stroke: #B8B5AC; stroke-width: 2; }
      .board-txt { fill: #4A4843; font-family: "Segoe UI", system-ui, sans-serif; font-size: 16px; font-weight: 700; }
      .ldr { fill: #F3E2C7; stroke: #BA7517; stroke-width: 2; }
      .res { fill: #EFEEE9; stroke: #B8B5AC; stroke-width: 2; }
      .comp-txt { fill: #8A5512; font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; font-weight: 700; }
      .res-txt { fill: #4A4843; font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; font-weight: 600; }
      .pin { fill: #4A4843; font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; font-weight: 600; }
      .wire { stroke: #4A4843; stroke-width: 2.5; fill: none; }
      .wlbl { fill: #5B5953; font-family: "Segoe UI", system-ui, sans-serif; font-size: 12px; }
      .node { fill: #4A4843; }
      .pad { fill: #BA7517; }
      .pad-b { fill: #6D6A61; }
      .light { stroke: #BA7517; stroke-width: 2; fill: none; }
      .lighthead { fill: #BA7517; }
      .note { fill: #8A5512; font-family: "Segoe UI", system-ui, sans-serif; font-size: 12px; font-style: italic; }
      .title { fill: #4A4843; font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; font-weight: 700; }
      @media (prefers-color-scheme: dark) {
        .board { fill: #2C2B27; stroke: #6D6A61; }
        .board-txt { fill: #D8D6CF; }
        .ldr { fill: #3A2F1D; stroke: #E0A24A; }
        .res { fill: #2C2B27; stroke: #6D6A61; }
        .comp-txt, .note { fill: #E0A24A; }
        .res-txt, .pin { fill: #D8D6CF; }
        .wire { stroke: #D8D6CF; }
        .node { fill: #D8D6CF; }
        .wlbl { fill: #B7B4AC; }
        .pad { fill: #E0A24A; }
        .pad-b { fill: #9A968C; }
        .light { stroke: #E0A24A; }
        .lighthead { fill: #E0A24A; }
        .title { fill: #D8D6CF; }
      }
    </style>
    <marker id="ldr-lh" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path class="lighthead" d="M0,0 L8,4 L0,8 Z"/>
    </marker>
  </defs>

  <text class="title" x="310" y="26" text-anchor="middle">Pont diviseur LDR sur A1</text>

  <!-- Arduino Uno -->
  <rect class="board" x="40" y="70" width="140" height="200" rx="10"/>
  <text class="board-txt" x="110" y="58" text-anchor="middle">Arduino Uno</text>
  <circle class="pad" cx="180" cy="95" r="4"/>
  <text class="pin" x="168" y="99" text-anchor="end">+5V</text>
  <circle class="pad" cx="180" cy="185" r="4"/>
  <text class="pin" x="168" y="189" text-anchor="end">A1</text>
  <circle class="pad-b" cx="180" cy="295" r="4"/>
  <text class="pin" x="168" y="299" text-anchor="end">GND</text>

  <!-- LDR (haut) -->
  <rect class="ldr" x="480" y="100" width="34" height="60" rx="4"/>
  <text class="comp-txt" x="524" y="125" text-anchor="start">LDR</text>
  <!-- flèches de lumière vers la LDR -->
  <line class="light" x1="560" y1="108" x2="520" y2="124" marker-end="url(#ldr-lh)"/>
  <line class="light" x1="560" y1="132" x2="520" y2="148" marker-end="url(#ldr-lh)"/>
  <text class="comp-txt" x="566" y="150" text-anchor="start">lumière</text>

  <!-- Résistance fixe (bas) -->
  <rect class="res" x="480" y="210" width="34" height="60" rx="4"/>
  <text class="res-txt" x="524" y="245" text-anchor="start">10 kΩ</text>

  <!-- Liaison LDR-bas -> R-haut (le noeud) -->
  <path class="wire" d="M497,160 L497,210"/>
  <circle class="node" cx="497" cy="185" r="4"/>

  <!-- Wires -->
  <!-- +5V -> haut LDR -->
  <path class="wire" d="M180,95 L497,95 L497,100"/>
  <text class="wlbl" x="330" y="87" text-anchor="middle">+5 V</text>
  <!-- noeud -> A1 -->
  <path class="wire" d="M497,185 L180,185"/>
  <text class="wlbl" x="320" y="177" text-anchor="middle">point milieu → A1</text>
  <!-- bas R -> GND -->
  <path class="wire" d="M497,270 L497,295 L180,295"/>
  <text class="wlbl" x="330" y="312" text-anchor="middle">GND</text>

  <!-- Note -->
  <text class="note" x="300" y="120" text-anchor="middle">La résistance de la LDR varie<tspan x="300" dy="15">avec la lumière → la tension du</tspan><tspan x="300" dy="15">point milieu monte ou descend.</tspan></text>
</svg>

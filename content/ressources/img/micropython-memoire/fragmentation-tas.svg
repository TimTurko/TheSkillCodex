<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" role="img" aria-label="Fragmentation du tas : le tas est rempli de petits blocs occupes separes par plusieurs trous libres ; la somme des trous (220) est grande, mais le plus grand trou contigu ne fait que 55, donc un objet de 120 ne tient dans aucun trou et l'allocation echoue par MemoryError, alors qu'il reste de la memoire au total.">
  <defs>
    <style>
      .h1 { font-size:15px; font-weight:600; fill:#2A2A2A; }
      .sub { font-size:11px; fill:#6E6E6E; }
      .lbl { font-size:11.5px; font-weight:600; fill:#3A3A3A; }
      .n { font-size:10.5px; fill:#5A5A5A; }
      .occ { fill:#EAC58C; stroke:#BA7517; stroke-width:1.3; }
      .free { fill:#EFEDE6; stroke:#B9B6AC; stroke-width:1.2; }
      .barbase { fill:#EFEDE6; stroke:#9A958A; stroke-width:1.4; }
      .obj { fill:#F3E4C8; stroke:#BA7517; stroke-width:1.6; stroke-dasharray:5 3; }
      .err { font-size:12.5px; font-weight:700; fill:#B23B3B; }
      .gapmark { stroke:#BA7517; stroke-width:1.2; fill:none; }
      .arr { stroke:#7A766C; stroke-width:1.6; fill:none; }
      .cross { font-size:15px; font-weight:700; fill:#B23B3B; }
      @media (prefers-color-scheme: dark) {
        .h1 { fill:#EDEDED; }
        .sub { fill:#A8A8A8; }
        .lbl { fill:#DADADA; }
        .n { fill:#B0B0B0; }
        .occ { fill:#4A3E26; stroke:#E0A24A; }
        .free { fill:#2C2C2C; stroke:#7A766C; }
        .barbase { fill:#2C2C2C; stroke:#7A766C; }
        .obj { fill:#3A2E19; stroke:#E0A24A; }
        .err { fill:#E88; }
        .gapmark { stroke:#E0A24A; }
        .arr { stroke:#A9A59B; }
        .cross { fill:#E88; }
      }
    </style>
  </defs>

  <text x="40" y="26" class="h1" text-anchor="start">Fragmentation : il « reste » de la mémoire, mais pas d'un seul tenant</text>
  <text x="40" y="46" class="sub" text-anchor="start">Beaucoup de petits objets créés puis libérés laissent le tas troué.</text>

  <!-- légende couleurs -->
  <rect class="occ" x="520" y="36" width="16" height="12"/>
  <text x="542" y="46" class="n" text-anchor="start">occupé</text>
  <rect class="free" x="610" y="36" width="16" height="12"/>
  <text x="632" y="46" class="n" text-anchor="start">libre (trou)</text>

  <text x="40" y="80" class="lbl" text-anchor="start">tas (heap)</text>

  <!-- base du tas (les trous apparaissent en clair) -->
  <rect class="barbase" x="40" y="88" width="680" height="46" rx="3"/>
  <!-- blocs occupés -->
  <rect class="occ" x="40"  y="88" width="80"  height="46"/>
  <rect class="occ" x="160" y="88" width="60"  height="46"/>
  <rect class="occ" x="270" y="88" width="100" height="46"/>
  <rect class="occ" x="415" y="88" width="70"  height="46"/>
  <rect class="occ" x="540" y="88" width="90"  height="46"/>
  <rect class="occ" x="660" y="88" width="60"  height="46"/>

  <!-- repère du plus grand trou (485..540 = 55) -->
  <path class="gapmark" d="M485,140 L485,148 L540,148 L540,140"/>
  <text x="512" y="160" class="n" text-anchor="middle">plus grand trou : 55</text>

  <!-- total libre -->
  <text x="40" y="184" class="n" text-anchor="start">total libre = 40 + 50 + 45 + 55 + 30 = <tspan font-weight="700">220</tspan> — assez « en théorie »</text>

  <!-- objet à allouer -->
  <text x="40" y="218" class="lbl" text-anchor="start">objet à allouer : 120</text>
  <rect class="obj" x="40" y="226" width="120" height="30" rx="3"/>
  <text x="100" y="245" class="n" text-anchor="middle">120</text>

  <!-- flèche + échec -->
  <path class="arr" d="M168,241 L250,241" marker-end="url(#ah)"/>
  <text x="262" y="238" class="cross" text-anchor="start">✗</text>
  <text x="284" y="245" class="n" text-anchor="start">ne tient dans aucun trou (le plus grand ne fait que 55)</text>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" class="arr" fill="#7A766C"/></marker>
  </defs>

  <text x="40" y="288" class="err" text-anchor="start">→ MemoryError, alors qu'il « reste » 220 au total : la mémoire est fragmentée.</text>

  <text x="40" y="314" class="n" text-anchor="start">Le ramasse-miettes libère l'inutilisé mais ne défragmente pas assez : on limite les allocations pour ne pas en arriver là.</text>
</svg>

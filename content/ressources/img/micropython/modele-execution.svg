<svg viewBox="0 0 720 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparaison du modele d'execution : approche compilee (C++/Arduino) versus approche scriptee (MicroPython)">
  <defs>
    <style>
      text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; fill: #2C2C2A; }
      .title  { font-size: 16px; font-weight: 700; }
      .sub    { font-size: 11.5px; fill: #888780; }
      .lbl    { font-size: 12.5px; }
      .lblc   { font-size: 12.5px; font-weight: 600; }
      .looptxt{ font-size: 11px; font-weight: 600; fill: #BA7517; }
      .box    { fill: #DDDBD3; stroke: #BA7517; stroke-width: 1.5; rx: 6; }
      .boxw   { fill: #FFFFFF; stroke: #BA7517; stroke-width: 1.5; rx: 6; }
      .once   { fill: #FFFFFF; stroke: #BA7517; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 6; }
      .flow   { stroke: #2C2C2A; stroke-width: 2; fill: none; }
      .loop   { stroke: #BA7517; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
      .divider{ stroke: #888780; stroke-width: 1; stroke-dasharray: 3 3; }
      .arrowhead { fill: #2C2C2A; }
      .arrowheadA { fill: #BA7517; }
      @media (prefers-color-scheme: dark) {
        text { fill: #F1EFE8; }
        .sub { fill: #BBBBBB; }
        .looptxt { fill: #EF9F27; }
        .box  { fill: #4A4A48; stroke: #EF9F27; }
        .boxw { fill: #3A3A38; stroke: #EF9F27; }
        .once { fill: #3A3A38; stroke: #EF9F27; }
        .flow { stroke: #F1EFE8; }
        .loop { stroke: #EF9F27; }
        .divider { stroke: #BBBBBB; }
        .arrowhead { fill: #F1EFE8; }
        .arrowheadA { fill: #EF9F27; }
      }
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path class="arrowhead" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="arA" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path class="arrowheadA" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <!-- ===== Colonne gauche : compilee ===== -->
  <text x="200" y="30" text-anchor="middle" class="title">Approche compilée</text>
  <text x="200" y="48" text-anchor="middle" class="sub">C++ / Arduino</text>

  <rect class="boxw" x="100" y="64"  width="200" height="40"/>
  <text x="200" y="89"  text-anchor="middle" class="lbl">Écrire le code <tspan font-family="monospace">.cpp</tspan></text>

  <rect class="box"  x="100" y="138" width="200" height="40"/>
  <text x="200" y="163" text-anchor="middle" class="lblc">Compiler</text>

  <rect class="boxw" x="100" y="212" width="200" height="40"/>
  <text x="200" y="237" text-anchor="middle" class="lbl">Binaire (.hex / .bin)</text>

  <rect class="box"  x="100" y="286" width="200" height="40"/>
  <text x="200" y="306" text-anchor="middle" class="lblc">Téléverser</text>
  <text x="200" y="320" text-anchor="middle" class="sub">remplace la flash</text>

  <rect class="boxw" x="100" y="360" width="200" height="40"/>
  <text x="200" y="385" text-anchor="middle" class="lbl">La carte exécute</text>

  <path class="flow" marker-end="url(#ar)" d="M200,104 L200,136"/>
  <path class="flow" marker-end="url(#ar)" d="M200,178 L200,210"/>
  <path class="flow" marker-end="url(#ar)" d="M200,252 L200,284"/>
  <path class="flow" marker-end="url(#ar)" d="M200,326 L200,358"/>

  <!-- boucle longue : retour tout en haut a Compiler -->
  <path class="loop" marker-end="url(#arA)" d="M300,380 C352,380 352,158 302,158"/>
  <text x="358" y="262" class="looptxt">chaque</text>
  <text x="358" y="277" class="looptxt">modification :</text>
  <text x="358" y="292" class="looptxt">tout</text>
  <text x="358" y="307" class="looptxt">recompiler</text>

  <!-- ===== Colonne droite : scriptee ===== -->
  <text x="540" y="30" text-anchor="middle" class="title">Approche scriptée</text>
  <text x="540" y="48" text-anchor="middle" class="sub">MicroPython</text>

  <rect class="once" x="440" y="64" width="200" height="40"/>
  <text x="540" y="82"  text-anchor="middle" class="lblc">Flasher le firmware</text>
  <text x="540" y="97"  text-anchor="middle" class="sub">une seule fois</text>

  <path class="flow" marker-end="url(#ar)" d="M540,104 L540,134"/>
  <text x="540" y="152" text-anchor="middle" class="sub">ensuite, au choix :</text>
  <line class="divider" x1="440" y1="160" x2="640" y2="160"/>

  <rect class="boxw" x="440" y="176" width="200" height="48"/>
  <text x="540" y="196" text-anchor="middle" class="lblc">REPL</text>
  <text x="540" y="213" text-anchor="middle" class="sub">taper → exécute aussitôt</text>

  <rect class="boxw" x="440" y="266" width="200" height="48"/>
  <text x="540" y="286" text-anchor="middle" class="lbl"><tspan font-family="monospace">main.py</tspan> sur la carte</text>
  <text x="540" y="303" text-anchor="middle" class="sub">exécute au démarrage</text>

  <path class="flow" marker-end="url(#ar)" d="M540,224 L540,264"/>

  <!-- boucle courte : juste re-executer, pas de compilation -->
  <path class="loop" marker-end="url(#arA)" d="M640,302 C690,302 690,196 642,196"/>
  <text x="540" y="360" text-anchor="middle" class="looptxt">modifier → ré-exécuter</text>
  <text x="540" y="376" text-anchor="middle" class="sub">(pas de compilation, pas de re-flash)</text>

  <!-- bandeau bas : la difference -->
  <text x="360" y="424" text-anchor="middle" class="lbl">Cycle d'essai <tspan class="lblc">long</tspan> (recompiler + téléverser) &#8195;vs&#8195; cycle <tspan class="lblc">court</tspan> (ré-exécuter)</text>
</svg>

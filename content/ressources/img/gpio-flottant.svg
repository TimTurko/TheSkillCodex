<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="t2 d2">
  <title id="t2">Pourquoi un bouton a besoin d'une résistance de tirage</title>
  <desc id="d2">Deux montages d'un bouton comparés. À gauche, sans tirage : le bouton relie la broche à l'alimentation à l'appui, mais quand il est relâché, la broche n'est reliée à rien — elle flotte et capte le bruit électrique ambiant, donc lit un niveau imprévisible, tantôt « 0 » tantôt « 1 ». À droite, avec une résistance pull-up vers l'alimentation et le bouton vers la masse : au repos le pull-up impose un « 1 » franc, et l'appui force un « 0 ». La logique est inversée mais le niveau est toujours défini.</desc>
  <defs>
    <style>
      .ti { font: 700 16px sans-serif; text-anchor: middle; fill: #2C2C2A; }
      .st { font: 700 13px sans-serif; text-anchor: middle; fill: #BA7517; }
      .lab { font: 700 12px sans-serif; text-anchor: middle; fill: #2C2C2A; }
      .sub { font: 400 10px sans-serif; text-anchor: middle; fill: #2C2C2A; }
      .rail { font: 700 11px sans-serif; text-anchor: middle; fill: #888780; }
      .boxg { fill: #DDDBD3; stroke: #888780; stroke-width: 1.4; }
      .wire { stroke: #888780; stroke-width: 1.7; fill: none; }
      .res { fill: #FFFFFF; stroke: #BA7517; stroke-width: 1.8; }
      .reslab { font: 700 10px sans-serif; text-anchor: start; fill: #BA7517; }
      .node { fill: #888780; }
      .lev { stroke: #2C2C2A; stroke-width: 1.7; }
      .term { fill: #2C2C2A; }
      .gnd { stroke: #888780; stroke-width: 1.6; }
      .cap { font: 600 11px sans-serif; text-anchor: middle; fill: #2C2C2A; }
      .warn { font: 700 22px sans-serif; text-anchor: middle; fill: #BA7517; }
      .warnlab { font: 700 11px sans-serif; text-anchor: middle; fill: #BA7517; }
      .ok { font: 700 18px sans-serif; text-anchor: middle; fill: #BA7517; }
      .lvl { font: 700 11px sans-serif; text-anchor: start; fill: #2C2C2A; }
      .noise { stroke: #BA7517; stroke-width: 1.6; fill: none; }
      .divi { stroke: #888780; stroke-width: 1; stroke-dasharray: 2 4; }
      @media (prefers-color-scheme: dark) {
        .ti, .lab, .sub, .cap, .lvl { fill: #F1EFE8; }
        .st, .reslab, .warn, .warnlab, .ok { fill: #EF9F27; }
        .boxg { fill: #4A4A48; stroke: #BBBBBB; }
        .wire, .gnd { stroke: #BBBBBB; }
        .res { fill: #2C2C2A; stroke: #EF9F27; }
        .node, .term { fill: #BBBBBB; }
        .lev { stroke: #F1EFE8; }
        .rail { fill: #BBBBBB; }
        .noise { stroke: #EF9F27; }
        .divi { stroke: #BBBBBB; }
      }
    </style>
  </defs>

  <text x="420" y="26" class="ti">Un bouton sans tirage laisse la broche « en l'air »</text>
  <line x1="420" y1="48" x2="420" y2="284" class="divi"/>

  <!-- ===== SANS TIRAGE ===== -->
  <text x="210" y="66" class="st">Sans tirage</text>
  <text x="150" y="92" class="rail">VCC</text>
  <line x1="122" y1="98" x2="178" y2="98" class="wire"/>
  <line x1="150" y1="98" x2="150" y2="116" class="wire"/>
  <circle cx="150" cy="116" r="2.6" class="term"/>
  <line x1="150" y1="116" x2="162" y2="134" class="lev"/>
  <circle cx="150" cy="138" r="2.6" class="term"/>
  <text x="186" y="131" class="sub">bouton</text>
  <text x="186" y="143" class="sub">relâché</text>
  <line x1="150" y1="138" x2="150" y2="170" class="wire"/>
  <circle cx="150" cy="170" r="3.2" class="node"/>
  <line x1="150" y1="170" x2="246" y2="170" class="wire"/>
  <rect x="246" y="155" width="72" height="30" rx="4" class="boxg"/>
  <text x="282" y="174" class="lab">entrée</text>
  <!-- noise squiggle near node -->
  <path d="M150,186 q6,-8 12,0 q6,8 12,0 q6,-8 12,0" class="noise"/>
  <text x="150" y="214" class="warn">?</text>
  <text x="210" y="240" class="warnlab">La broche flotte → lit « 0 » ou « 1 »</text>
  <text x="210" y="255" class="warnlab">au hasard, selon le bruit ambiant.</text>
  <text x="210" y="276" class="sub">Bouton relâché = relié à rien.</text>

  <!-- ===== AVEC PULL-UP ===== -->
  <text x="630" y="66" class="st">Avec pull-up</text>
  <text x="570" y="92" class="rail">VCC</text>
  <line x1="542" y1="98" x2="598" y2="98" class="wire"/>
  <line x1="570" y1="98" x2="570" y2="110" class="wire"/>
  <rect x="561" y="110" width="18" height="34" rx="2" class="res"/>
  <text x="583" y="132" class="reslab">pull-up</text>
  <line x1="570" y1="144" x2="570" y2="160" class="wire"/>
  <circle cx="570" cy="160" r="3.2" class="node"/>
  <line x1="570" y1="160" x2="666" y2="160" class="wire"/>
  <rect x="666" y="145" width="72" height="30" rx="4" class="boxg"/>
  <text x="702" y="164" class="lab">entrée</text>
  <line x1="570" y1="160" x2="570" y2="182" class="wire"/>
  <circle cx="570" cy="182" r="2.6" class="term"/>
  <line x1="570" y1="182" x2="582" y2="200" class="lev"/>
  <circle cx="570" cy="204" r="2.6" class="term"/>
  <text x="606" y="197" class="sub">bouton</text>
  <line x1="570" y1="204" x2="570" y2="218" class="wire"/>
  <line x1="556" y1="218" x2="584" y2="218" class="gnd"/>
  <line x1="560" y1="223" x2="580" y2="223" class="gnd"/>
  <line x1="564" y1="228" x2="576" y2="228" class="gnd"/>
  <text x="744" y="156" class="lvl">relâché → 1</text>
  <text x="744" y="170" class="lvl">appuyé → 0</text>
  <text x="630" y="258" class="cap">Niveau toujours défini.</text>
  <text x="630" y="276" class="sub">Logique inversée (repos = 1).</text>
</svg>

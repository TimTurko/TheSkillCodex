<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" role="img" aria-labelledby="tuc duc">
  <title id="tuc">La trame UART : start, données, stop</title>
  <desc id="duc">Chronogramme d'une trame UART transmettant un octet. La ligne est au repos à l'état haut ; un bit de start (bas) ouvre la trame, suivi des huit bits de données envoyés du bit de poids faible au bit de poids fort, puis d'un bit de stop (haut) qui referme la trame avant le retour au repos. Chaque bit dure l'inverse du débit convenu (baud) : c'est en comptant ce temps fixe que le récepteur se cale sans horloge partagée.</desc>
  <defs>
    <style>
      .c-title { font: 700 14px sans-serif; fill: #2C2C2A; }
      .c-sig { stroke: #888780; stroke-width: 2.2; fill: none; stroke-linejoin: miter; }
      .c-sep { stroke: #BBBBB4; stroke-width: 1; stroke-dasharray: 3 4; fill: none; }
      .c-lab { font: 600 11px sans-serif; fill: #2C2C2A; }
      .c-amb { font: 700 11px sans-serif; fill: #BA7517; }
      .c-foot { font: italic 400 11px sans-serif; fill: #888780; }
      @media (prefers-color-scheme: dark) {
        .c-title { fill: #F1EFE8; }
        .c-sig { stroke: #BBBBBB; }
        .c-sep { stroke: #5A5A57; }
        .c-lab { fill: #F1EFE8; }
        .c-amb { fill: #EF9F27; }
        .c-foot { fill: #BBBBBB; }
      }
    </style>
  </defs>

  <text x="340" y="24" text-anchor="middle" class="c-title">Une trame UART : start · 8 bits de données · stop</text>

  <!-- séparateurs de bits -->
  <line x1="120" y1="70" x2="120" y2="160" class="c-sep"/>
  <line x1="170" y1="70" x2="170" y2="160" class="c-sep"/>
  <line x1="220" y1="70" x2="220" y2="160" class="c-sep"/>
  <line x1="270" y1="70" x2="270" y2="160" class="c-sep"/>
  <line x1="320" y1="70" x2="320" y2="160" class="c-sep"/>
  <line x1="370" y1="70" x2="370" y2="160" class="c-sep"/>
  <line x1="420" y1="70" x2="420" y2="160" class="c-sep"/>
  <line x1="470" y1="70" x2="470" y2="160" class="c-sep"/>
  <line x1="520" y1="70" x2="520" y2="160" class="c-sep"/>
  <line x1="570" y1="70" x2="570" y2="160" class="c-sep"/>

  <!-- signal : repos H, start B, D0..D7 = 1,0,1,1,0,0,1,0, stop H -->
  <path d="M70,90 L120,90 L120,150 L170,150 L170,90 L220,90 L220,150 L270,150 L270,90 L370,90 L370,150 L470,150 L470,90 L520,90 L520,150 L570,150 L570,90 L660,90" class="c-sig"/>

  <!-- étiquettes -->
  <text x="95" y="180" text-anchor="middle" class="c-lab">repos</text>
  <text x="145" y="180" text-anchor="middle" class="c-amb">start</text>
  <text x="195" y="180" text-anchor="middle" class="c-lab">D0</text>
  <text x="245" y="180" text-anchor="middle" class="c-lab">D1</text>
  <text x="295" y="180" text-anchor="middle" class="c-lab">D2</text>
  <text x="345" y="180" text-anchor="middle" class="c-lab">D3</text>
  <text x="395" y="180" text-anchor="middle" class="c-lab">D4</text>
  <text x="445" y="180" text-anchor="middle" class="c-lab">D5</text>
  <text x="495" y="180" text-anchor="middle" class="c-lab">D6</text>
  <text x="545" y="180" text-anchor="middle" class="c-lab">D7</text>
  <text x="595" y="180" text-anchor="middle" class="c-amb">stop</text>

  <text x="340" y="216" text-anchor="middle" class="c-foot">Chaque bit dure 1 ÷ débit (baud) — le récepteur se cale sur le start, puis compte le temps. Données du bit de poids faible (D0) au plus fort.</text>
</svg>

<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cablage UART croise entre deux Arduino : TX vers RX, RX vers TX, GND commun">
  <defs>
    <style>
      .box  { fill:#DDDBD3; stroke:#8a7a55; stroke-width:1.5; }
      .wire { fill:none; stroke:#BA7517; stroke-width:2.6; }
      .gnd  { fill:none; stroke:#6b6b6b; stroke-width:2.6; }
      .dot  { fill:#BA7517; }
      .gdot { fill:#6b6b6b; }
      .ah   { fill:#BA7517; }
      .t    { fill:#2a2a2a; }
      .tg   { fill:#6b6b6b; }
      @media (prefers-color-scheme: dark) {
        .box  { fill:#3a3a3a; stroke:#b89a5e; }
        .wire { stroke:#E0A040; }
        .gnd  { stroke:#b0b0b0; }
        .dot  { fill:#E0A040; }
        .gdot { fill:#b0b0b0; }
        .ah   { fill:#E0A040; }
        .t    { fill:#e8e6df; }
        .tg   { fill:#b0b0b0; }
      }
    </style>
    <marker id="ar" markerWidth="11" markerHeight="11" refX="7" refY="3.2" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.2 L0,6.4 Z" class="ah"/>
    </marker>
  </defs>

  <rect class="box" x="50" y="95" width="150" height="175" rx="6"/>
  <rect class="box" x="360" y="95" width="150" height="175" rx="6"/>
  <text class="t" x="125" y="83" text-anchor="middle" font-size="16" font-weight="bold">Arduino A</text>
  <text class="t" x="435" y="83" text-anchor="middle" font-size="16" font-weight="bold">Arduino B</text>

  <text class="t"  x="192" y="135" text-anchor="end" font-size="13">D11 (TX)</text>
  <text class="t"  x="192" y="195" text-anchor="end" font-size="13">D10 (RX)</text>
  <text class="tg" x="192" y="255" text-anchor="end" font-size="13">GND</text>
  <circle class="dot"  cx="200" cy="130" r="4.5"/>
  <circle class="dot"  cx="200" cy="190" r="4.5"/>
  <circle class="gdot" cx="200" cy="250" r="4.5"/>

  <text class="t"  x="368" y="135" text-anchor="start" font-size="13">D11 (TX)</text>
  <text class="t"  x="368" y="195" text-anchor="start" font-size="13">D10 (RX)</text>
  <text class="tg" x="368" y="255" text-anchor="start" font-size="13">GND</text>
  <circle class="dot"  cx="360" cy="130" r="4.5"/>
  <circle class="dot"  cx="360" cy="190" r="4.5"/>
  <circle class="gdot" cx="360" cy="250" r="4.5"/>

  <path class="wire" d="M204,131 L356,189" marker-end="url(#ar)"/>
  <path class="wire" d="M356,131 L204,189" marker-end="url(#ar)"/>
  <path class="gnd"  d="M204,250 L356,250"/>

  <text class="tg" x="280" y="302" text-anchor="middle" font-size="13">TX d'une carte vers RX de l'autre &#183; GND commun obligatoire</text>
</svg>

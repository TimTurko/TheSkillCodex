<svg viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Carte memoire de l'EEPROM : un octet de signature a l'adresse 0, puis une structure Config etalee sur les octets suivants, le reste libre a 0xFF">
  <defs>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#33312B;}
      .t-title{font-size:14px;font-weight:600;}
      .addr{font-size:10.5px;fill:#6B6862;}
      .fld{font-size:11px;font-weight:600;}
      .sz{font-size:10px;fill:#6B6862;}
      .t-sm{font-size:11px;fill:#6B6862;}
      .cell{fill:#DDDBD3;stroke:#9A958A;stroke-width:1.3;}
      .sig{fill:#F3E4C8;stroke:#BA7517;stroke-width:1.6;}
      .free{fill:none;stroke:#BFB8A6;stroke-width:1.3;stroke-dasharray:5 4;}
      @media (prefers-color-scheme: dark){
        text{fill:#DDDBD3;}
        .addr,.sz,.t-sm{fill:#A9A59B;}
        .cell{fill:#3B3A34;stroke:#8A867C;}
        .sig{fill:#4A3E26;stroke:#E0A24A;}
        .free{stroke:#5A574E;}
      }
    </style>
  </defs>

  <text class="t-title" x="40" y="30" text-anchor="start">L'EEPROM, octet par octet</text>

  <!-- cells -->
  <!-- signature : octet 0 -->
  <rect class="sig"  x="60"  y="80" width="50"  height="56"/>
  <text class="addr" x="85"  y="72"  text-anchor="middle">0</text>
  <text class="fld"  x="85"  y="106" text-anchor="middle">SIG</text>
  <text class="sz"   x="85"  y="124" text-anchor="middle">1 o</text>

  <!-- int seuilCapteur : 1-2 -->
  <rect class="cell" x="110" y="80" width="90"  height="56"/>
  <text class="addr" x="155" y="72"  text-anchor="middle">1 – 2</text>
  <text class="fld"  x="155" y="106" text-anchor="middle">seuilCapteur</text>
  <text class="sz"   x="155" y="124" text-anchor="middle">int · 2 o</text>

  <!-- float coeffEtalonnage : 3-6 -->
  <rect class="cell" x="200" y="80" width="130" height="56"/>
  <text class="addr" x="265" y="72"  text-anchor="middle">3 – 6</text>
  <text class="fld"  x="265" y="106" text-anchor="middle">coeffEtalonnage</text>
  <text class="sz"   x="265" y="124" text-anchor="middle">float · 4 o</text>

  <!-- byte modeActif : 7 -->
  <rect class="cell" x="330" y="80" width="55"  height="56"/>
  <text class="addr" x="357" y="72"  text-anchor="middle">7</text>
  <text class="fld"  x="357" y="106" text-anchor="middle">mode</text>
  <text class="sz"   x="357" y="124" text-anchor="middle">byte · 1 o</text>

  <!-- uint32 nbDemarrages : 8-11 -->
  <rect class="cell" x="385" y="80" width="130" height="56"/>
  <text class="addr" x="450" y="72"  text-anchor="middle">8 – 11</text>
  <text class="fld"  x="450" y="106" text-anchor="middle">nbDemarrages</text>
  <text class="sz"   x="450" y="124" text-anchor="middle">uint32_t · 4 o</text>

  <!-- free -->
  <rect class="free" x="515" y="80" width="185" height="56"/>
  <text class="addr" x="607" y="72"  text-anchor="middle">12 …</text>
  <text class="t-sm" x="607" y="106" text-anchor="middle">libre</text>
  <text class="sz"   x="607" y="124" text-anchor="middle">neuf = 0xFF</text>

  <!-- notes -->
  <text class="t-sm" x="40" y="172" text-anchor="start">Chaque champ occupe un nombre d'octets fixé par son type : l'adresse du suivant = adresse du précédent + sizeof(type).</text>
  <text class="t-sm" x="40" y="194" text-anchor="start">L'octet de signature (valeur connue, ex. 0x42) permet de distinguer une EEPROM déjà initialisée d'une EEPROM neuve (tout à 0xFF).</text>
  <text class="t-sm" x="40" y="216" text-anchor="start">EEPROM.put(adr, config) écrit toute la structure d'un bloc ; EEPROM.get(adr, config) la relit à l'identique.</text>
</svg>

<svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <style>
      .h1 { font-size:15px; font-weight:600; fill:#2A2A2A; }
      .sub { font-size:11px; fill:#6E6E6E; }
      .wire { fill:none; stroke:#6E6E6E; stroke-width:2; }
      .boxN { fill:#FFFFFF; stroke:#B9B6AC; stroke-width:1.4; }
      .comp { fill:#F7EBD6; stroke:#BA7517; stroke-width:1.6; }
      .dot { fill:#6E6E6E; }
      .lblBox { font-size:14px; font-weight:600; fill:#3A3A3A; }
      .lbl12 { font-size:12px; fill:#2A2A2A; }
      .lblPin { font-size:11px; font-weight:600; fill:#2A2A2A; }
      .pin { font-size:11.5px; font-weight:700; fill:#7A5310; }
      .n { font-size:11px; fill:#5A5A5A; }
      .nStrong { font-size:11.5px; font-weight:600; fill:#3A3A3A; }
      @media (prefers-color-scheme: dark) {
        .h1 { fill:#EDEDED; }
        .sub { fill:#A8A8A8; }
        .wire { stroke:#B0B0B0; }
        .boxN { fill:#1F1F1F; stroke:#5A5A5A; }
        .comp { fill:#3A2E19; stroke:#E0A24A; }
        .dot { fill:#B0B0B0; }
        .lblBox { fill:#DADADA; }
        .lbl12 { fill:#ECECEC; }
        .lblPin { fill:#ECECEC; }
        .pin { fill:#E0A24A; }
        .n { fill:#B0B0B0; }
        .nStrong { fill:#DADADA; }
      }
    </style>
  </defs>

  <text x="330" y="26" class="h1" text-anchor="middle">Câblage — 28BYJ-48 via driver ULN2003 sur Pico</text>
  <text x="330" y="46" class="sub" text-anchor="middle">Broches du code : IN1=GP2, IN2=GP3, IN3=GP4, IN4=GP5 · alim. 5 V (VBUS ou externe), masse commune</text>

  <rect x="30" y="84" width="140" height="200" rx="10" class="boxN"/>
  <text x="100" y="110" class="lblBox" text-anchor="middle">Pico</text>
  <circle cx="170" cy="118" r="3" class="dot"/><text x="162" y="122" class="pin" text-anchor="end">GP2 (IN1)</text>
  <circle cx="170" cy="150" r="3" class="dot"/><text x="162" y="154" class="pin" text-anchor="end">GP3 (IN2)</text>
  <circle cx="170" cy="182" r="3" class="dot"/><text x="162" y="186" class="pin" text-anchor="end">GP4 (IN3)</text>
  <circle cx="170" cy="214" r="3" class="dot"/><text x="162" y="218" class="pin" text-anchor="end">GP5 (IN4)</text>
  <circle cx="170" cy="256" r="3" class="dot"/><text x="162" y="260" class="lblPin" text-anchor="end">GND</text>

  <rect x="250" y="78" width="180" height="216" rx="10" class="comp"/>
  <text x="340" y="104" class="lblBox" text-anchor="middle">Driver ULN2003</text>
  <circle cx="250" cy="118" r="3" class="dot"/><text x="258" y="122" class="lblPin" text-anchor="start">IN1</text>
  <circle cx="250" cy="150" r="3" class="dot"/><text x="258" y="154" class="lblPin" text-anchor="start">IN2</text>
  <circle cx="250" cy="182" r="3" class="dot"/><text x="258" y="186" class="lblPin" text-anchor="start">IN3</text>
  <circle cx="250" cy="214" r="3" class="dot"/><text x="258" y="218" class="lblPin" text-anchor="start">IN4</text>
  <circle cx="250" cy="252" r="3" class="dot"/><text x="258" y="256" class="lblPin" text-anchor="start">+</text>
  <circle cx="250" cy="280" r="3" class="dot"/><text x="258" y="284" class="lblPin" text-anchor="start">−</text>
  <circle cx="430" cy="160" r="3" class="dot"/><text x="422" y="164" class="lblPin" text-anchor="end">moteur</text>

  <line x1="170" y1="118" x2="250" y2="118" class="wire"/>
  <line x1="170" y1="150" x2="250" y2="150" class="wire"/>
  <line x1="170" y1="182" x2="250" y2="182" class="wire"/>
  <line x1="170" y1="214" x2="250" y2="214" class="wire"/>

  <rect x="520" y="120" width="110" height="70" rx="10" class="boxN"/>
  <text x="575" y="150" class="lblBox" text-anchor="middle">Moteur</text>
  <text x="575" y="168" class="n" text-anchor="middle">28BYJ-48</text>
  <circle cx="520" cy="160" r="3" class="dot"/>
  <line x1="430" y1="160" x2="520" y2="160" class="wire"/>
  <text x="475" y="154" class="n" text-anchor="middle">connecteur 5 broches</text>

  <rect x="520" y="226" width="110" height="50" rx="10" class="boxN"/>
  <text x="575" y="246" class="lbl12" text-anchor="middle">5 V</text>
  <text x="575" y="263" class="n" text-anchor="middle">VBUS ou alim. externe</text>
  <circle cx="520" cy="236" r="3" class="dot"/><text x="512" y="240" class="lblPin" text-anchor="end">+</text>
  <circle cx="520" cy="266" r="3" class="dot"/><text x="512" y="270" class="lblPin" text-anchor="end">−</text>

  <!-- +5V vers driver -->
  <line x1="520" y1="236" x2="470" y2="236" class="wire"/>
  <line x1="470" y1="236" x2="470" y2="252" class="wire"/>
  <line x1="470" y1="252" x2="250" y2="252" class="wire"/>

  <!-- Masse commune -->
  <line x1="170" y1="256" x2="170" y2="324" class="wire"/>
  <line x1="250" y1="280" x2="210" y2="280" class="wire"/>
  <line x1="210" y1="280" x2="210" y2="324" class="wire"/>
  <line x1="520" y1="266" x2="500" y2="266" class="wire"/>
  <line x1="500" y1="266" x2="500" y2="324" class="wire"/>
  <line x1="170" y1="324" x2="500" y2="324" class="wire"/>
  <circle cx="170" cy="324" r="3" class="dot"/>
  <circle cx="500" cy="324" r="3" class="dot"/>
  <text x="335" y="344" class="n" text-anchor="middle">Masse commune : Pico + driver + alimentation 5 V. Les entrées Darlington de l'ULN2003 acceptent le 3,3 V du Pico.</text>
</svg>

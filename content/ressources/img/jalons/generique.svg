<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" role="img" aria-labelledby="title desc">
  <title id="title">Jalons — schéma générique</title>
  <desc id="desc">Timeline horizontale matérialisant les six jalons d'un projet mécatronique en cycle en V. Six losanges ambres répartis le long d'un axe, étiquetés J1 à J6, légendés en dessous par la phase qui se valide à chaque jalon.</desc>
  <defs>
    <style>
      .axis { stroke: #888780; stroke-width: 2; fill: #888780; }
      .jalon-fill { fill: #BA7517; stroke: #BA7517; stroke-width: 2; }
      .jalon-text { font: 700 13px sans-serif; text-anchor: middle; fill: #FFFFFF; }
      .phase-text { font: 400 12px sans-serif; text-anchor: middle; fill: #2C2C2A; }
      .label { font: 400 11px sans-serif; fill: #2C2C2A; }
      .title-text { font: 700 14px sans-serif; text-anchor: middle; fill: #2C2C2A; letter-spacing: 0.5px; }
      @media (prefers-color-scheme: dark) {
        .axis { stroke: #BBBBBB; fill: #BBBBBB; }
        .jalon-fill { fill: #BA7517; stroke: #EF9F27; }
        .phase-text, .label, .title-text { fill: #F1EFE8; }
      }
    </style>
  </defs>

  <text x="350" y="35" class="title-text">Frise des jalons d'un projet en cycle en V</text>

  <!-- Axe temporel -->
  <line x1="50" y1="140" x2="650" y2="140" class="axis" stroke-width="2"/>
  <polygon points="650,140 638,134 638,146" class="axis"/>
  <text x="50" y="245" class="label">début du projet</text>
  <text x="650" y="245" class="label" style="text-anchor:end">date butoir</text>

  <!-- Jalon 1 -->
  <polygon points="105,118 128,140 105,162 82,140" class="jalon-fill"/>
  <text x="105" y="145" class="jalon-text">J1</text>
  <text x="105" y="195" class="phase-text">Revue de</text>
  <text x="105" y="210" class="phase-text">CdCF</text>

  <!-- Jalon 2 -->
  <polygon points="210,118 233,140 210,162 187,140" class="jalon-fill"/>
  <text x="210" y="145" class="jalon-text">J2</text>
  <text x="210" y="195" class="phase-text">Concept</text>
  <text x="210" y="210" class="phase-text">validé</text>

  <!-- Jalon 3 -->
  <polygon points="315,118 338,140 315,162 292,140" class="jalon-fill"/>
  <text x="315" y="145" class="jalon-text">J3</text>
  <text x="315" y="195" class="phase-text">PoC</text>
  <text x="315" y="210" class="phase-text">concluant</text>

  <!-- Jalon 4 -->
  <polygon points="420,118 443,140 420,162 397,140" class="jalon-fill"/>
  <text x="420" y="145" class="jalon-text">J4</text>
  <text x="420" y="195" class="phase-text">Dossier tech</text>
  <text x="420" y="210" class="phase-text">validé</text>

  <!-- Jalon 5 -->
  <polygon points="525,118 548,140 525,162 502,140" class="jalon-fill"/>
  <text x="525" y="145" class="jalon-text">J5</text>
  <text x="525" y="195" class="phase-text">Intégration</text>
  <text x="525" y="210" class="phase-text">livrée</text>

  <!-- Jalon 6 -->
  <polygon points="615,118 638,140 615,162 592,140" class="jalon-fill"/>
  <text x="615" y="145" class="jalon-text">J6</text>
  <text x="615" y="195" class="phase-text">Soutenance</text>
  <text x="615" y="210" class="phase-text">finale</text>
</svg>

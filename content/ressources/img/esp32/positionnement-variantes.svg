<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <style>
      .frame { fill:none; stroke:#c9c6bd; stroke-width:1; }
      .axis  { stroke:#6b6b6b; stroke-width:1.5; }
      .grid  { stroke:#e4e2da; stroke-width:1; stroke-dasharray:3 4; }
      .node  { fill:#BA7517; stroke:#7d4f0f; stroke-width:1.5; }
      .nodealt { fill:none; stroke:#BA7517; stroke-width:1.8; stroke-dasharray:4 3; }
      .name  { fill:#2b2b2b; font-size:14px; font-weight:600; }
      .axt   { fill:#3d3d3d; font-size:13px; font-weight:600; }
      .tick  { fill:#6b6b6b; font-size:11px; }
      .note  { fill:#7d4f0f; font-size:11px; font-style:italic; }
      @media (prefers-color-scheme: dark) {
        .frame { stroke:#4a4a46; }
        .axis  { stroke:#a5a5a5; }
        .grid  { stroke:#3a3a38; }
        .node  { fill:#E0A24A; stroke:#f0c48a; }
        .nodealt { stroke:#E0A24A; }
        .name  { fill:#DDDBD3; }
        .axt   { fill:#c7c7c7; }
        .tick  { fill:#a5a5a5; }
        .note  { fill:#E0A24A; }
      }
    </style>
  </defs>

  <rect class="frame" x="90" y="40" width="600" height="360"/>

  <line class="grid" x1="290" y1="40" x2="290" y2="400"/>
  <line class="grid" x1="490" y1="40" x2="490" y2="400"/>
  <line class="grid" x1="90"  y1="160" x2="690" y2="160"/>
  <line class="grid" x1="90"  y1="280" x2="690" y2="280"/>

  <line class="axis" x1="90" y1="400" x2="690" y2="400"/>
  <line class="axis" x1="90" y1="400" x2="90"  y2="40"/>

  <text class="axt" x="390" y="440" text-anchor="middle">Connectivité sans fil  →</text>
  <text class="tick" x="150" y="418" text-anchor="middle">sans / BLE</text>
  <text class="tick" x="390" y="418" text-anchor="middle">Wi-Fi 4</text>
  <text class="tick" x="620" y="418" text-anchor="middle">Wi-Fi 6</text>

  <text class="axt" x="0" y="0" text-anchor="middle" transform="translate(30,220) rotate(-90)">Puissance de calcul  →</text>

  <circle class="nodealt" cx="135" cy="75" r="7"/>
  <text class="name" x="148" y="72" text-anchor="start">P4</text>
  <text class="note" x="148" y="88" text-anchor="start">multimédia, sans radio</text>

  <circle class="node" cx="450" cy="130" r="7"/>
  <text class="name" x="462" y="127" text-anchor="start">S3</text>
  <text class="note" x="462" y="142" text-anchor="start">2 cœurs + IA</text>

  <circle class="node" cx="380" cy="195" r="7"/>
  <text class="name" x="368" y="192" text-anchor="end">ESP32</text>
  <text class="note" x="368" y="207" text-anchor="end">le polyvalent</text>

  <circle class="node" cx="300" cy="255" r="7"/>
  <text class="name" x="288" y="252" text-anchor="end">S2</text>
  <text class="note" x="288" y="267" text-anchor="end">Wi-Fi seul, USB</text>

  <circle class="node" cx="655" cy="235" r="7"/>
  <text class="name" x="643" y="232" text-anchor="end">C5</text>
  <text class="note" x="643" y="247" text-anchor="end">5 GHz</text>

  <circle class="node" cx="565" cy="315" r="7"/>
  <text class="name" x="553" y="312" text-anchor="end">C6</text>
  <text class="note" x="553" y="327" text-anchor="end">Wi-Fi 6, Thread</text>

  <circle class="node" cx="335" cy="345" r="7"/>
  <text class="name" x="347" y="342" text-anchor="start">C3</text>
  <text class="note" x="347" y="357" text-anchor="start">compact</text>

  <circle class="node" cx="195" cy="365" r="7"/>
  <text class="name" x="207" y="362" text-anchor="start">H2</text>
  <text class="note" x="207" y="377" text-anchor="start">Thread/Zigbee, sans Wi-Fi</text>
</svg>

<svg viewBox="0 0 600 330" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <style>
      .h1 { font-size:15px; font-weight:600; fill:#2A2A2A; }
      .sub { font-size:11px; fill:#6E6E6E; }
      .wire { fill:none; stroke:#6E6E6E; stroke-width:2; }
      .boxN { fill:#FFFFFF; stroke:#B9B6AC; stroke-width:1.4; }
      .comp { fill:#F7EBD6; stroke:#BA7517; stroke-width:1.6; }
      .res { fill:#F7EBD6; stroke:#BA7517; stroke-width:1.6; }
      .dot { fill:#6E6E6E; }
      .lblBox { font-size:14px; font-weight:600; fill:#3A3A3A; }
      .lblPin { font-size:11px; font-weight:600; fill:#2A2A2A; }
      .pin { font-size:11px; font-weight:600; fill:#7A5310; }
      .lbl { font-size:11px; fill:#2A2A2A; }
      .n { font-size:11px; fill:#5A5A5A; }
      .nStrong { font-size:11.5px; font-weight:600; fill:#3A3A3A; }
      @media (prefers-color-scheme: dark) {
        .h1 { fill:#EDEDED; }
        .sub { fill:#A8A8A8; }
        .wire { stroke:#B0B0B0; }
        .boxN { fill:#1F1F1F; stroke:#5A5A5A; }
        .comp { fill:#3A2E19; stroke:#E0A24A; }
        .res { fill:#3A2E19; stroke:#E0A24A; }
        .dot { fill:#B0B0B0; }
        .lblBox { fill:#DADADA; }
        .lblPin { fill:#ECECEC; }
        .pin { fill:#E0A24A; }
        .lbl { fill:#ECECEC; }
        .n { fill:#B0B0B0; }
        .nStrong { fill:#DADADA; }
      }
    </style>
  </defs>

  <text x="300" y="26" class="h1" text-anchor="middle">Câblage — bus I2C sur Pico (MicroPython)</text>
  <text x="300" y="46" class="sub" text-anchor="middle">Broches du code : SDA = GP4, SCL = GP5 · résistances de tirage vers 3,3 V</text>

  <!-- Rail 3V3 -->
  <line x1="240" y1="74" x2="420" y2="74" class="wire"/>
  <circle cx="240" cy="74" r="3" class="dot"/>
  <text x="240" y="68" class="lbl" text-anchor="middle">3,3 V</text>

  <!-- Résistances de tirage -->
  <rect x="294" y="86" width="20" height="42" rx="3" class="res"/>
  <text x="304" y="84" class="lbl" text-anchor="middle">4,7k</text>
  <rect x="346" y="86" width="20" height="42" rx="3" class="res"/>
  <text x="356" y="84" class="lbl" text-anchor="middle">4,7k</text>
  <line x1="304" y1="74" x2="304" y2="86" class="wire"/>
  <line x1="356" y1="74" x2="356" y2="86" class="wire"/>

  <rect x="44" y="150" width="150" height="130" rx="10" class="boxN"/>
  <text x="119" y="176" class="lblBox" text-anchor="middle">Pico</text>
  <text x="186" y="198" class="lblPin" text-anchor="end">GP4 (SDA)</text>
  <text x="186" y="240" class="lblPin" text-anchor="end">GP5 (SCL)</text>
  <circle cx="194" cy="194" r="3" class="dot"/>
  <circle cx="194" cy="236" r="3" class="dot"/>

  <rect x="406" y="150" width="150" height="130" rx="10" class="comp"/>
  <text x="481" y="176" class="lblBox" text-anchor="middle">Périphérique I2C</text>
  <circle cx="406" cy="194" r="3" class="dot"/><text x="414" y="198" class="pin" text-anchor="start">SDA</text>
  <circle cx="406" cy="236" r="3" class="dot"/><text x="414" y="240" class="pin" text-anchor="start">SCL</text>

  <!-- SDA -->
  <line x1="194" y1="194" x2="406" y2="194" class="wire"/>
  <line x1="304" y1="128" x2="304" y2="194" class="wire"/>
  <circle cx="304" cy="194" r="3" class="dot"/>
  <text x="270" y="188" class="n" text-anchor="middle">SDA</text>

  <!-- SCL -->
  <line x1="194" y1="236" x2="406" y2="236" class="wire"/>
  <line x1="356" y1="128" x2="356" y2="236" class="wire"/>
  <circle cx="356" cy="236" r="3" class="dot"/>
  <text x="392" y="230" class="n" text-anchor="middle">SCL</text>

  <text x="44" y="306" class="nStrong" text-anchor="start">Bon à savoir</text>
  <text x="44" y="324" class="n" text-anchor="start">Les deux lignes sont tirées au 3,3 V par des résistances (souvent déjà intégrées au module — sinon ~4,7 kΩ).</text>
</svg>
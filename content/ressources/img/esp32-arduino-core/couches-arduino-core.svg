<svg viewBox="0 0 640 384" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <style>
      .h1 { font-size:16px; font-weight:600; fill:#2A2A2A; }
      .sub { font-size:11px; fill:#6E6E6E; }
      .boxN { fill:#FFFFFF; stroke:#B9B6AC; stroke-width:1.4; }
      .comp { fill:#F7EBD6; stroke:#BA7517; stroke-width:1.6; }
      .panel { fill:none; stroke:#B9B6AC; stroke-width:1.4; stroke-dasharray:5 4; }
      .wire { fill:none; stroke:#6E6E6E; stroke-width:2; }
      .mark { fill:#6E6E6E; }
      .lblBox { font-size:13px; font-weight:600; fill:#2A2A2A; }
      .lblSub { font-size:10.5px; fill:#5A5A5A; }
      .lblPanel { font-size:12px; font-weight:600; fill:#3A3A3A; }
      .nStrong { font-size:11.5px; font-weight:600; fill:#3A3A3A; }
      .n { font-size:11px; fill:#5A5A5A; }
      @media (prefers-color-scheme: dark) {
        .h1 { fill:#EDEDED; }
        .sub { fill:#A8A8A8; }
        .boxN { fill:#1F1F1F; stroke:#5A5A5A; }
        .comp { fill:#3A2E19; stroke:#E0A24A; }
        .panel { stroke:#5A5A5A; }
        .wire { stroke:#B0B0B0; }
        .mark { fill:#B0B0B0; }
        .lblBox { fill:#ECECEC; }
        .lblSub { fill:#B0B0B0; }
        .lblPanel { fill:#DADADA; }
        .nStrong { fill:#DADADA; }
        .n { fill:#B0B0B0; }
      }
    </style>
  </defs>

  <text x="320" y="26" class="h1" text-anchor="middle">L'Arduino-core est posé sur ESP-IDF et FreeRTOS</text>
  <text x="320" y="46" class="sub" text-anchor="middle">Le sketch ne tourne pas seul sur la puce : loop() est une tâche parmi d'autres</text>

  <!-- Pile des couches -->
  <rect x="36" y="76" width="272" height="52" rx="6" class="comp"/>
  <text x="50" y="98" class="lblBox">Ton sketch</text>
  <text x="50" y="116" class="lblSub">setup() · loop()</text>

  <rect x="36" y="142" width="272" height="52" rx="6" class="boxN"/>
  <text x="50" y="164" class="lblBox">Arduino-core ESP32</text>
  <text x="50" y="182" class="lblSub">pinMode · digitalWrite · Serial · Wire</text>

  <rect x="36" y="208" width="272" height="52" rx="6" class="boxN"/>
  <text x="50" y="230" class="lblBox">ESP-IDF + FreeRTOS</text>
  <text x="50" y="248" class="lblSub">esp_* · xTaskCreate · ordonnanceur</text>

  <rect x="36" y="274" width="272" height="52" rx="6" class="boxN"/>
  <text x="50" y="296" class="lblBox">Matériel</text>
  <text x="50" y="314" class="lblSub">Xtensa ou RISC-V · GPIO · Wi-Fi · BLE</text>

  <!-- Fleches « repose sur » -->
  <line x1="100" y1="128" x2="100" y2="136" class="wire"/>
  <polygon points="95,136 105,136 100,142" class="mark"/>
  <line x1="100" y1="194" x2="100" y2="202" class="wire"/>
  <polygon points="95,202 105,202 100,208" class="mark"/>
  <line x1="100" y1="260" x2="100" y2="268" class="wire"/>
  <polygon points="95,268 105,268 100,274" class="mark"/>

  <text x="252" y="139" class="n" text-anchor="end">repose sur</text>

  <!-- Panneau ordonnanceur -->
  <rect x="340" y="142" width="264" height="184" rx="8" class="panel"/>
  <text x="472" y="166" class="lblPanel" text-anchor="middle">Ordonnanceur FreeRTOS</text>

  <rect x="356" y="186" width="232" height="30" rx="5" class="comp"/>
  <text x="472" y="205" class="lblSub" text-anchor="middle">loopTask — ton setup() puis loop()</text>

  <rect x="356" y="224" width="232" height="30" rx="5" class="boxN"/>
  <text x="472" y="243" class="lblSub" text-anchor="middle">Pile Wi-Fi / BLE</text>

  <rect x="356" y="262" width="232" height="30" rx="5" class="boxN"/>
  <text x="472" y="281" class="lblSub" text-anchor="middle">Tâches système (IDLE…)</text>

  <text x="472" y="312" class="n" text-anchor="middle">toutes se partagent le même processeur</text>

  <!-- Lien sketch -> loopTask -->
  <line x1="308" y1="168" x2="324" y2="168" class="wire"/>
  <line x1="324" y1="168" x2="324" y2="201" class="wire"/>
  <line x1="324" y1="201" x2="350" y2="201" class="wire"/>
  <polygon points="350,196 350,206 356,201" class="mark"/>

  <!-- Note -->
  <text x="36" y="354" class="nStrong">Bon à savoir</text>
  <text x="36" y="372" class="n">Une boucle qui ne rend jamais la main affame les autres tâches et déclenche le task watchdog.</text>
</svg>

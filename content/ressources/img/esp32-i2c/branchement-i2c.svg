<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <style>
      .board { fill:#f0eee7; stroke:#b8b5ac; stroke-width:1.5; }
      .title { fill:#2b2b2b; font-size:14px; font-weight:600; }
      .pin   { fill:#3d3d3d; font-size:12px; }
      .wire  { stroke:#BA7517; stroke-width:2.2; fill:none; }
      .gnd   { stroke:#8a8a8a; stroke-width:2.2; fill:none; }
      .res   { fill:#f0eee7; stroke:#BA7517; stroke-width:1.8; }
      .dot   { fill:#BA7517; }
      .gdot  { fill:#8a8a8a; }
      .lbl   { fill:#7d4f0f; font-size:11px; }
      .note  { fill:#7d4f0f; font-size:11px; font-style:italic; }
      @media (prefers-color-scheme: dark) {
        .board { fill:#2a2a28; stroke:#57554f; }
        .title { fill:#DDDBD3; }
        .pin   { fill:#c7c7c7; }
        .wire  { stroke:#E0A24A; }
        .gnd   { stroke:#a5a5a5; }
        .res   { fill:#2a2a28; stroke:#E0A24A; }
        .dot   { fill:#E0A24A; }
        .gdot  { fill:#a5a5a5; }
        .lbl   { fill:#E0A24A; }
        .note  { fill:#E0A24A; }
      }
    </style>
  </defs>

  <rect class="board" x="60"  y="70" width="140" height="170" rx="6"/>
  <rect class="board" x="430" y="70" width="140" height="170" rx="6"/>

  <text class="title" x="130" y="58" text-anchor="middle">ESP32</text>
  <text class="title" x="500" y="58" text-anchor="middle">Module I2C</text>

  <!-- signal + power wires (I2C ne croise pas) -->
  <line class="wire" x1="200" y1="110" x2="430" y2="110"/>
  <line class="wire" x1="200" y1="150" x2="430" y2="150"/>
  <line class="wire" x1="200" y1="195" x2="430" y2="195"/>
  <line class="gnd"  x1="200" y1="230" x2="430" y2="230"/>

  <!-- pull-ups vers 3,3 V -->
  <line class="wire" x1="280" y1="48" x2="360" y2="48"/>
  <text class="lbl" x="274" y="52" text-anchor="end">3,3 V</text>
  <line class="wire" x1="300" y1="48" x2="300" y2="110"/>
  <rect class="res" x="295" y="70" width="10" height="24" rx="2"/>
  <line class="wire" x1="340" y1="48" x2="340" y2="150"/>
  <rect class="res" x="335" y="70" width="10" height="24" rx="2"/>
  <text class="lbl" x="352" y="86" text-anchor="start">4,7 kΩ</text>
  <circle class="dot" cx="300" cy="110" r="4"/>
  <circle class="dot" cx="340" cy="150" r="4"/>

  <!-- pin dots -->
  <circle class="dot"  cx="200" cy="110" r="4"/>
  <circle class="dot"  cx="200" cy="150" r="4"/>
  <circle class="dot"  cx="200" cy="195" r="4"/>
  <circle class="gdot" cx="200" cy="230" r="4"/>
  <circle class="dot"  cx="430" cy="110" r="4"/>
  <circle class="dot"  cx="430" cy="150" r="4"/>
  <circle class="dot"  cx="430" cy="195" r="4"/>
  <circle class="gdot" cx="430" cy="230" r="4"/>

  <!-- ESP32 pin labels -->
  <text class="pin" x="194" y="114" text-anchor="end">GPIO21 — SDA</text>
  <text class="pin" x="194" y="154" text-anchor="end">GPIO22 — SCL</text>
  <text class="pin" x="194" y="199" text-anchor="end">3V3</text>
  <text class="pin" x="194" y="234" text-anchor="end">GND</text>

  <!-- module pin labels -->
  <text class="pin" x="436" y="114" text-anchor="start">SDA</text>
  <text class="pin" x="436" y="154" text-anchor="start">SCL</text>
  <text class="pin" x="436" y="199" text-anchor="start">VCC</text>
  <text class="pin" x="436" y="234" text-anchor="start">GND</text>

  <text class="note" x="310" y="282" text-anchor="middle">I2C ne croise pas (SDA↔SDA, SCL↔SCL) · tirages vers 3,3 V souvent intégrés au module · masse commune</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="tf df">
  <title id="tf">Filtrer atténue le bruit, mais retarde la mesure</title>
  <desc id="df">Deux courbes tracées au cours du temps sur une grandeur qui passe brusquement d'un niveau bas à un niveau haut. La mesure brute, en gris, oscille fortement autour de la vraie valeur avant et après le saut. La mesure passée par une moyenne glissante sur dix échantillons, en ambre, oscille beaucoup moins mais ne franchit la mi-hauteur du saut que cinq mesures après la mesure brute : le front est étalé en rampe. Une double flèche matérialise ce retard entre l'instant du saut réel et l'instant où la courbe filtrée atteint la mi-hauteur. Note de pied : moyenner N mesures divise le bruit par la racine carrée de N et retarde d'environ N sur deux mesures.</desc>
  <defs>
    <style>
      .f-title { font: 700 14px sans-serif; fill: #2C2C2A; }
      .f-axis { stroke: #888780; stroke-width: 1.6; fill: none; }
      .f-axis-label { font: 600 11px sans-serif; fill: #888780; }
      .f-true { stroke: #BBBBB4; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
      .f-raw { stroke: #888780; stroke-width: 1.4; fill: none; stroke-linejoin: round; }
      .f-raw-label { font: 600 11px sans-serif; fill: #888780; }
      .f-filt { stroke: #BA7517; stroke-width: 2.6; fill: none; stroke-linejoin: round; }
      .f-filt-label { font: 700 11px sans-serif; fill: #BA7517; }
      .f-lag { stroke: #BA7517; stroke-width: 1.6; fill: none; }
      .f-lag-tick { stroke: #BA7517; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; }
      .f-arrow { fill: #888780; }
      .f-arrow-amber { fill: #BA7517; }
      .f-foot { font: italic 400 11px sans-serif; fill: #888780; }
      @media (prefers-color-scheme: dark) {
        .f-title { fill: #F1EFE8; }
        .f-axis { stroke: #BBBBBB; }
        .f-axis-label { fill: #BBBBBB; }
        .f-true { stroke: #5A5A57; }
        .f-raw { stroke: #BBBBBB; }
        .f-raw-label { fill: #BBBBBB; }
        .f-filt { stroke: #EF9F27; }
        .f-filt-label { fill: #EF9F27; }
        .f-lag { stroke: #EF9F27; }
        .f-lag-tick { stroke: #EF9F27; }
        .f-arrow { fill: #BBBBBB; }
        .f-arrow-amber { fill: #EF9F27; }
        .f-foot { fill: #BBBBBB; }
      }
    </style>
    <marker id="f-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" class="f-arrow"/>
    </marker>
    <marker id="f-ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" class="f-arrow-amber"/>
    </marker>
    <marker id="f-ar-amber-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" class="f-arrow-amber"/>
    </marker>
  </defs>

  <text x="320" y="22" text-anchor="middle" class="f-title">Le bruit diminue, la mesure arrive en retard</text>

  <line x1="60" y1="255" x2="618" y2="255" class="f-axis" marker-end="url(#f-ar)"/>
  <text x="596" y="272" text-anchor="middle" class="f-axis-label">temps</text>
  <line x1="60" y1="255" x2="60" y2="48" class="f-axis" marker-end="url(#f-ar)"/>
  <text x="52" y="46" text-anchor="end" class="f-axis-label">mesure</text>

  <polyline class="f-true" points="70,220 298.1,220 298.1,110 600,110"/>


  <line x1="298.1" y1="165" x2="298.1" y2="248" class="f-lag-tick"/>
  <line x1="328.3" y1="165" x2="328.3" y2="248" class="f-lag-tick"/>
  <line x1="298.1" y1="242" x2="328.3" y2="242" class="f-lag" marker-start="url(#f-ar-amber-start)" marker-end="url(#f-ar-amber)"/>
  <text x="336" y="246" text-anchor="start" class="f-filt-label">retard : 5 mesures</text>

  <text x="150" y="192" text-anchor="start" class="f-raw-label">mesure brute</text>
  <text x="404" y="146" text-anchor="start" class="f-filt-label">après moyenne glissante (N = 10)</text>

  <text x="320" y="300" text-anchor="middle" class="f-foot">Moyenner N mesures divise le bruit par √N et retarde d'environ N/2 mesures — on échange de la stabilité contre de la réactivité.</text>
</svg>

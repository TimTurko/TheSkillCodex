<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-labelledby="tb db">
  <title id="tb">Trois formes de bruit, trois remèdes</title>
  <desc id="db">Trois tracés côte à côte d'une même mesure censée être constante. À gauche, une dispersion permanente et désordonnée autour de la valeur : bruit aléatoire, que l'on traite par une moyenne ou un filtre exponentiel. Au milieu, une mesure propre interrompue par deux valeurs isolées très éloignées, l'une très basse et l'autre très haute : valeurs aberrantes, que l'on traite par un filtre médian. À droite, une ondulation régulière et périodique superposée à la mesure : perturbation périodique, dont on traite d'abord la cause — masse, blindage, longueur de câble — avant de filtrer.</desc>
  <defs>
    <style>
      .b-title { font: 700 14px sans-serif; fill: #2C2C2A; }
      .b-frame { fill: none; stroke: #DDDBD3; stroke-width: 1.2; }
      .b-base { stroke: #BBBBB4; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
      .b-sig { stroke: #888780; stroke-width: 1.4; fill: none; stroke-linejoin: round; }
      .b-cap { font: 700 12px sans-serif; fill: #2C2C2A; }
      .b-fix { font: 600 11px sans-serif; fill: #BA7517; }
      @media (prefers-color-scheme: dark) {
        .b-title { fill: #F1EFE8; }
        .b-frame { stroke: #5A5A57; }
        .b-base { stroke: #5A5A57; }
        .b-sig { stroke: #BBBBBB; }
        .b-cap { fill: #F1EFE8; }
        .b-fix { fill: #EF9F27; }
      }
    </style>
  </defs>


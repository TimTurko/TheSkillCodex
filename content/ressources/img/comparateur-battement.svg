<svg viewBox="0 0 620 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tcp dcp">
  <title id="tcp">Comparateur — mesure d'un écart sur support rigide</title>
  <desc id="dcp">Schéma d'un comparateur à cadran monté sur une colonne et un socle rigides. Le palpeur, en bas de l'instrument, touche une pièce — ici un axe en rotation posé sur le plan de référence. Tout déplacement du palpeur fait tourner l'aiguille du cadran. L'instrument affiche un écart, c'est-à-dire une variation par rapport à une référence, et non une cote absolue. Il doit être réglé avant usage et monté sur un support rigide.</desc>
  <defs>
    <style>
      .ttl  { font:700 15px sans-serif; fill:#2C2C2A; }
      .lbl  { font:700 13px sans-serif; fill:#BA7517; }
      .tx   { font:400 12px sans-serif; fill:#2C2C2A; }
      .foot { font:italic 400 11.5px sans-serif; fill:#888780; }
      .metal{ fill:#DDDBD3; stroke:#BA7517; stroke-width:2.4; }
      .face { fill:#F4F2EC; stroke:#BA7517; stroke-width:2.4; }
      .grad { stroke:#2C2C2A; stroke-width:1.6; }
      .needle{ stroke:#BA7517; stroke-width:2.6; stroke-linecap:round; }
      .probe{ stroke:#BA7517; stroke-width:3; stroke-linecap:round; }
      .work { fill:#C9C7BF; stroke:#888780; stroke-width:1.8; }
      .ground{ stroke:#2C2C2A; stroke-width:2.2; }
      .hatch{ stroke:#888780; stroke-width:1.4; }
      .lead { stroke:#BA7517; stroke-width:1.2; fill:none; }
      .dim  { stroke:#BA7517; stroke-width:1.6; fill:none; marker-start:url(#cmpA); marker-end:url(#cmpA); }
      .rot  { stroke:#BA7517; stroke-width:1.8; fill:none; marker-end:url(#cmpA); }
      .ch   { fill:#BA7517; }
      @media (prefers-color-scheme: dark) {
        .ttl{fill:#F1EFE8;} .lbl{fill:#EF9F27;} .tx{fill:#F1EFE8;} .foot{fill:#BBBBBB;}
        .metal{fill:#4A4A48; stroke:#EF9F27;} .face{fill:#2E2E2C; stroke:#EF9F27;}
        .grad{stroke:#F1EFE8;} .needle{stroke:#EF9F27;} .probe{stroke:#EF9F27;}
        .work{fill:#5A5852; stroke:#BBBBBB;} .ground{stroke:#F1EFE8;} .hatch{stroke:#BBBBBB;}
        .lead{stroke:#EF9F27;} .dim{stroke:#EF9F27;} .rot{stroke:#EF9F27;} .ch{fill:#EF9F27;}
      }
    </style>
    <marker id="cmpA" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ch"/></marker>
  </defs>

  <text x="300" y="26" class="ttl" text-anchor="middle">Comparateur — il lit un écart, pas une cote</text>

  <!-- sol de référence -->
  <line class="ground" x1="70" y1="340" x2="470" y2="340"/>
  <line class="hatch" x1="86"  y1="340" x2="74"  y2="354"/>
  <line class="hatch" x1="116" y1="340" x2="104" y2="354"/>
  <line class="hatch" x1="146" y1="340" x2="134" y2="354"/>
  <line class="hatch" x1="176" y1="340" x2="164" y2="354"/>
  <line class="hatch" x1="206" y1="340" x2="194" y2="354"/>
  <line class="hatch" x1="236" y1="340" x2="224" y2="354"/>
  <line class="hatch" x1="266" y1="340" x2="254" y2="354"/>
  <line class="hatch" x1="296" y1="340" x2="284" y2="354"/>
  <line class="hatch" x1="326" y1="340" x2="314" y2="354"/>
  <line class="hatch" x1="356" y1="340" x2="344" y2="354"/>
  <line class="hatch" x1="386" y1="340" x2="374" y2="354"/>
  <line class="hatch" x1="416" y1="340" x2="404" y2="354"/>
  <line class="hatch" x1="446" y1="340" x2="434" y2="354"/>

  <!-- socle + colonne + bras (support rigide = bâti) -->
  <rect class="metal" x="95"  y="322" width="72"  height="16" rx="2"/>
  <rect class="metal" x="120" y="120" width="18"  height="204"/>
  <rect class="metal" x="120" y="150" width="172" height="14"/>
  <rect class="metal" x="272" y="144" width="26"  height="30" rx="2"/>

  <!-- support : étiquette -->
  <line class="lead" x1="118" y1="214" x2="86" y2="214"/>
  <text x="80" y="210" class="lbl" text-anchor="end">support</text>
  <text x="80" y="226" class="tx"  text-anchor="end">rigide (bâti)</text>

  <!-- comparateur : tige + cadran -->
  <rect class="metal" x="292" y="150" width="16" height="74"/>
  <circle class="face" cx="300" cy="104" r="46"/>
  <!-- graduations -->
  <line class="grad" x1="300" y1="58"  x2="300" y2="66"/>
  <line class="grad" x1="333" y1="71"  x2="328" y2="76"/>
  <line class="grad" x1="346" y1="104" x2="339" y2="104"/>
  <line class="grad" x1="333" y1="137" x2="328" y2="132"/>
  <line class="grad" x1="300" y1="150" x2="300" y2="143"/>
  <line class="grad" x1="267" y1="137" x2="272" y2="132"/>
  <line class="grad" x1="254" y1="104" x2="261" y2="104"/>
  <line class="grad" x1="267" y1="71"  x2="272" y2="76"/>
  <text x="300" y="90" class="tx" text-anchor="middle">0</text>
  <!-- aiguille -->
  <line class="needle" x1="300" y1="104" x2="275" y2="82"/>
  <circle class="ch" cx="300" cy="104" r="4"/>

  <!-- palpeur -->
  <line class="probe" x1="300" y1="224" x2="300" y2="256"/>
  <circle class="metal" cx="300" cy="258" r="4"/>
  <line class="lead" x1="312" y1="238" x2="346" y2="238"/>
  <text x="350" y="242" class="lbl" text-anchor="start">palpeur</text>

  <!-- écart mesuré -->
  <line class="dim" x1="334" y1="246" x2="334" y2="258"/>
  <text x="342" y="276" class="lbl" text-anchor="start">δ : écart</text>

  <!-- pièce : axe en rotation -->
  <circle class="work" cx="300" cy="298" r="40"/>
  <circle class="ch" cx="300" cy="298" r="3"/>
  <line class="grad" x1="288" y1="298" x2="312" y2="298"/>
  <line class="grad" x1="300" y1="286" x2="300" y2="310"/>
  <path class="rot" d="M262,288 A44 44 0 0 1 300,256"/>
  <line class="lead" x1="338" y1="300" x2="396" y2="300"/>
  <text x="400" y="296" class="lbl" text-anchor="start">battement</text>
  <text x="400" y="312" class="tx"  text-anchor="start">d'un axe en rotation</text>

  <!-- étiquette cadran -->
  <line class="lead" x1="346" y1="104" x2="406" y2="104"/>
  <text x="412" y="100" class="lbl" text-anchor="start">cadran</text>
  <text x="412" y="116" class="tx"  text-anchor="start">lit une variation,</text>
  <text x="412" y="132" class="tx"  text-anchor="start">pas une cote absolue</text>

  <text x="300" y="372" class="foot" text-anchor="middle">Mesure un écart par rapport à une référence — à régler avant usage.</text>
</svg>

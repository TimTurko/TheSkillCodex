<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <style>
      .h1 { font-size:15px; font-weight:600; fill:#2A2A2A; }
      .sub { font-size:11px; fill:#6E6E6E; }
      .panelT { font-size:11.5px; font-weight:600; fill:#3A3A3A; }
      .axis { fill:none; stroke:#9A988F; stroke-width:1.5; }
      .gridv { stroke:#E3E0D7; stroke-width:1; }
      .evt { stroke:#BA7517; stroke-width:2.5; }
      .tick { stroke:#9A988F; stroke-width:1; }
      .lbl { font-size:10.5px; fill:#5A5A5A; }
      .n { font-size:11px; fill:#5A5A5A; }
      .nStrong { font-size:11.5px; font-weight:600; fill:#3A3A3A; }
      @media (prefers-color-scheme: dark) {
        .h1 { fill:#EDEDED; }
        .sub { fill:#A8A8A8; }
        .panelT { fill:#DADADA; }
        .axis { stroke:#7A7870; }
        .gridv { stroke:#33312B; }
        .evt { stroke:#E0A24A; }
        .tick { stroke:#7A7870; }
        .lbl { fill:#B0B0B0; }
        .n { fill:#B0B0B0; }
        .nStrong { fill:#DADADA; }
      }
    </style>
  </defs>

  <text x="320" y="26" class="h1" text-anchor="middle">Trois cadences indépendantes dans une même boucle</text>
  <text x="320" y="46" class="sub" text-anchor="middle">Chaque rythme a sa propre échéance ; entre deux événements, la boucle reste libre</text>

  <!-- grille verticale, pas de 100 ms -->
  <line x1="90" y1="88" x2="90" y2="216" class="gridv"/>
  <line x1="138" y1="88" x2="138" y2="216" class="gridv"/>
  <line x1="186" y1="88" x2="186" y2="216" class="gridv"/>
  <line x1="234" y1="88" x2="234" y2="216" class="gridv"/>
  <line x1="282" y1="88" x2="282" y2="216" class="gridv"/>
  <line x1="330" y1="88" x2="330" y2="216" class="gridv"/>
  <line x1="378" y1="88" x2="378" y2="216" class="gridv"/>
  <line x1="426" y1="88" x2="426" y2="216" class="gridv"/>
  <line x1="474" y1="88" x2="474" y2="216" class="gridv"/>
  <line x1="522" y1="88" x2="522" y2="216" class="gridv"/>
  <line x1="570" y1="88" x2="570" y2="216" class="gridv"/>

  <!-- Lane 1 : LED -->
  <text x="40" y="82" class="panelT" text-anchor="start">LED — bascule / 500 ms</text>
  <line x1="90" y1="100" x2="570" y2="100" class="axis"/>
  <line x1="90" y1="93" x2="90" y2="107" class="evt"/>
  <line x1="330" y1="93" x2="330" y2="107" class="evt"/>
  <line x1="570" y1="93" x2="570" y2="107" class="evt"/>

  <!-- Lane 2 : mesure -->
  <text x="40" y="134" class="panelT" text-anchor="start">mesure — pot / 100 ms</text>
  <line x1="90" y1="152" x2="570" y2="152" class="axis"/>
  <line x1="90" y1="145" x2="90" y2="159" class="evt"/>
  <line x1="138" y1="145" x2="138" y2="159" class="evt"/>
  <line x1="186" y1="145" x2="186" y2="159" class="evt"/>
  <line x1="234" y1="145" x2="234" y2="159" class="evt"/>
  <line x1="282" y1="145" x2="282" y2="159" class="evt"/>
  <line x1="330" y1="145" x2="330" y2="159" class="evt"/>
  <line x1="378" y1="145" x2="378" y2="159" class="evt"/>
  <line x1="426" y1="145" x2="426" y2="159" class="evt"/>
  <line x1="474" y1="145" x2="474" y2="159" class="evt"/>
  <line x1="522" y1="145" x2="522" y2="159" class="evt"/>
  <line x1="570" y1="145" x2="570" y2="159" class="evt"/>

  <!-- Lane 3 : print -->
  <text x="40" y="186" class="panelT" text-anchor="start">print « Vivant » / 1000 ms</text>
  <line x1="90" y1="204" x2="570" y2="204" class="axis"/>
  <line x1="90" y1="197" x2="90" y2="211" class="evt"/>
  <line x1="570" y1="197" x2="570" y2="211" class="evt"/>

  <!-- Axe du temps -->
  <line x1="90" y1="232" x2="570" y2="232" class="axis"/>
  <line x1="90" y1="232" x2="90" y2="238" class="tick"/>
  <line x1="186" y1="232" x2="186" y2="238" class="tick"/>
  <line x1="282" y1="232" x2="282" y2="238" class="tick"/>
  <line x1="378" y1="232" x2="378" y2="238" class="tick"/>
  <line x1="474" y1="232" x2="474" y2="238" class="tick"/>
  <line x1="570" y1="232" x2="570" y2="238" class="tick"/>
  <text x="90" y="251" class="lbl" text-anchor="middle">0</text>
  <text x="186" y="251" class="lbl" text-anchor="middle">200</text>
  <text x="282" y="251" class="lbl" text-anchor="middle">400</text>
  <text x="378" y="251" class="lbl" text-anchor="middle">600</text>
  <text x="474" y="251" class="lbl" text-anchor="middle">800</text>
  <text x="570" y="251" class="lbl" text-anchor="middle">1000 ms</text>

  <text x="40" y="282" class="n" text-anchor="start">Entre deux échéances, la boucle repasse des milliers de fois par seconde et reste libre (lire un bouton…) — aucun sleep().</text>
</svg>

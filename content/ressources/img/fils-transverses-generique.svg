<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" role="img" aria-labelledby="title desc">
  <title id="title">Les trois fils transverses le long du cycle en V</title>
  <desc id="desc">Cycle en V simplifié à 5 phases en haut. En dessous, trois bandes horizontales ambrées — gestion de projet, écoconception, sécurité et qualité — courent du lancement à la soutenance, en parallèle de toutes les phases.</desc>
  <defs>
    <marker id="arr-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .th { font: 500 13px sans-serif; }
      .ts { font: 400 12px sans-serif; }
      .ti { font: italic 400 11px sans-serif; }
      .arr { stroke-width: 1.5; fill: none; }
      .fil { stroke-width: 2.5; fill: none; }
      .delim { stroke-width: 1; stroke-dasharray: 5 4; fill: none; }
      .b-gray { fill: #F1EFE8; stroke: #888780; }
      .b-gray-text { fill: #2C2C2A; }
      .b-amber { fill: #FAEEDA; stroke: #BA7517; }
      .b-amber-text { fill: #412402; }
      .amber-stroke { stroke: #BA7517; }
      .amber-text { fill: #7A4D0F; }
      .neutral-text { fill: #2C2C2A; }
      .neutral-stroke { stroke: #555555; }
      .neutral-light-stroke { stroke: #888888; }
      @media (prefers-color-scheme: dark) {
        .b-gray { fill: #444441; stroke: #B4B2A9; }
        .b-gray-text { fill: #F1EFE8; }
        .b-amber { fill: #633806; stroke: #EF9F27; }
        .b-amber-text { fill: #FAEEDA; }
        .amber-stroke { stroke: #EF9F27; }
        .amber-text { fill: #FAEEDA; }
        .neutral-text { fill: #F1EFE8; }
        .neutral-stroke { stroke: #B4B2A9; }
        .neutral-light-stroke { stroke: #888888; }
      }
    </style>
  </defs>

  <!-- Cycle en V simplifié -->
  <rect class="b-gray" x="20" y="28" width="140" height="34" rx="8" stroke-width="0.5"/>
  <text class="ts b-gray-text" x="90" y="45" text-anchor="middle" dominant-baseline="central">1. Spécification</text>

  <rect class="b-gray" x="135" y="93" width="140" height="34" rx="8" stroke-width="0.5"/>
  <text class="ts b-gray-text" x="205" y="110" text-anchor="middle" dominant-baseline="central">2. Concept</text>

  <rect class="b-gray" x="280" y="158" width="140" height="34" rx="8" stroke-width="0.5"/>
  <text class="ts b-gray-text" x="350" y="175" text-anchor="middle" dominant-baseline="central">3. Preuve de concept</text>

  <rect class="b-gray" x="425" y="93" width="140" height="34" rx="8" stroke-width="0.5"/>
  <text class="ts b-gray-text" x="495" y="110" text-anchor="middle" dominant-baseline="central">4. Dossier technique</text>

  <rect class="b-gray" x="540" y="28" width="140" height="34" rx="8" stroke-width="0.5"/>
  <text class="ts b-gray-text" x="610" y="45" text-anchor="middle" dominant-baseline="central">5. Intégration et tests</text>

  <line x1="140" y1="62" x2="175" y2="93" class="arr neutral-stroke" marker-end="url(#arr-head)"/>
  <line x1="255" y1="127" x2="295" y2="158" class="arr neutral-stroke" marker-end="url(#arr-head)"/>
  <line x1="415" y1="158" x2="455" y2="127" class="arr neutral-stroke" marker-end="url(#arr-head)"/>
  <line x1="545" y1="93" x2="585" y2="62" class="arr neutral-stroke" marker-end="url(#arr-head)"/>

  <!-- Délimiteurs de durée -->
  <line x1="60" y1="205" x2="60" y2="408" class="delim neutral-light-stroke"/>
  <line x1="636" y1="205" x2="636" y2="408" class="delim neutral-light-stroke"/>
  <text class="ti neutral-text" x="60" y="422" text-anchor="middle">lancement</text>
  <text class="ti neutral-text" x="636" y="422" text-anchor="middle">soutenance</text>

  <text class="th neutral-text" x="350" y="222" text-anchor="middle">En parallèle de toutes les phases</text>

  <!-- Fil 1 — Gestion de projet -->
  <rect class="b-amber" x="76" y="240" width="170" height="32" rx="16" stroke-width="1"/>
  <text class="ts b-amber-text" x="161" y="256" text-anchor="middle" dominant-baseline="central">Gestion de projet</text>
  <line x1="246" y1="256" x2="628" y2="256" class="fil amber-stroke" marker-end="url(#arr-head)"/>
  <text class="ti amber-text" x="440" y="246" text-anchor="middle">la cadence : jalons, revues, points hebdomadaires</text>

  <!-- Fil 2 — Écoconception -->
  <rect class="b-amber" x="76" y="300" width="170" height="32" rx="16" stroke-width="1"/>
  <text class="ts b-amber-text" x="161" y="316" text-anchor="middle" dominant-baseline="central">Écoconception</text>
  <line x1="246" y1="316" x2="628" y2="316" class="fil amber-stroke" marker-end="url(#arr-head)"/>
  <text class="ti amber-text" x="440" y="306" text-anchor="middle">des critères pesés à chaque choix de conception</text>

  <!-- Fil 3 — Sécurité et qualité -->
  <rect class="b-amber" x="76" y="360" width="170" height="32" rx="16" stroke-width="1"/>
  <text class="ts b-amber-text" x="161" y="376" text-anchor="middle" dominant-baseline="central">Sécurité et qualité</text>
  <line x1="246" y1="376" x2="628" y2="376" class="fil amber-stroke" marker-end="url(#arr-head)"/>
  <text class="ti amber-text" x="440" y="366" text-anchor="middle">le cadre : normes, conformité, gestes sûrs</text>

  <text class="ts neutral-text" x="350" y="444" text-anchor="middle">Les trois fils se tiennent en continu — quelle que soit la phase active.</text>
</svg>

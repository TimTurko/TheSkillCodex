<svg viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <style>
      .h1 { font-size:15px; font-weight:600; fill:#2A2A2A; }
      .sub { font-size:11px; fill:#6E6E6E; }
      .hdr { font-size:11px; font-weight:600; fill:#3A3A3A; }
      .dchip { fill:#EFEEE9; stroke:#B9B6AC; stroke-width:1; }
      .dtext { font-size:11.5px; font-weight:600; fill:#2A2A2A; }
      .arr { font-size:13px; fill:#6E6E6E; }
      .gpSafe { fill:#F2F1EC; stroke:#C2BFB4; stroke-width:1; }
      .gpCaut { fill:#F7EBD6; stroke:#BA7517; stroke-width:1.2; }
      .gptext { font-size:11.5px; font-weight:600; fill:#2A2A2A; }
      .use { font-size:11px; fill:#4A4A4A; }
      .rowline { stroke:#EAE8E1; stroke-width:1; }
      .note { font-size:11px; fill:#5A5A5A; }
      .nStrong { font-size:11.5px; font-weight:600; fill:#3A3A3A; }
      .swSafe { fill:#F2F1EC; stroke:#C2BFB4; stroke-width:1; }
      .swCaut { fill:#F7EBD6; stroke:#BA7517; stroke-width:1.2; }
      @media (prefers-color-scheme: dark) {
        .h1 { fill:#EDEDED; }
        .sub { fill:#A8A8A8; }
        .hdr { fill:#DADADA; }
        .dchip { fill:#2A2A2A; stroke:#5A5A5A; }
        .dtext { fill:#ECECEC; }
        .arr { fill:#B0B0B0; }
        .gpSafe { fill:#2A2A2A; stroke:#4A4A4A; }
        .gpCaut { fill:#3A2E19; stroke:#E0A24A; }
        .gptext { fill:#ECECEC; }
        .use { fill:#C8C8C8; }
        .rowline { stroke:#333333; }
        .note { fill:#B0B0B0; }
        .nStrong { fill:#DADADA; }
        .swSafe { fill:#2A2A2A; stroke:#4A4A4A; }
        .swCaut { fill:#3A2E19; stroke:#E0A24A; }
      }
    </style>
  </defs>

  <text x="340" y="28" class="h1" text-anchor="middle">Brochage ESP8266 — étiquette de la carte ≠ numéro GPIO</text>
  <text x="340" y="48" class="sub" text-anchor="middle">Le code utilise le numéro GPIO, pas l'étiquette « D » imprimée sur la carte (NodeMCU / Wemos D1 mini)</text>

  <text x="56" y="78" class="hdr" text-anchor="middle">Carte</text>
  <text x="150" y="78" class="hdr" text-anchor="middle">GPIO (code)</text>
  <text x="206" y="78" class="hdr" text-anchor="start">Usage et précaution</text>

  <!-- D0 -->
  <line x1="30" y1="86" x2="650" y2="86" class="rowline"/>
  <rect x="30" y="92" width="52" height="22" rx="5" class="dchip"/><text x="56" y="107" class="dtext" text-anchor="middle">D0</text>
  <text x="92" y="107" class="arr" text-anchor="middle">→</text>
  <rect x="110" y="92" width="80" height="22" rx="5" class="gpCaut"/><text x="150" y="107" class="gptext" text-anchor="middle">GPIO16</text>
  <text x="206" y="107" class="use" text-anchor="start">Pas de PWM ni interruption · sert au réveil de veille</text>

  <!-- D1 -->
  <line x1="30" y1="116" x2="650" y2="116" class="rowline"/>
  <rect x="30" y="122" width="52" height="22" rx="5" class="dchip"/><text x="56" y="137" class="dtext" text-anchor="middle">D1</text>
  <text x="92" y="137" class="arr" text-anchor="middle">→</text>
  <rect x="110" y="122" width="80" height="22" rx="5" class="gpSafe"/><text x="150" y="137" class="gptext" text-anchor="middle">GPIO5</text>
  <text x="206" y="137" class="use" text-anchor="start">Sûr · souvent SCL (I2C)</text>

  <!-- D2 -->
  <line x1="30" y1="146" x2="650" y2="146" class="rowline"/>
  <rect x="30" y="152" width="52" height="22" rx="5" class="dchip"/><text x="56" y="167" class="dtext" text-anchor="middle">D2</text>
  <text x="92" y="167" class="arr" text-anchor="middle">→</text>
  <rect x="110" y="152" width="80" height="22" rx="5" class="gpSafe"/><text x="150" y="167" class="gptext" text-anchor="middle">GPIO4</text>
  <text x="206" y="167" class="use" text-anchor="start">Sûr · souvent SDA (I2C)</text>

  <!-- D3 -->
  <line x1="30" y1="176" x2="650" y2="176" class="rowline"/>
  <rect x="30" y="182" width="52" height="22" rx="5" class="dchip"/><text x="56" y="197" class="dtext" text-anchor="middle">D3</text>
  <text x="92" y="197" class="arr" text-anchor="middle">→</text>
  <rect x="110" y="182" width="80" height="22" rx="5" class="gpCaut"/><text x="150" y="197" class="gptext" text-anchor="middle">GPIO0</text>
  <text x="206" y="197" class="use" text-anchor="start">Prudence : bouton Flash · démarrage KO si à 0 au boot</text>

  <!-- D4 -->
  <line x1="30" y1="206" x2="650" y2="206" class="rowline"/>
  <rect x="30" y="212" width="52" height="22" rx="5" class="dchip"/><text x="56" y="227" class="dtext" text-anchor="middle">D4</text>
  <text x="92" y="227" class="arr" text-anchor="middle">→</text>
  <rect x="110" y="212" width="80" height="22" rx="5" class="gpCaut"/><text x="150" y="227" class="gptext" text-anchor="middle">GPIO2</text>
  <text x="206" y="227" class="use" text-anchor="start">Prudence : LED intégrée · démarrage KO si à 0 au boot</text>

  <!-- D5 -->
  <line x1="30" y1="236" x2="650" y2="236" class="rowline"/>
  <rect x="30" y="242" width="52" height="22" rx="5" class="dchip"/><text x="56" y="257" class="dtext" text-anchor="middle">D5</text>
  <text x="92" y="257" class="arr" text-anchor="middle">→</text>
  <rect x="110" y="242" width="80" height="22" rx="5" class="gpSafe"/><text x="150" y="257" class="gptext" text-anchor="middle">GPIO14</text>
  <text x="206" y="257" class="use" text-anchor="start">Sûr · SPI SCLK</text>

  <!-- D6 -->
  <line x1="30" y1="266" x2="650" y2="266" class="rowline"/>
  <rect x="30" y="272" width="52" height="22" rx="5" class="dchip"/><text x="56" y="287" class="dtext" text-anchor="middle">D6</text>
  <text x="92" y="287" class="arr" text-anchor="middle">→</text>
  <rect x="110" y="272" width="80" height="22" rx="5" class="gpSafe"/><text x="150" y="287" class="gptext" text-anchor="middle">GPIO12</text>
  <text x="206" y="287" class="use" text-anchor="start">Sûr · SPI MISO</text>

  <!-- D7 -->
  <line x1="30" y1="296" x2="650" y2="296" class="rowline"/>
  <rect x="30" y="302" width="52" height="22" rx="5" class="dchip"/><text x="56" y="317" class="dtext" text-anchor="middle">D7</text>
  <text x="92" y="317" class="arr" text-anchor="middle">→</text>
  <rect x="110" y="302" width="80" height="22" rx="5" class="gpSafe"/><text x="150" y="317" class="gptext" text-anchor="middle">GPIO13</text>
  <text x="206" y="317" class="use" text-anchor="start">Sûr · SPI MOSI</text>

  <!-- D8 -->
  <line x1="30" y1="326" x2="650" y2="326" class="rowline"/>
  <rect x="30" y="332" width="52" height="22" rx="5" class="dchip"/><text x="56" y="347" class="dtext" text-anchor="middle">D8</text>
  <text x="92" y="347" class="arr" text-anchor="middle">→</text>
  <rect x="110" y="332" width="80" height="22" rx="5" class="gpCaut"/><text x="150" y="347" class="gptext" text-anchor="middle">GPIO15</text>
  <text x="206" y="347" class="use" text-anchor="start">Prudence : SPI CS · démarrage KO si à 1 au boot</text>

  <!-- A0 -->
  <line x1="30" y1="356" x2="650" y2="356" class="rowline"/>
  <rect x="30" y="362" width="52" height="22" rx="5" class="dchip"/><text x="56" y="377" class="dtext" text-anchor="middle">A0</text>
  <text x="92" y="377" class="arr" text-anchor="middle">→</text>
  <rect x="110" y="362" width="80" height="22" rx="5" class="gpSafe"/><text x="150" y="377" class="gptext" text-anchor="middle">ADC0</text>
  <text x="206" y="377" class="use" text-anchor="start">Entrée analogique unique · 0–1 V (diviseur sur la carte)</text>

  <!-- TX/RX -->
  <line x1="30" y1="386" x2="650" y2="386" class="rowline"/>
  <rect x="30" y="392" width="52" height="22" rx="5" class="dchip"/><text x="56" y="407" class="dtext" text-anchor="middle">TX/RX</text>
  <text x="92" y="407" class="arr" text-anchor="middle">→</text>
  <rect x="110" y="392" width="80" height="22" rx="5" class="gpSafe"/><text x="150" y="407" class="gptext" text-anchor="middle">GPIO1/3</text>
  <text x="206" y="407" class="use" text-anchor="start">Port série (téléversement) · éviter en usage normal</text>
  <line x1="30" y1="416" x2="650" y2="416" class="rowline"/>

  <text x="30" y="442" class="nStrong" text-anchor="start">Broches sûres : D1, D2, D5, D6, D7.</text>
  <text x="30" y="460" class="note" text-anchor="start">GPIO6 à GPIO11 sont reliées à la mémoire flash : ne pas les utiliser. Logique 3,3 V.</text>

  <rect x="30" y="476" width="12" height="12" rx="2" class="swSafe"/><text x="48" y="486" class="note" text-anchor="start">utilisable normalement</text>
  <rect x="230" y="476" width="12" height="12" rx="2" class="swCaut"/><text x="248" y="486" class="note" text-anchor="start">à manier avec précaution (boot / limitations)</text>
</svg>
<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Étage de commutation à transistor NPN en bas-côté : la broche GPIO pilote la base via une résistance, l'émetteur est à la masse, la charge est entre +5 V et le collecteur, et une diode de roue libre est en parallèle de la charge.">
  <defs>
    <style>
      .wire { stroke: #4A4843; stroke-width: 2; fill: none; }
      .comp { stroke: #BA7517; stroke-width: 2; fill: none; }
      .fill { fill: #BA7517; }
      .title { fill: #4A4843; font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; font-weight: 700; }
      .lbl { fill: #4A4843; font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; }
      .lbl-am { fill: #8A5512; font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; font-weight: 600; }
      .cap { fill: #5B5953; font-family: "Segoe UI", system-ui, sans-serif; font-size: 12px; }
      @media (prefers-color-scheme: dark) {
        .wire { stroke: #D8D6CF; }
        .comp { stroke: #E0A24A; }
        .fill { fill: #E0A24A; }
        .title { fill: #D8D6CF; }
        .lbl { fill: #D8D6CF; }
        .lbl-am { fill: #E0A24A; }
        .cap { fill: #B7B4AC; }
      }
    </style>
  </defs>

  <text class="title" x="280" y="24" text-anchor="middle">Étage transistor — commutation bas-côté</text>

  <!-- Rail +5 V -->
  <line class="wire" x1="140" y1="52" x2="380" y2="52"/>
  <text class="lbl-am" x="392" y="56" text-anchor="start">+5 V</text>

  <!-- Charge entre +5 V et le collecteur -->
  <line class="wire" x1="300" y1="52" x2="300" y2="74"/>
  <rect class="comp" x="282" y="74" width="36" height="44" rx="4"/>
  <text class="lbl" x="300" y="100" text-anchor="middle">charge</text>
  <line class="wire" x1="300" y1="118" x2="300" y2="155"/>

  <!-- Diode de roue libre en parallèle de la charge -->
  <line class="wire" x1="300" y1="52" x2="210" y2="52"/>
  <line class="wire" x1="210" y1="52" x2="210" y2="150"/>
  <line class="wire" x1="210" y1="150" x2="300" y2="150"/>
  <polygon class="fill" points="199,108 221,108 210,86"/>
  <line class="wire" x1="199" y1="86" x2="221" y2="86"/>
  <text class="lbl" x="186" y="92" text-anchor="end">diode de roue</text>
  <text class="lbl" x="186" y="108" text-anchor="end">libre (1N4007)</text>

  <!-- Transistor NPN -->
  <circle class="comp" cx="300" cy="175" r="20"/>
  <text class="lbl" x="316" y="150" text-anchor="start">C</text>
  <text class="lbl" x="270" y="167" text-anchor="end">B</text>
  <text class="lbl" x="316" y="202" text-anchor="start">E</text>

  <!-- Base : GPIO -> résistance -> base -->
  <text class="lbl-am" x="96" y="179" text-anchor="end">GPIO D9</text>
  <line class="wire" x1="100" y1="175" x2="120" y2="175"/>
  <rect class="comp" x="120" y="164" width="44" height="22" rx="3"/>
  <text class="lbl" x="142" y="158" text-anchor="middle">1 kΩ</text>
  <line class="wire" x1="164" y1="175" x2="280" y2="175"/>

  <!-- Émetteur -> masse -->
  <line class="wire" x1="300" y1="195" x2="300" y2="235"/>
  <polygon class="fill" points="293,210 307,210 300,222"/>
  <line class="wire" x1="286" y1="235" x2="314" y2="235"/>
  <line class="wire" x1="290" y1="240" x2="310" y2="240"/>
  <line class="wire" x1="294" y1="245" x2="306" y2="245"/>
  <text class="lbl" x="300" y="262" text-anchor="middle">GND</text>

  <!-- Légende -->
  <text class="cap" x="280" y="294" text-anchor="middle">Charge entre +5 V et le collecteur, émetteur à la masse.</text>
  <text class="cap" x="280" y="310" text-anchor="middle">Résistance de base : limite le courant — diode : absorbe la surtension inductive.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="tq dq">
  <title id="tq">Quatre regards sur un même comportement</title>
  <desc id="dq">Quatre vignettes schématiques côte à côte. Un mini-logigramme : un losange de décision menant à deux actions, pour des décisions en cascade. Une mini-machine à états : trois états en cercle reliés par des transitions, pour des modes et des événements. Un mini-grafcet : trois étapes carrées séparées par des barres de transition, pour des séquences éventuellement parallèles. Un mini-chronogramme : deux signaux logiques sur un axe de temps, avec une ligne de repère verticale, pour des signaux dans le temps.</desc>
  <defs>
    <style>
      .ttl{font:700 14px sans-serif;fill:#2C2C2A;letter-spacing:.2px;}
      .shape{fill:none;stroke:#BA7517;stroke-width:2;}
      .gray{fill:none;stroke:#888780;stroke-width:1.6;}
      .arr{stroke:#888780;stroke-width:1.6;fill:none;marker-end:url(#aq);}
      .guide{stroke:#888780;stroke-width:1.2;stroke-dasharray:4 3;fill:none;}
      .lbl{font:700 12.5px sans-serif;fill:#2C2C2A;}
      .sub{font:italic 400 11.5px sans-serif;fill:#888780;}
      .tin{font:400 10px sans-serif;fill:#888780;}
      .aqf{fill:#888780;}
      @media (prefers-color-scheme: dark){
        .ttl{fill:#F1EFE8;} .shape{stroke:#EF9F27;} .gray{stroke:#BBBBBB;}
        .arr{stroke:#BBBBBB;} .guide{stroke:#BBBBBB;} .lbl{fill:#F1EFE8;}
        .sub{fill:#BBBBBB;} .tin{fill:#BBBBBB;} .aqf{fill:#BBBBBB;}
      }
    </style>
    <marker id="aq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="aqf"/></marker>
  </defs>

  <text x="360" y="26" class="ttl" text-anchor="middle">Quatre regards sur un même comportement</text>

  <!-- 1 · Mini-logigramme -->
  <path d="M 105,52 L 131,73 L 105,94 L 79,73 Z" class="shape"/>
  <text x="105" y="78" class="tin" text-anchor="middle">?</text>
  <path d="M 93,88 L 80,110" class="arr"/>
  <path d="M 117,88 L 130,110" class="arr"/>
  <rect x="56" y="113" width="46" height="21" rx="3" class="gray"/>
  <rect x="108" y="113" width="46" height="21" rx="3" class="gray"/>
  <text x="105" y="190" class="lbl" text-anchor="middle">Logigramme</text>
  <text x="105" y="208" class="sub" text-anchor="middle">des décisions en cascade</text>

  <!-- 2 · Mini-machine à états -->
  <circle cx="245" cy="72" r="16" class="shape"/>
  <circle cx="310" cy="72" r="16" class="shape"/>
  <circle cx="277" cy="130" r="16" class="shape"/>
  <path d="M 262,72 L 291,72" class="arr"/>
  <path d="M 301,85 L 287,116" class="arr"/>
  <path d="M 264,121 L 251,89" class="arr"/>
  <text x="277" y="190" class="lbl" text-anchor="middle">Machine à états</text>
  <text x="277" y="208" class="sub" text-anchor="middle">des modes et des événements</text>

  <!-- 3 · Mini-grafcet -->
  <rect x="430" y="50" width="30" height="24" class="gray"/>
  <text x="445" y="66" class="tin" text-anchor="middle">1</text>
  <line x1="445" y1="74" x2="445" y2="86" class="gray"/>
  <line x1="436" y1="80" x2="454" y2="80" class="shape"/>
  <rect x="430" y="86" width="30" height="24" class="gray"/>
  <text x="445" y="102" class="tin" text-anchor="middle">2</text>
  <line x1="445" y1="110" x2="445" y2="122" class="gray"/>
  <line x1="436" y1="116" x2="454" y2="116" class="shape"/>
  <rect x="430" y="122" width="30" height="24" class="gray"/>
  <text x="445" y="138" class="tin" text-anchor="middle">3</text>
  <text x="445" y="190" class="lbl" text-anchor="middle">Grafcet</text>
  <text x="445" y="208" class="sub" text-anchor="middle">des séquences, en parallèle</text>

  <!-- 4 · Mini-chronogramme -->
  <line x1="575" y1="48" x2="575" y2="143" class="guide"/>
  <path d="M 550,68 L 575,68 L 575,53 L 610,53 L 610,68 L 645,68 L 645,53 L 680,53" class="shape"/>
  <path d="M 550,113 L 590,113 L 590,98 L 655,98 L 655,113 L 680,113" class="shape"/>
  <path d="M 550,143 L 684,143" class="arr"/>
  <text x="692" y="147" class="tin" text-anchor="start">t</text>
  <text x="615" y="190" class="lbl" text-anchor="middle">Chronogramme</text>
  <text x="615" y="208" class="sub" text-anchor="middle">des signaux dans le temps</text>

  <text x="360" y="244" class="sub" text-anchor="middle">Le même comportement peut se décrire de quatre façons — choisir selon la question posée.</text>
</svg>

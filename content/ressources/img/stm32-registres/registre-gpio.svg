<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <style>
      .h1 { font-size:15px; font-weight:600; fill:#2A2A2A; }
      .sub { font-size:11px; fill:#6E6E6E; }
      .edge { font-size:9px; fill:#7A7A7A; }
      .cellN { fill:#F2F1EC; stroke:#C2BFB4; stroke-width:1; }
      .cellAlt { fill:#FBFAF7; stroke:#C2BFB4; stroke-width:1; }
      .cellHi { fill:#F7EBD6; stroke:#BA7517; stroke-width:1.6; }
      .divider { stroke:#C2BFB4; stroke-width:0.8; }
      .pinN { font-size:9.5px; fill:#5A5A5A; }
      .bitV { font-size:12px; font-weight:600; fill:#2A2A2A; }
      .callLine { stroke:#BA7517; stroke-width:1.4; fill:none; }
      .callT { font-size:11.5px; font-weight:600; fill:#BA7517; }
      .cap { font-size:11px; fill:#5A5A5A; }
      .nStrong { font-size:11.5px; font-weight:600; fill:#3A3A3A; }
      .n { font-size:11px; fill:#5A5A5A; }
      @media (prefers-color-scheme: dark) {
        .h1 { fill:#EDEDED; }
        .sub { fill:#A8A8A8; }
        .edge { fill:#A0A0A0; }
        .cellN { fill:#2A2A2A; stroke:#4A4A4A; }
        .cellAlt { fill:#242424; stroke:#4A4A4A; }
        .cellHi { fill:#3A2E19; stroke:#E0A24A; }
        .divider { stroke:#4A4A4A; }
        .pinN { fill:#B0B0B0; }
        .bitV { fill:#ECECEC; }
        .callLine { stroke:#E0A24A; }
        .callT { fill:#E0A24A; }
        .cap { fill:#B0B0B0; }
        .nStrong { fill:#DADADA; }
        .n { fill:#B0B0B0; }
      }
    </style>
  </defs>

  <text x="360" y="28" class="h1" text-anchor="middle">Un registre GPIO du STM32 — MODER (mode des broches)</text>
  <text x="360" y="48" class="sub" text-anchor="middle">32 bits = 16 broches × 2 bits · piloter une broche, c'est écrire dans ses 2 bits</text>

  <text x="24" y="100" class="edge" text-anchor="start">bit 31</text>
  <text x="696" y="100" class="edge" text-anchor="end">bit 0</text>

  <!-- 16 champs de 2 bits (broche 15 à gauche → broche 0 à droite) -->
  <rect x="24" y="108" width="42" height="44" rx="4" class="cellN"/><line x1="45" y1="108" x2="45" y2="152" class="divider"/><text x="45" y="172" class="pinN" text-anchor="middle">15</text>
  <rect x="66" y="108" width="42" height="44" rx="4" class="cellAlt"/><line x1="87" y1="108" x2="87" y2="152" class="divider"/><text x="87" y="172" class="pinN" text-anchor="middle">14</text>
  <rect x="108" y="108" width="42" height="44" rx="4" class="cellN"/><line x1="129" y1="108" x2="129" y2="152" class="divider"/><text x="129" y="172" class="pinN" text-anchor="middle">13</text>
  <rect x="150" y="108" width="42" height="44" rx="4" class="cellAlt"/><line x1="171" y1="108" x2="171" y2="152" class="divider"/><text x="171" y="172" class="pinN" text-anchor="middle">12</text>
  <rect x="192" y="108" width="42" height="44" rx="4" class="cellN"/><line x1="213" y1="108" x2="213" y2="152" class="divider"/><text x="213" y="172" class="pinN" text-anchor="middle">11</text>
  <rect x="234" y="108" width="42" height="44" rx="4" class="cellAlt"/><line x1="255" y1="108" x2="255" y2="152" class="divider"/><text x="255" y="172" class="pinN" text-anchor="middle">10</text>
  <rect x="276" y="108" width="42" height="44" rx="4" class="cellN"/><line x1="297" y1="108" x2="297" y2="152" class="divider"/><text x="297" y="172" class="pinN" text-anchor="middle">9</text>
  <rect x="318" y="108" width="42" height="44" rx="4" class="cellAlt"/><line x1="339" y1="108" x2="339" y2="152" class="divider"/><text x="339" y="172" class="pinN" text-anchor="middle">8</text>
  <rect x="360" y="108" width="42" height="44" rx="4" class="cellN"/><line x1="381" y1="108" x2="381" y2="152" class="divider"/><text x="381" y="172" class="pinN" text-anchor="middle">7</text>
  <rect x="402" y="108" width="42" height="44" rx="4" class="cellAlt"/><line x1="423" y1="108" x2="423" y2="152" class="divider"/><text x="423" y="172" class="pinN" text-anchor="middle">6</text>
  <rect x="444" y="108" width="42" height="44" rx="4" class="cellHi"/><line x1="465" y1="108" x2="465" y2="152" class="divider"/><text x="455" y="136" class="bitV" text-anchor="middle">0</text><text x="476" y="136" class="bitV" text-anchor="middle">1</text><text x="465" y="172" class="pinN" text-anchor="middle">5</text>
  <rect x="486" y="108" width="42" height="44" rx="4" class="cellAlt"/><line x1="507" y1="108" x2="507" y2="152" class="divider"/><text x="507" y="172" class="pinN" text-anchor="middle">4</text>
  <rect x="528" y="108" width="42" height="44" rx="4" class="cellN"/><line x1="549" y1="108" x2="549" y2="152" class="divider"/><text x="549" y="172" class="pinN" text-anchor="middle">3</text>
  <rect x="570" y="108" width="42" height="44" rx="4" class="cellAlt"/><line x1="591" y1="108" x2="591" y2="152" class="divider"/><text x="591" y="172" class="pinN" text-anchor="middle">2</text>
  <rect x="612" y="108" width="42" height="44" rx="4" class="cellN"/><line x1="633" y1="108" x2="633" y2="152" class="divider"/><text x="633" y="172" class="pinN" text-anchor="middle">1</text>
  <rect x="654" y="108" width="42" height="44" rx="4" class="cellAlt"/><line x1="675" y1="108" x2="675" y2="152" class="divider"/><text x="675" y="172" class="pinN" text-anchor="middle">0</text>

  <text x="360" y="190" class="cap" text-anchor="middle">n° de broche du port (PA0 … PA15) · chaque case = 2 bits</text>

  <!-- Callout broche 5 -->
  <line x1="465" y1="200" x2="465" y2="214" class="callLine"/>
  <text x="465" y="230" class="callT" text-anchor="middle">Broche 5 : ces 2 bits = 01 → sortie</text>

  <!-- Encodage -->
  <text x="360" y="262" class="nStrong" text-anchor="middle">Valeur des 2 bits :  00 entrée  ·  01 sortie  ·  10 fonction alternée  ·  11 analogique</text>

  <!-- Note manipulation de bits -->
  <text x="360" y="292" class="n" text-anchor="middle">Pour ne changer qu'une broche sans perturber les autres : lire le registre,</text>
  <text x="360" y="308" class="n" text-anchor="middle">modifier seulement ses 2 bits, puis réécrire (lecture – modification – écriture).</text>
</svg>
<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <style>
      .h1 { font-size:15px; font-weight:600; fill:#2A2A2A; }
      .sub { font-size:11px; fill:#6E6E6E; }
      .wire { fill:none; stroke:#6E6E6E; stroke-width:2; }
      .sig { fill:none; stroke:#BA7517; stroke-width:2.5; }
      .boxN { fill:#FFFFFF; stroke:#B9B6AC; stroke-width:1.4; }
      .comp { fill:#F7EBD6; stroke:#BA7517; stroke-width:1.6; }
      .dot { fill:#6E6E6E; }
      .lblBox { font-size:14px; font-weight:600; fill:#3A3A3A; }
      .lblPin { font-size:11px; font-weight:600; fill:#2A2A2A; }
      .sigL { font-size:11px; font-weight:600; fill:#7A5310; }
      .n { font-size:11px; fill:#5A5A5A; }
      .nStrong { font-size:11.5px; font-weight:600; fill:#3A3A3A; }
      @media (prefers-color-scheme: dark) {
        .h1 { fill:#EDEDED; }
        .sub { fill:#A8A8A8; }
        .wire { stroke:#B0B0B0; }
        .sig { stroke:#E0A24A; }
        .boxN { fill:#1F1F1F; stroke:#5A5A5A; }
        .comp { fill:#3A2E19; stroke:#E0A24A; }
        .dot { fill:#B0B0B0; }
        .lblBox { fill:#DADADA; }
        .lblPin { fill:#ECECEC; }
        .sigL { fill:#E0A24A; }
        .n { fill:#B0B0B0; }
        .nStrong { fill:#DADADA; }
      }
    </style>
  </defs>

  <text x="310" y="26" class="h1" text-anchor="middle">Alimentation séparée du servo — masse commune</text>
  <text x="310" y="46" class="sub" text-anchor="middle">Du Pico ne part que le signal (GP15) ; le servo est alimenté à part ; toutes les masses sont reliées</text>

  <!-- Pico -->
  <rect x="44" y="80" width="140" height="104" rx="10" class="boxN"/>
  <text x="114" y="106" class="lblBox" text-anchor="middle">Pico</text>
  <text x="114" y="124" class="n" text-anchor="middle">(alim. USB)</text>
  <text x="176" y="156" class="lblPin" text-anchor="end">GP15</text>
  <circle cx="184" cy="152" r="3" class="dot"/>
  <text x="100" y="178" class="lblPin" text-anchor="end">GND</text>
  <circle cx="114" cy="184" r="3" class="dot"/>

  <!-- Servo -->
  <rect x="436" y="80" width="140" height="104" rx="10" class="comp"/>
  <text x="506" y="106" class="lblBox" text-anchor="middle">Servo</text>
  <circle cx="436" cy="128" r="3" class="dot"/><text x="444" y="132" class="sigL" text-anchor="start">signal</text>
  <circle cx="436" cy="152" r="3" class="dot"/><text x="444" y="156" class="lblPin" text-anchor="start">+5 V</text>
  <text x="506" y="178" class="lblPin" text-anchor="middle">GND</text>
  <circle cx="506" cy="184" r="3" class="dot"/>

  <!-- Source 5 V -->
  <rect x="44" y="248" width="180" height="56" rx="8" class="boxN"/>
  <text x="134" y="272" class="lblBox" text-anchor="middle">Source 5 V dédiée</text>
  <text x="134" y="290" class="n" text-anchor="middle">(VBUS ou alim externe)</text>
  <text x="232" y="266" class="lblPin" text-anchor="start">+5 V</text>
  <circle cx="224" cy="270" r="3" class="dot"/>
  <circle cx="134" cy="304" r="3" class="dot"/>

  <!-- Signal GP15 -> servo (orange) -->
  <path d="M184,152 L310,152 L310,128 L436,128" class="sig"/>

  <!-- Puissance source +5V -> servo +5V -->
  <path d="M224,270 L380,270 L380,152 L436,152" class="wire"/>

  <!-- GND commun -->
  <line x1="114" y1="184" x2="114" y2="326" class="wire"/>
  <line x1="134" y1="304" x2="134" y2="326" class="wire"/>
  <line x1="506" y1="184" x2="506" y2="326" class="wire"/>
  <line x1="114" y1="326" x2="506" y2="326" class="wire"/>
  <text x="310" y="344" class="nStrong" text-anchor="middle">GND commun</text>

  <text x="44" y="344" class="n" text-anchor="start">Le servo ne tire pas</text>
  <text x="44" y="358" class="n" text-anchor="start">son courant du Pico.</text>
</svg>

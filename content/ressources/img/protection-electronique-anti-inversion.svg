<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 195" role="img" aria-labelledby="t1 d1">
  <title id="t1">Branchement de la diode anti-inversion</title>
  <desc id="d1">La diode anti-inversion se branche en série sur le fil positif, orientée pour laisser passer le courant dans le bon sens. En cas de branchement à l'envers, elle bloque le courant et la charge est protégée. Elle chute environ 0,7 volt (0,3 volt en Schottky). Au-delà de quelques centaines de milliampères, un MOSFET-P prend la même place sans chute de tension.</desc>
  <defs>
    <style>
      .lab { font: 600 12px sans-serif; fill: #2C2C2A; }
      .sm { font: 400 10px sans-serif; fill: #888780; }
      .orglab { font: 700 11px sans-serif; fill: #BA7517; }
      .org { stroke: #BA7517; stroke-width: 2.2; fill: none; }
      .orgf { fill: #BA7517; }
      .bx { fill: #DDDBD3; stroke: #888780; stroke-width: 1.2; }
      .wire { stroke: #888780; stroke-width: 1.6; fill: none; }
      .flt { font: 700 10px sans-serif; fill: #B23A2E; }
      .foot { font: italic 400 10px sans-serif; fill: #888780; }
      @media (prefers-color-scheme: dark) {
        .lab { fill: #F1EFE8; }
        .sm, .foot { fill: #BBBBBB; }
        .orglab { fill: #EF9F27; }
        .org { stroke: #EF9F27; }
        .orgf { fill: #EF9F27; }
        .bx { fill: #4A4A48; stroke: #BBBBBB; }
        .wire { stroke: #BBBBBB; }
        .flt { fill: #E0705F; }
      }
    </style>
  </defs>

  <text x="217" y="46" text-anchor="middle" class="flt">branchement à l'envers : courant bloqué</text>

  <rect x="20" y="75" width="90" height="40" rx="3" class="bx"/>
  <text x="65" y="99" text-anchor="middle" class="lab">source</text>
  <line x1="110" y1="95" x2="203" y2="95" class="wire"/>

  <path d="M203,85 L203,105 L231,95 Z" class="orgf"/>
  <line x1="231" y1="85" x2="231" y2="105" class="org"/>
  <text x="217" y="70" text-anchor="middle" class="orglab">diode anti-inversion</text>
  <text x="217" y="132" text-anchor="middle" class="sm">chute ~0,7 V (~0,3 V en Schottky)</text>

  <line x1="231" y1="95" x2="360" y2="95" class="wire"/>
  <rect x="360" y="75" width="90" height="40" rx="3" class="bx"/>
  <text x="405" y="99" text-anchor="middle" class="lab">charge</text>

  <polyline points="405,115 405,148 65,148 65,115" class="wire"/>

  <text x="280" y="182" text-anchor="middle" class="foot">Au-delà de quelques centaines de mA, un MOSFET-P prend la même place, sans chute.</text>
</svg>

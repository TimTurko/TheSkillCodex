<rect class="t1" x="414" y="228" width="14" height="26"/><rect class="t2" x="430" y="228" width="14" height="26"/><rect class="t3" x="446" y="228" width="14" height="26"/>
<rect class="t1" x="462" y="228" width="14" height="26"/><rect class="t2" x="478" y="228" width="14" height="26"/><rect class="t3" x="494" y="228" width="14" height="26"/>
<rect class="t1" x="510" y="228" width="14" height="26"/><rect class="t2" x="526" y="228" width="14" height="26"/><rect class="t3" x="542" y="228" width="14" height="26"/>
<rect class="t1" x="558" y="228" width="14" height="26"/><rect class="t2" x="574" y="228" width="14" height="26"/><rect class="t3" x="590" y="228" width="14" height="26"/>
</g>

<path class="pointille" d="M 150 254 L 150 268"/>
<path class="pointille" d="M 165 254 L 165 268"/>
<path class="axe" d="M 172 274 L 196 268"/>
<text class="lbls" x="200" y="278">vu dès la tranche suivante — le retard tient dans un tour de boucle</text>

<rect class="t1" x="30" y="296" width="12" height="12"/>
<text class="lbls" x="47" y="306">tâche 1</text>
<rect class="t2" x="110" y="296" width="12" height="12"/>

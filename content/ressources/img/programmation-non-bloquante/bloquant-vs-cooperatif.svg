<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Boucle bloquante et boucle coopérative comparées sur une même durée</title>
<desc id="d">Deux frises temporelles. En haut, une boucle bloquante alterne de courtes tâches et de longues attentes ; un événement survenu pendant une attente n'est pris en compte qu'à la fin de celle-ci. En bas, une boucle coopérative découpe la même durée en tranches brèves qui se succèdent sans interruption ; le même événement est vu à la tranche suivante.</desc>
<defs>
<style>
.titre { font: 600 14px system-ui, -apple-system, sans-serif; fill: #24292f; }
.lbl   { font: 400 11px system-ui, -apple-system, sans-serif; fill: #24292f; }
.lbls  { font: 400 10px system-ui, -apple-system, sans-serif; fill: #57606a; }
.axe      { stroke: #57606a; stroke-width: 1; fill: none; }
.pointille{ stroke: #57606a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
.t1 { fill: #BA7517; }
.t2 { fill: #D08F33; }
.t3 { fill: #E8C58C; }
.attente { fill: #E5E1DA; stroke: #57606a; stroke-width: 1; }
.fleche { stroke: #BA7517; stroke-width: 2; fill: none; }
.pointe { fill: #BA7517; }
@media (prefers-color-scheme: dark) {
  .titre, .lbl { fill: #d9dde1; }
  .lbls { fill: #a6adb5; }
  .axe, .pointille { stroke: #a6adb5; }
  .t1 { fill: #E0A24A; }
  .t2 { fill: #C08334; }
  .t3 { fill: #8C6A38; }
  .attente { fill: #3A3F45; stroke: #a6adb5; }
  .fleche { stroke: #E0A24A; }
  .pointe { fill: #E0A24A; }
}
</style>
<marker id="tete" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
  <path class="pointe" d="M 0 0 L 10 5 L 0 10 z"/>
</marker>
</defs>

<text class="titre" x="30" y="24">Boucle bloquante</text>

<text class="lbls" x="150" y="46" text-anchor="middle">événement</text>
<path class="fleche" d="M 150 52 L 150 68" marker-end="url(#tete)"/>

<text class="lbls" x="30" y="66">tâche</text>
<rect class="t1" x="30" y="72" width="34" height="26"/>
<rect class="attente" x="64" y="72" width="176" height="26"/>
<rect class="t1" x="240" y="72" width="34" height="26"/>
<rect class="attente" x="274" y="72" width="176" height="26"/>
<rect class="t1" x="450" y="72" width="34" height="26"/>
<rect class="attente" x="484" y="72" width="126" height="26"/>
<text class="lbl" x="152" y="89" text-anchor="middle">attente bloquante</text>
<text class="lbl" x="362" y="89" text-anchor="middle">attente bloquante</text>

<path class="pointille" d="M 150 98 L 150 118"/>
<path class="pointille" d="M 240 98 L 240 118"/>
<path class="axe" d="M 152 118 L 238 118" marker-start="url(#tete)" marker-end="url(#tete)"/>
<text class="lbls" x="195" y="113" text-anchor="middle">retard</text>
<text class="lbls" x="250" y="122">l'événement n'est pris en compte qu'à la fin de l'attente</text>

<text class="titre" x="30" y="180">Boucle coopérative</text>

<text class="lbls" x="150" y="202" text-anchor="middle">événement</text>
<path class="fleche" d="M 150 208 L 150 224" marker-end="url(#tete)"/>

<g>

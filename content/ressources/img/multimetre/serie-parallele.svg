<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-labelledby="t1 d1">
  <title id="t1">Brancher un multimètre : voltmètre en parallèle, ampèremètre en série</title>
  <desc id="d1">Deux montages comparés. À gauche, un voltmètre (cercle marqué V) est connecté par deux fils aux deux bornes d'une résistance, en parallèle : le circuit reste fermé. À droite, un ampèremètre (cercle marqué A) est inséré dans le fil même du circuit, en série : on ouvre le circuit pour le placer. Chaque montage comprend une pile et une résistance. Un ampèremètre branché par erreur en parallèle court-circuite le montage et grille son fusible.</desc>
  <defs>
    <style>
      .ttl  { font:700 14px sans-serif; text-anchor:middle; fill:#2C2C2A; letter-spacing:.2px; }
      .lbl  { font:700 13px sans-serif; text-anchor:middle; fill:#2C2C2A; }
      .cap  { font:italic 400 11.5px sans-serif; text-anchor:middle; fill:#888780; }
      .foot { font:italic 700 11.5px sans-serif; text-anchor:middle; fill:#BA7517; }
      .wire { stroke:#888780; stroke-width:2; fill:none; }
      .comp { fill:#DDDBD3; stroke:#BA7517; stroke-width:2.2; }
      .clbl { font:700 12px sans-serif; fill:#2C2C2A; }
      .meter{ fill:#DDDBD3; stroke:#BA7517; stroke-width:2.4; }
      .mlbl { font:700 16px sans-serif; text-anchor:middle; fill:#BA7517; }
      .bat  { stroke:#BA7517; fill:none; }
      @media (prefers-color-scheme: dark) {
        .ttl{fill:#F1EFE8;} .lbl{fill:#F1EFE8;} .cap{fill:#BBBBBB;} .foot{fill:#EF9F27;}
        .wire{stroke:#BBBBBB;} .comp{fill:#4A4A48;stroke:#EF9F27;} .clbl{fill:#F1EFE8;}
        .meter{fill:#4A4A48;stroke:#EF9F27;} .mlbl{fill:#EF9F27;} .bat{stroke:#EF9F27;}
      }
    </style>
  </defs>

  <text x="410" y="28" class="ttl">Brancher un multimètre — la topologie distingue la mesure du court-circuit</text>

  <!-- ===== GAUCHE : voltmètre en parallèle ===== -->
  <text x="236" y="74" class="lbl">Voltmètre — en parallèle</text>
  <line x1="100" y1="150" x2="300" y2="150" class="wire"/>
  <line x1="100" y1="150" x2="100" y2="290" class="wire"/>
  <line x1="300" y1="150" x2="300" y2="195" class="wire"/>
  <line x1="300" y1="255" x2="300" y2="290" class="wire"/>
  <line x1="100" y1="290" x2="190" y2="290" class="wire"/>
  <line x1="199" y1="290" x2="300" y2="290" class="wire"/>
  <line x1="190" y1="278" x2="190" y2="302" class="bat" stroke-width="1.6"/>
  <line x1="199" y1="283" x2="199" y2="297" class="bat" stroke-width="3.4"/>
  <rect x="291" y="195" width="18" height="60" rx="2" class="comp"/>
  <text x="320" y="229" class="clbl">R</text>
  <line x1="300" y1="195" x2="354" y2="217" class="wire"/>
  <line x1="300" y1="255" x2="354" y2="233" class="wire"/>
  <circle cx="374" cy="225" r="22" class="meter"/>
  <text x="374" y="231" class="mlbl">V</text>
  <text x="236" y="324" class="cap">aux bornes du composant — le circuit reste fermé</text>

  <!-- ===== DROITE : ampèremètre en série ===== -->
  <text x="588" y="74" class="lbl">Ampèremètre — en série</text>
  <line x1="490" y1="150" x2="580" y2="150" class="wire"/>
  <line x1="624" y1="150" x2="690" y2="150" class="wire"/>
  <line x1="490" y1="150" x2="490" y2="290" class="wire"/>
  <line x1="690" y1="150" x2="690" y2="195" class="wire"/>
  <line x1="690" y1="255" x2="690" y2="290" class="wire"/>
  <line x1="490" y1="290" x2="580" y2="290" class="wire"/>
  <line x1="589" y1="290" x2="690" y2="290" class="wire"/>
  <line x1="580" y1="278" x2="580" y2="302" class="bat" stroke-width="1.6"/>
  <line x1="589" y1="283" x2="589" y2="297" class="bat" stroke-width="3.4"/>
  <rect x="681" y="195" width="18" height="60" rx="2" class="comp"/>
  <text x="710" y="229" class="clbl">R</text>
  <circle cx="602" cy="150" r="22" class="meter"/>
  <text x="602" y="156" class="mlbl">A</text>
  <text x="588" y="324" class="cap">inséré dans le circuit, qu'on ouvre pour le placer</text>

  <text x="410" y="348" class="foot">Un ampèremètre branché en parallèle court-circuite le montage — fusible grillé.</text>
</svg>

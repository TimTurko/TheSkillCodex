<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t2 d2">
  <title id="t2">Comment on grille le fusible d'un multimètre, en trois temps</title>
  <desc id="d2">Enchaînement en trois étapes. Première étape : une mesure de courant correcte, l'appareil est inséré en série dans un circuit comprenant une pile et une résistance, le cordon rouge est branché sur la borne 10 A et le sélecteur est sur la position A. Deuxième étape : la mesure terminée, le sélecteur revient sur la position tension V continu, mais le cordon rouge reste oublié dans la borne 10 A. Troisième étape : on pose les deux pointes en parallèle sur une source de 5 volts pour mesurer une tension ; comme l'appareil est encore un ampèremètre, sa résistance interne est quasi nulle, il se comporte comme un simple fil entre les deux bornes de la source, ce qui crée un court-circuit et fait fondre le fusible interne. Le réflexe qui l'évite est de replacer le cordon rouge dans la borne V oméga dès qu'une mesure de courant est terminée.</desc>
  <defs>
    <style>
      .ttl  { font:700 14px sans-serif; text-anchor:middle; fill:#2C2C2A; letter-spacing:.2px; }
      .lbl  { font:700 13px sans-serif; text-anchor:middle; fill:#2C2C2A; }
      .cap  { font:italic 400 11.5px sans-serif; text-anchor:middle; fill:#888780; }
      .foot { font:italic 700 11.5px sans-serif; text-anchor:middle; fill:#BA7517; }
      .wire { stroke:#888780; stroke-width:2; fill:none; }
      .red  { stroke:#BA7517; stroke-width:3; fill:none; }
      .comp { fill:#DDDBD3; stroke:#BA7517; stroke-width:2.2; }
      .clbl { font:700 12px sans-serif; fill:#2C2C2A; }
      .clc  { font:700 12px sans-serif; text-anchor:middle; fill:#2C2C2A; }
      .meter{ fill:#DDDBD3; stroke:#BA7517; stroke-width:2.4; }
      .mlbl { font:700 16px sans-serif; text-anchor:middle; fill:#BA7517; }
      .bat  { stroke:#BA7517; fill:none; }
      .born { fill:#DDDBD3; stroke:#BA7517; stroke-width:2; }
      .blbl { font:700 10.5px sans-serif; text-anchor:middle; fill:#2C2C2A; }
      .arw  { stroke:#888780; stroke-width:2.2; fill:none; }
      .arwh { fill:#888780; }
      .brk  { stroke:#BA7517; stroke-width:2.4; fill:none; stroke-linecap:round; }
      @media (prefers-color-scheme: dark) {
        .ttl{fill:#F1EFE8;} .lbl{fill:#F1EFE8;} .cap{fill:#BBBBBB;} .foot{fill:#EF9F27;}
        .wire{stroke:#BBBBBB;} .red{stroke:#EF9F27;} .comp{fill:#4A4A48;stroke:#EF9F27;}
        .clbl{fill:#F1EFE8;} .clc{fill:#F1EFE8;} .meter{fill:#4A4A48;stroke:#EF9F27;}
        .mlbl{fill:#EF9F27;} .bat{stroke:#EF9F27;} .born{fill:#4A4A48;stroke:#EF9F27;}
        .blbl{fill:#F1EFE8;} .arw{stroke:#BBBBBB;} .arwh{fill:#BBBBBB;} .brk{stroke:#EF9F27;}
      }
    </style>
  </defs>

  <text x="450" y="26" class="ttl">Le fusible ne grille pas pendant la mesure de courant — il grille à la mesure suivante</text>

  <!-- ===== 1 : mesure de courant, correcte ===== -->
  <text x="150" y="58" class="lbl">1 — Mesure de courant</text>
  <line x1="80" y1="110" x2="128" y2="110" class="wire"/>
  <line x1="172" y1="110" x2="220" y2="110" class="wire"/>
  <line x1="80" y1="110" x2="80" y2="220" class="wire"/>
  <line x1="220" y1="110" x2="220" y2="150" class="wire"/>
  <line x1="220" y1="196" x2="220" y2="220" class="wire"/>
  <line x1="80" y1="220" x2="140" y2="220" class="wire"/>
  <line x1="149" y1="220" x2="220" y2="220" class="wire"/>
  <line x1="140" y1="209" x2="140" y2="231" class="bat" stroke-width="1.6"/>
  <line x1="149" y1="213" x2="149" y2="227" class="bat" stroke-width="3.4"/>
  <rect x="211" y="150" width="18" height="46" rx="2" class="comp"/>
  <text x="238" y="178" class="clbl">R</text>
  <circle cx="150" cy="110" r="21" class="meter"/>
  <text x="150" y="116" class="mlbl">A</text>
  <text x="150" y="268" class="cap">sélecteur sur A, cordon rouge</text>
  <text x="150" y="283" class="cap">en borne 10 A, appareil en série</text>
  <text x="150" y="298" class="cap">— tout est juste</text>

  <!-- ===== 2 : le cordon reste ===== -->
  <text x="450" y="58" class="lbl">2 — On range, à moitié</text>
  <rect x="380" y="82" width="140" height="150" rx="10" class="meter"/>
  <circle cx="450" cy="132" r="30" class="comp"/>
  <line x1="450" y1="132" x2="472" y2="112" class="red" stroke-linecap="round"/>
  <text x="450" y="98" class="clc">V⎓</text>
  <circle cx="410" cy="200" r="11" class="born"/>
  <circle cx="450" cy="200" r="11" class="born"/>
  <circle cx="490" cy="200" r="11" class="born"/>
  <text x="410" y="224" class="blbl">COM</text>
  <text x="450" y="224" class="blbl">V/Ω</text>
  <text x="490" y="224" class="blbl">10 A</text>
  <line x1="410" y1="200" x2="410" y2="248" class="wire"/>
  <line x1="490" y1="200" x2="490" y2="248" class="red"/>
  <text x="450" y="268" class="cap">le sélecteur est revenu sur V⎓,</text>
  <text x="450" y="283" class="cap">le cordon rouge est resté en 10 A</text>
  <text x="450" y="298" class="cap">— rien ne le signale</text>

  <!-- ===== 3 : court-circuit ===== -->
  <text x="750" y="58" class="lbl">3 — Mesure de tension</text>
  <rect x="668" y="92" width="164" height="42" rx="4" class="comp"/>
  <text x="750" y="119" class="clc">source 5 V</text>
  <line x1="700" y1="134" x2="700" y2="160" class="wire"/>
  <line x1="800" y1="134" x2="800" y2="184" class="red"/>
  <rect x="691" y="160" width="18" height="26" rx="2" class="comp"/>
  <path d="M694 182 L700 172" class="brk"/>
  <path d="M701 174 L706 164" class="brk"/>
  <text x="672" y="178" class="cap" text-anchor="end">fusible</text>
  <line x1="700" y1="186" x2="700" y2="204" class="wire"/>
  <rect x="668" y="204" width="164" height="48" rx="6" class="meter"/>
  <text x="750" y="234" class="mlbl">A</text>
  <line x1="800" y1="184" x2="800" y2="204" class="red"/>
  <text x="750" y="268" class="cap">les pointes en parallèle, mais</text>
  <text x="750" y="283" class="cap">l'appareil est encore ampèremètre :</text>
  <text x="750" y="298" class="cap">un fil posé sur la source</text>

  <!-- flèches -->
  <line x1="270" y1="160" x2="352" y2="160" class="arw"/>
  <polygon points="366,160 352,154 352,166" class="arwh"/>
  <line x1="570" y1="160" x2="652" y2="160" class="arw"/>
  <polygon points="666,160 652,154 652,166" class="arwh"/>

  <text x="450" y="340" class="foot">Le réflexe : remettre le cordon rouge en V/Ω dès qu'une mesure de courant est finie.</text>
  <text x="450" y="362" class="cap">Le fusible interne s'est sacrifié pour l'appareil — c'est son rôle.</text>
</svg>

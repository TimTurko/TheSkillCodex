<svg viewBox="0 0 640 336" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <style>
      .h1 { font-size:16px; font-weight:600; fill:#2A2A2A; }
      .sub { font-size:11px; fill:#6E6E6E; }
      .wire { fill:none; stroke:#6E6E6E; stroke-width:2; }
      .boxN { fill:#FFFFFF; stroke:#B9B6AC; stroke-width:1.4; }
      .comp { fill:#F7EBD6; stroke:#BA7517; stroke-width:1.6; }
      .compLine { fill:none; stroke:#BA7517; stroke-width:2; }
      .dot { fill:#6E6E6E; }
      .lbl { font-size:12px; fill:#2A2A2A; }
      .lblBox { font-size:14px; font-weight:600; fill:#3A3A3A; }
      .lblPin { font-size:11px; font-weight:600; fill:#2A2A2A; }
      .nStrong { font-size:11.5px; font-weight:600; fill:#3A3A3A; }
      .n { font-size:11px; fill:#5A5A5A; }
      @media (prefers-color-scheme: dark) {
        .h1 { fill:#EDEDED; }
        .sub { fill:#A8A8A8; }
        .wire { stroke:#B0B0B0; }
        .boxN { fill:#1F1F1F; stroke:#5A5A5A; }
        .comp { fill:#3A2E19; stroke:#E0A24A; }
        .compLine { stroke:#E0A24A; }
        .dot { fill:#B0B0B0; }
        .lbl { fill:#ECECEC; }
        .lblBox { fill:#DADADA; }
        .lblPin { fill:#ECECEC; }
        .nStrong { fill:#DADADA; }
        .n { fill:#B0B0B0; }
      }
    </style>
  </defs>

  <text x="320" y="28" class="h1" text-anchor="middle">Câblage — réveil par bouton (deep sleep)</text>
  <text x="320" y="48" class="sub" text-anchor="middle">Les noms de broches sont ceux du code : GPIO33, 3V3, GND</text>

  <!-- ESP32 -->
  <rect x="44" y="86" width="150" height="182" rx="10" class="boxN"/>
  <text x="119" y="112" class="lblBox" text-anchor="middle">ESP32</text>
  <text x="186" y="124" class="lblPin" text-anchor="end">3V3</text>
  <text x="186" y="182" class="lblPin" text-anchor="end">GPIO33</text>
  <text x="186" y="256" class="lblPin" text-anchor="end">GND</text>

  <!-- Rail 3,3 V + resistance de tirage -->
  <circle cx="194" cy="118" r="3" class="dot"/>
  <line x1="194" y1="118" x2="330" y2="118" class="wire"/>
  <rect x="330" y="107" width="56" height="22" rx="2" class="comp"/>
  <text x="358" y="100" class="lbl" text-anchor="middle">R 10 kΩ</text>
  <line x1="386" y1="118" x2="470" y2="118" class="wire"/>
  <line x1="470" y1="118" x2="470" y2="176" class="wire"/>
  <text x="262" y="110" class="lbl" text-anchor="middle">3,3 V</text>

  <!-- Ligne GPIO33 -->
  <circle cx="194" cy="176" r="3" class="dot"/>
  <line x1="194" y1="176" x2="470" y2="176" class="wire"/>
  <circle cx="470" cy="176" r="3" class="dot"/>

  <!-- Descente vers le bouton -->
  <line x1="470" y1="176" x2="470" y2="250" class="wire"/>

  <!-- Bouton sur le retour vers GND -->
  <line x1="470" y1="250" x2="348" y2="250" class="wire"/>
  <line x1="348" y1="250" x2="348" y2="238" class="compLine"/>
  <line x1="320" y1="250" x2="320" y2="238" class="compLine"/>
  <line x1="314" y1="236" x2="354" y2="236" class="compLine"/>
  <line x1="334" y1="236" x2="334" y2="226" class="compLine"/>
  <line x1="320" y1="250" x2="194" y2="250" class="wire"/>
  <circle cx="194" cy="250" r="3" class="dot"/>
  <text x="334" y="272" class="lbl" text-anchor="middle">Bouton</text>

  <!-- Note -->
  <text x="44" y="304" class="nStrong">Bon à savoir</text>
  <text x="44" y="322" class="n">Pendant le sommeil, les tirages internes ne sont pas garantis : la résistance externe tient GPIO33 à 3,3 V au repos. L'appui la relie à GND — c'est ce niveau bas qui réveille la carte. GPIO33 est une broche RTC, seule catégorie acceptée par ext0.</text>
</svg>

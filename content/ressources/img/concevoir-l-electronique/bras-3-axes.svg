<svg viewBox="0 0 760 585" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <style>
      .blk { fill:#DDDBD3; stroke:#4a4a4a; stroke-width:1.4; }
      .env { fill:none; stroke:#8a8a8a; stroke-width:1.4; }
      .t  { font-size:13.5px; fill:#1a1a1a; }
      .ts { font-size:11px; fill:#5a5a5a; }
      .tl { font-size:11.5px; fill:#1a1a1a; }
      .fi { stroke:#1a1a1a; stroke-width:1.4; fill:none; }
      .fe { stroke:#BA7517; stroke-width:3.5; fill:none; }
      .mi { fill:#1a1a1a; }
      .me { fill:#BA7517; }
      .bdg { fill:#BA7517; }
      .bt { font-size:11px; fill:#ffffff; font-weight:600; }
      @media (prefers-color-scheme: dark) {
        .blk { fill:#3b3b3b; stroke:#9a9a9a; }
        .env { stroke:#9a9a9a; }
        .t, .tl { fill:#DDDBD3; }
        .ts { fill:#b0b0b0; }
        .fi { stroke:#DDDBD3; }
        .fe { stroke:#D9913B; }
        .mi { fill:#DDDBD3; }
        .me { fill:#D9913B; }
        .bdg { fill:#D9913B; }
        .bt { fill:#1a1a1a; }
      }
    </style>
    <marker id="ai" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path class="mi" d="M0,0 L10,5 L0,10 Z"/></marker>
    <marker id="ae" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="6.5" orient="auto"><path class="me" d="M0,0 L13,6.5 L0,13 Z"/></marker>
  </defs>

  <!-- Blocs -->
  <rect class="blk" x="20" y="70" width="120" height="54" rx="6"/>
  <text class="t" x="80" y="92" text-anchor="middle" style="font-size:12.5px">Source 12 V</text>
  <text class="ts" x="80" y="110" text-anchor="middle">(bloc secteur)</text>

  <rect class="blk" x="160" y="220" width="150" height="50" rx="6"/>
  <text class="t" x="235" y="240" text-anchor="middle" style="font-size:12.5px">Régulateur</text>
  <text class="ts" x="235" y="257" text-anchor="middle">12 V → 5 V</text>

  <rect class="blk" x="260" y="300" width="170" height="110" rx="6"/>
  <text class="t" x="345" y="330" text-anchor="middle">Carte ESP32</text>
  <text class="ts" x="345" y="351" text-anchor="middle">(régul. 3,3 V embarqué)</text>
  <text class="ts" x="345" y="371" text-anchor="middle">PWM · ADC · GPIO · UART</text>

  <rect class="blk" x="540" y="70" width="180" height="64" rx="6"/>
  <text class="t" x="630" y="93" text-anchor="middle" style="font-size:13px">3 × Driver A4988</text>
  <text class="ts" x="630" y="112" text-anchor="middle">(roue libre intégrée)</text>

  <rect class="blk" x="540" y="180" width="180" height="54" rx="6"/>
  <text class="t" x="630" y="211" text-anchor="middle" style="font-size:13px">3 × Stepper NEMA 17</text>

  <rect class="blk" x="540" y="300" width="180" height="54" rx="6"/>
  <text class="t" x="630" y="321" text-anchor="middle" style="font-size:12.5px">3 × Capteur d'angle</text>
  <text class="ts" x="630" y="340" text-anchor="middle">(sortie 0–3,3 V)</text>

  <rect class="blk" x="540" y="420" width="180" height="54" rx="6"/>
  <text class="t" x="630" y="441" text-anchor="middle" style="font-size:12.5px">6 × Fin de course</text>
  <text class="ts" x="630" y="460" text-anchor="middle">(contacts secs)</text>

  <rect class="env" x="20" y="420" width="120" height="54" rx="14"/>
  <text class="t" x="80" y="442" text-anchor="middle" style="font-size:12.5px">PC opérateur</text>
  <text class="ts" x="80" y="460" text-anchor="middle">(console / Wi-Fi)</text>

  <!-- Énergie (ambre épais) -->
  <line class="fe" x1="140" y1="97" x2="158" y2="97"/>
  <path class="me" d="M160,89 L160,105 L176,97 Z"/>
  <line class="fe" x1="178" y1="90" x2="178" y2="104"/>
  <line class="fe" x1="178" y1="97" x2="536" y2="97" marker-end="url(#ae)"/>
  <circle class="me" cx="235" cy="97" r="3.2"/>
  <line class="fe" x1="235" y1="99" x2="235" y2="216" marker-end="url(#ae)"/>
  <polyline class="fe" points="235,270 235,330 256,330" marker-end="url(#ae)"/>
  <line class="fe" x1="430" y1="330" x2="533" y2="330" marker-end="url(#ae)"/>
  <line class="fe" x1="630" y1="134" x2="630" y2="176" marker-end="url(#ae)"/>

  <!-- Signaux (trait fin) -->
  <polyline class="fi" points="400,298 400,110 536,110" marker-end="url(#ai)"/>
  <line class="fi" x1="536" y1="312" x2="434" y2="312" marker-end="url(#ai)"/>
  <polyline class="fi" points="536,447 400,447 400,414" marker-end="url(#ai)"/>
  <polyline class="fi" points="256,380 180,380 180,447 144,447" marker-end="url(#ai)"/>

  <!-- Libellés -->
  <text class="tl" x="300" y="86" text-anchor="middle">12 V</text>
  <text class="ts" x="204" y="82" text-anchor="start">diode série</text>
  <text class="tl" x="245" y="305" text-anchor="start">5 V (VIN)</text>
  <text class="tl" x="483" y="303" text-anchor="middle">ADC 0–3,3 V</text>
  <text class="tl" x="483" y="344" text-anchor="middle">3,3 V</text>
  <text class="tl" x="412" y="126" text-anchor="start">STEP · DIR (×3)</text>
  <text class="tl" x="642" y="159" text-anchor="start">bobines 12 V</text>
  <text class="tl" x="468" y="437" text-anchor="middle">GPIO (interruption)</text>
  <text class="tl" x="428" y="463" text-anchor="start">tirage 3,3 V + filtre RC</text>
  <text class="tl" x="218" y="370" text-anchor="middle">UART / Wi-Fi</text>

  <!-- Badges d'étapes -->
  <circle class="bdg" cx="190" cy="78" r="9"/><text class="bt" x="190" y="82" text-anchor="middle">4</text>
  <circle class="bdg" cx="382" cy="120" r="9"/><text class="bt" x="382" y="124" text-anchor="middle">1</text>
  <circle class="bdg" cx="322" cy="233" r="9"/><text class="bt" x="322" y="237" text-anchor="middle">3</text>
  <circle class="bdg" cx="322" cy="257" r="9"/><text class="bt" x="322" y="261" text-anchor="middle">5</text>
  <circle class="bdg" cx="392" cy="459" r="9"/><text class="bt" x="392" y="463" text-anchor="middle">2</text>
  <circle class="bdg" cx="414" cy="459" r="9"/><text class="bt" x="414" y="463" text-anchor="middle">5</text>

  <!-- Masse en étoile -->
  <line class="fi" x1="90" y1="506" x2="90" y2="520"/>
  <line class="fi" x1="76" y1="520" x2="104" y2="520"/>
  <line class="fi" x1="81" y1="526" x2="99" y2="526"/>
  <line class="fi" x1="86" y1="532" x2="94" y2="532"/>
  <text class="ts" x="114" y="526" text-anchor="start">masse en étoile — puissance et logique réunies en un point</text>

  <!-- Légende des étapes -->
  <circle class="bdg" cx="28" cy="560" r="9"/><text class="bt" x="28" y="564" text-anchor="middle">1</text>
  <text class="tl" x="42" y="564" text-anchor="start">interfaces</text>
  <circle class="bdg" cx="130" cy="560" r="9"/><text class="bt" x="130" y="564" text-anchor="middle">2</text>
  <text class="tl" x="144" y="564" text-anchor="start">niveaux adaptés</text>
  <circle class="bdg" cx="262" cy="560" r="9"/><text class="bt" x="262" y="564" text-anchor="middle">3</text>
  <text class="tl" x="276" y="564" text-anchor="start">énergie distribuée</text>
  <circle class="bdg" cx="412" cy="560" r="9"/><text class="bt" x="412" y="564" text-anchor="middle">4</text>
  <text class="tl" x="426" y="564" text-anchor="start">protections</text>
  <circle class="bdg" cx="516" cy="560" r="9"/><text class="bt" x="516" y="564" text-anchor="middle">5</text>
  <text class="tl" x="530" y="564" text-anchor="start">vérifié en simulation</text>
</svg>

<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <style>
      .h1 { font-size:16px; font-weight:600; fill:#2A2A2A; }
      .sub { font-size:11px; fill:#6E6E6E; }
      .wire { fill:none; stroke:#6E6E6E; stroke-width:2; }
      .mark { fill:#6E6E6E; }
      .boxN { fill:#FFFFFF; stroke:#B9B6AC; stroke-width:1.4; }
      .comp { fill:#F7EBD6; stroke:#BA7517; stroke-width:1.6; }
      .lbl { font-size:12px; fill:#2A2A2A; }
      .lblBox { font-size:14px; font-weight:600; fill:#3A3A3A; }
      .lblPin { font-size:11px; font-weight:600; fill:#2A2A2A; }
      .dot { fill:#6E6E6E; }
      .nStrong { font-size:11.5px; font-weight:600; fill:#3A3A3A; }
      .n { font-size:11px; fill:#5A5A5A; }
      @media (prefers-color-scheme: dark) {
        .h1 { fill:#EDEDED; }
        .sub { fill:#A8A8A8; }
        .wire { stroke:#B0B0B0; }
        .mark { fill:#B0B0B0; }
        .boxN { fill:#1F1F1F; stroke:#5A5A5A; }
        .comp { fill:#3A2E19; stroke:#E0A24A; }
        .lbl { fill:#ECECEC; }
        .lblBox { fill:#DADADA; }
        .lblPin { fill:#ECECEC; }
        .dot { fill:#B0B0B0; }
        .nStrong { fill:#DADADA; }
        .n { fill:#B0B0B0; }
      }
    </style>
  </defs>

  <text x="320" y="28" class="h1" text-anchor="middle">Câblage — potentiomètre sur ESP32</text>
  <text x="320" y="48" class="sub" text-anchor="middle">Les noms de broches sont ceux du code : GPIO34, 3V3, GND</text>

  <!-- ESP32 -->
  <rect x="44" y="88" width="150" height="160" rx="10" class="boxN"/>
  <text x="119" y="114" class="lblBox" text-anchor="middle">ESP32</text>
  <text x="186" y="140" class="lblPin" text-anchor="end">3V3</text>
  <text x="186" y="186" class="lblPin" text-anchor="end">GPIO34</text>
  <text x="186" y="232" class="lblPin" text-anchor="end">GND</text>

  <!-- Corps du potentiometre -->
  <rect x="390" y="118" width="44" height="104" rx="3" class="comp"/>
  <text x="448" y="166" class="lbl">Potentiomètre</text>
  <text x="448" y="184" class="lbl">10 kΩ</text>

  <!-- Rail 3,3 V -->
  <circle cx="194" cy="118" r="3" class="dot"/>
  <line x1="194" y1="118" x2="412" y2="118" class="wire"/>
  <text x="300" y="110" class="lbl" text-anchor="middle">3,3 V</text>

  <!-- Curseur vers GPIO34 -->
  <circle cx="194" cy="170" r="3" class="dot"/>
  <line x1="194" y1="170" x2="382" y2="170" class="wire"/>
  <polygon points="382,164 382,176 392,170" class="mark"/>
  <text x="300" y="162" class="lbl" text-anchor="middle">curseur</text>

  <!-- Rail GND -->
  <circle cx="194" cy="222" r="3" class="dot"/>
  <line x1="194" y1="222" x2="412" y2="222" class="wire"/>
  <text x="300" y="240" class="lbl" text-anchor="middle">GND</text>

  <!-- Note -->
  <text x="44" y="276" class="nStrong">Bon à savoir</text>
  <text x="44" y="294" class="n">Le potentiomètre se câble en diviseur : les deux extrémités entre 3,3 V et GND, le curseur (broche du milieu) sur l'entrée.</text>
  <text x="44" y="310" class="n">GPIO34 est en entrée seule et sur ADC1 — la mesure reste valide même quand le Wi-Fi est actif.</text>
</svg>

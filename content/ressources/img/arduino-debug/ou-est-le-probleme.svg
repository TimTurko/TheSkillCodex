<svg viewBox="0 0 600 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arbre de triage du debogage : apres avoir ecrit et televerse le code, on se demande d'abord si ca compile ; sinon c'est une erreur de compilation a lire dans le message. Si ca compile, on se demande si le programme fait ce qu'on veut ; si oui c'est termine, sinon c'est un bug de comportement qui se traque avec Serial.print et la dichotomie, et si un peripherique reste muet il faut verifier le cablage et l'alimentation.">
  <defs>
    <marker id="ah" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse">
      <path class="ahead" d="M0,0 L8,4 L0,8 Z"/>
    </marker>
    <style>
      .box  { fill:#DDDBD3; stroke:#8a7a55; stroke-width:1.5; }
      .dbox { fill:#F0E6D2; stroke:#BA7517; stroke-width:2; }
      .ok   { fill:#DDE8DA; stroke:#5f7d55; stroke-width:1.5; }
      .arrow{ fill:none; stroke:#BA7517; stroke-width:2; }
      .ahead{ fill:#BA7517; }
      .t    { fill:#2a2a2a; }
      .tg   { fill:#6b6b6b; }
      @media (prefers-color-scheme: dark) {
        .box  { fill:#3a3a3a; stroke:#b89a5e; }
        .dbox { fill:#4a3f29; stroke:#E0A040; }
        .ok   { fill:#2f3d2b; stroke:#8fae84; }
        .arrow{ stroke:#E0A040; }
        .ahead{ fill:#E0A040; }
        .t    { fill:#e8e6df; }
        .tg   { fill:#b0b0b0; }
      }
    </style>
  </defs>

  <rect class="box" x="210" y="18" width="180" height="40" rx="6"/>
  <text class="t" x="300" y="43" text-anchor="middle" font-size="13">Code \u00e9crit / t\u00e9l\u00e9vers\u00e9</text>

  <rect class="dbox" x="222" y="92" width="156" height="40" rx="6"/>
  <text class="t" x="300" y="117" text-anchor="middle" font-size="13" font-weight="bold">\u00c7a compile ?</text>

  <rect class="box" x="20" y="86" width="172" height="74" rx="6"/>
  <text class="t"  x="106" y="110" text-anchor="middle" font-size="12" font-weight="bold">Erreur de compilation</text>
  <text class="t"  x="106" y="128" text-anchor="middle" font-size="11">\u2192 lire le message</text>
  <text class="tg" x="106" y="145" text-anchor="middle" font-size="11">(souvent la ligne d'avant)</text>

  <rect class="dbox" x="206" y="180" width="188" height="44" rx="6"/>
  <text class="t" x="300" y="207" text-anchor="middle" font-size="13" font-weight="bold">\u00c7a fait ce qu'on veut ?</text>

  <rect class="ok" x="450" y="182" width="128" height="40" rx="6"/>
  <text class="t" x="514" y="207" text-anchor="middle" font-size="13" font-weight="bold">\u2713 Termin\u00e9</text>

  <rect class="box" x="190" y="278" width="220" height="58" rx="6"/>
  <text class="t" x="300" y="302" text-anchor="middle" font-size="12" font-weight="bold">Bug de comportement</text>
  <text class="tg" x="300" y="321" text-anchor="middle" font-size="11">observer : Serial.print + dichotomie</text>

  <rect class="box" x="190" y="392" width="220" height="58" rx="6"/>
  <text class="t" x="300" y="416" text-anchor="middle" font-size="12" font-weight="bold">P\u00e9riph\u00e9rique muet ?</text>
  <text class="tg" x="300" y="435" text-anchor="middle" font-size="11">\u2192 v\u00e9rifier c\u00e2blage + alimentation</text>

  <path class="arrow" marker-end="url(#ah)" d="M300,58 L300,90"/>
  <path class="arrow" marker-end="url(#ah)" d="M222,112 L194,112"/>
  <text class="tg" x="207" y="106" text-anchor="middle" font-size="11">non</text>
  <path class="arrow" marker-end="url(#ah)" d="M300,132 L300,178"/>
  <text class="tg" x="312" y="158" text-anchor="start" font-size="11">oui</text>
  <path class="arrow" marker-end="url(#ah)" d="M394,202 L448,202"/>
  <text class="tg" x="421" y="195" text-anchor="middle" font-size="11">oui</text>
  <path class="arrow" marker-end="url(#ah)" d="M300,224 L300,276"/>
  <text class="tg" x="312" y="254" text-anchor="start" font-size="11">non</text>
  <path class="arrow" marker-end="url(#ah)" d="M300,336 L300,390"/>
  <text class="tg" x="312" y="366" text-anchor="start" font-size="11">si muet</text>
</svg>

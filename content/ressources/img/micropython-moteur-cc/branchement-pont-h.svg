<svg viewBox="0 0 660 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <style>
      .h1 { font-size:15px; font-weight:600; fill:#2A2A2A; }
      .sub { font-size:11px; fill:#6E6E6E; }
      .wire { fill:none; stroke:#6E6E6E; stroke-width:2; }
      .boxN { fill:#FFFFFF; stroke:#B9B6AC; stroke-width:1.4; }
      .comp { fill:#F7EBD6; stroke:#BA7517; stroke-width:1.6; }
      .dot { fill:#6E6E6E; }
      .lblBox { font-size:14px; font-weight:600; fill:#3A3A3A; }
      .lblPin { font-size:11px; font-weight:600; fill:#2A2A2A; }
      .pin { font-size:11.5px; font-weight:700; fill:#7A5310; }
      .n { font-size:11px; fill:#5A5A5A; }
      .nStrong { font-size:11.5px; font-weight:600; fill:#3A3A3A; }
      @media (prefers-color-scheme: dark) {
        .h1 { fill:#EDEDED; }
        .sub { fill:#A8A8A8; }
        .wire { stroke:#B0B0B0; }
        .boxN { fill:#1F1F1F; stroke:#5A5A5A; }
        .comp { fill:#3A2E19; stroke:#E0A24A; }
        .dot { fill:#B0B0B0; }
        .lblBox { fill:#DADADA; }
        .lblPin { fill:#ECECEC; }
        .pin { fill:#E0A24A; }
        .n { fill:#B0B0B0; }
        .nStrong { fill:#DADADA; }
      }
    </style>
  </defs>

  <text x="330" y="26" class="h1" text-anchor="middle">Câblage — moteur CC via pont en H DRV8833 sur Pico</text>
  <text x="330" y="46" class="sub" text-anchor="middle">Broches du code : AIN1=GP12 (PWM avant) · AIN2=GP11 (PWM arrière) · VM = alim. moteur séparée</text>

  <!-- Pico -->
  <rect x="30" y="86" width="140" height="190" rx="10" class="boxN"/>
  <text x="100" y="112" class="lblBox" text-anchor="middle">Pico</text>
  <circle cx="170" cy="130" r="3" class="dot"/><text x="162" y="134" class="pin" text-anchor="end">GP12 (AIN1)</text>
  <circle cx="170" cy="166" r="3" class="dot"/><text x="162" y="170" class="pin" text-anchor="end">GP11 (AIN2)</text>
  <circle cx="170" cy="210" r="3" class="dot"/><text x="162" y="214" class="lblPin" text-anchor="end">3V3</text>
  <circle cx="170" cy="250" r="3" class="dot"/><text x="162" y="254" class="lblPin" text-anchor="end">GND</text>

  <!-- DRV8833 -->
  <rect x="260" y="80" width="170" height="210" rx="10" class="comp"/>
  <text x="345" y="104" class="lblBox" text-anchor="middle">Pont en H DRV8833</text>
  <circle cx="260" cy="130" r="3" class="dot"/><text x="268" y="134" class="lblPin" text-anchor="start">AIN1</text>
  <circle cx="260" cy="166" r="3" class="dot"/><text x="268" y="170" class="lblPin" text-anchor="start">AIN2</text>
  <circle cx="260" cy="210" r="3" class="dot"/><text x="268" y="214" class="lblPin" text-anchor="start">VCC</text>
  <circle cx="260" cy="250" r="3" class="dot"/><text x="268" y="254" class="lblPin" text-anchor="start">GND</text>
  <circle cx="430" cy="124" r="3" class="dot"/><text x="422" y="128" class="lblPin" text-anchor="end">AO1</text>
  <circle cx="430" cy="158" r="3" class="dot"/><text x="422" y="162" class="lblPin" text-anchor="end">AO2</text>
  <circle cx="430" cy="214" r="3" class="dot"/><text x="422" y="218" class="lblPin" text-anchor="end">VM</text>

  <!-- Pico -> DRV -->
  <line x1="170" y1="130" x2="260" y2="130" class="wire"/>
  <text x="215" y="124" class="n" text-anchor="middle">PWM avant</text>
  <line x1="170" y1="166" x2="260" y2="166" class="wire"/>
  <text x="215" y="160" class="n" text-anchor="middle">PWM arrière</text>
  <line x1="170" y1="210" x2="260" y2="210" class="wire"/>
  <text x="215" y="204" class="n" text-anchor="middle">3,3 V (logique)</text>
  <line x1="170" y1="250" x2="260" y2="250" class="wire"/>

  <!-- Moteur -->
  <rect x="520" y="100" width="110" height="56" rx="10" class="boxN"/>
  <text x="575" y="132" class="lblBox" text-anchor="middle">Moteur CC</text>
  <circle cx="520" cy="116" r="3" class="dot"/>
  <circle cx="520" cy="144" r="3" class="dot"/>
  <line x1="430" y1="124" x2="475" y2="124" class="wire"/>
  <line x1="475" y1="124" x2="475" y2="116" class="wire"/>
  <line x1="475" y1="116" x2="520" y2="116" class="wire"/>
  <line x1="430" y1="158" x2="495" y2="158" class="wire"/>
  <line x1="495" y1="158" x2="495" y2="144" class="wire"/>
  <line x1="495" y1="144" x2="520" y2="144" class="wire"/>

  <!-- Condensateur 100 µF aux bornes moteur (en parallèle sur AO1/AO2) -->
  <line x1="460" y1="124" x2="460" y2="135" class="wire"/>
  <line x1="451" y1="135" x2="469" y2="135" class="wire"/>
  <line x1="451" y1="140" x2="469" y2="140" class="wire"/>
  <line x1="460" y1="140" x2="460" y2="158" class="wire"/>
  <text x="476" y="143" class="n" text-anchor="start">100 µF</text>

  <!-- Alim moteur séparée -->
  <rect x="520" y="200" width="110" height="52" rx="10" class="boxN"/>
  <text x="575" y="222" class="nStrong" text-anchor="middle">Alim. moteur</text>
  <text x="575" y="240" class="n" text-anchor="middle">(séparée, selon le moteur)</text>
  <circle cx="520" cy="210" r="3" class="dot"/><text x="512" y="214" class="lblPin" text-anchor="end">+</text>
  <circle cx="520" cy="244" r="3" class="dot"/><text x="512" y="248" class="lblPin" text-anchor="end">−</text>
  <line x1="430" y1="214" x2="490" y2="214" class="wire"/>
  <line x1="490" y1="214" x2="490" y2="210" class="wire"/>
  <line x1="490" y1="210" x2="520" y2="210" class="wire"/>

  <!-- Masse commune -->
  <line x1="170" y1="250" x2="170" y2="332" class="wire"/>
  <line x1="520" y1="244" x2="500" y2="244" class="wire"/>
  <line x1="500" y1="244" x2="500" y2="332" class="wire"/>
  <line x1="170" y1="332" x2="500" y2="332" class="wire"/>
  <circle cx="170" cy="332" r="3" class="dot"/>
  <circle cx="500" cy="332" r="3" class="dot"/>
  <text x="335" y="352" class="n" text-anchor="middle">Masse commune : Pico + DRV8833 + alimentation moteur (indispensable). Un seul PWM actif à la fois (AIN1 ou AIN2).</text>
</svg>

<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <style>
      .h1 { font-size:15px; font-weight:600; fill:#2A2A2A; }
      .sub { font-size:11px; fill:#6E6E6E; }
      .axis { fill:none; stroke:#6E6E6E; stroke-width:1.5; }
      .taskLbl { font-size:11px; font-weight:600; fill:#3A3A3A; }
      .ev { fill:#BA7517; }
      .evBar { fill:#6E6E6E; opacity:0.5; }
      .tlbl { font-size:10px; fill:#5A5A5A; }
      .n { font-size:11px; fill:#5A5A5A; }
      .nStrong { font-size:11.5px; font-weight:600; fill:#3A3A3A; }
      @media (prefers-color-scheme: dark) {
        .h1 { fill:#EDEDED; }
        .sub { fill:#A8A8A8; }
        .axis { stroke:#B0B0B0; }
        .taskLbl { fill:#DADADA; }
        .ev { fill:#E0A24A; }
        .evBar { fill:#B0B0B0; opacity:0.45; }
        .tlbl { fill:#B0B0B0; }
        .n { fill:#B0B0B0; }
        .nStrong { fill:#DADADA; }
      }
    </style>
  </defs>

  <text x="320" y="26" class="h1" text-anchor="middle">Plusieurs tâches en parallèle, sans attente bloquante</text>
  <text x="320" y="46" class="sub" text-anchor="middle">Chaque tâche a son rythme ; la boucle vérifie l'heure et déclenche celle qui est due</text>

  <!-- LED : bascule toutes les 500 ms -->
  <text x="40" y="100" class="taskLbl" text-anchor="start">LED — bascule toutes les 500 ms</text>
  <line x1="200" y1="96" x2="600" y2="96" class="axis"/>
  <rect x="200" y="88" width="10" height="16" class="ev"/>
  <rect x="280" y="88" width="10" height="16" class="ev"/>
  <rect x="360" y="88" width="10" height="16" class="ev"/>
  <rect x="440" y="88" width="10" height="16" class="ev"/>
  <rect x="520" y="88" width="10" height="16" class="ev"/>
  <rect x="600" y="88" width="10" height="16" class="ev"/>

  <!-- Capteur : lu toutes les 100 ms (10 Hz) -->
  <text x="40" y="160" class="taskLbl" text-anchor="start">Capteur — lu toutes les 100 ms (10 Hz)</text>
  <line x1="200" y1="156" x2="600" y2="156" class="axis"/>
  <rect x="200" y="148" width="6" height="16" class="ev"/>
  <rect x="216" y="148" width="6" height="16" class="ev"/>
  <rect x="232" y="148" width="6" height="16" class="ev"/>
  <rect x="248" y="148" width="6" height="16" class="ev"/>
  <rect x="264" y="148" width="6" height="16" class="ev"/>
  <rect x="280" y="148" width="6" height="16" class="ev"/>
  <rect x="296" y="148" width="6" height="16" class="ev"/>
  <rect x="312" y="148" width="6" height="16" class="ev"/>
  <rect x="328" y="148" width="6" height="16" class="ev"/>
  <rect x="344" y="148" width="6" height="16" class="ev"/>
  <rect x="360" y="148" width="6" height="16" class="ev"/>
  <rect x="376" y="148" width="6" height="16" class="ev"/>
  <rect x="392" y="148" width="6" height="16" class="ev"/>
  <rect x="408" y="148" width="6" height="16" class="ev"/>
  <rect x="424" y="148" width="6" height="16" class="ev"/>
  <rect x="440" y="148" width="6" height="16" class="ev"/>
  <rect x="456" y="148" width="6" height="16" class="ev"/>
  <rect x="472" y="148" width="6" height="16" class="ev"/>
  <rect x="488" y="148" width="6" height="16" class="ev"/>
  <rect x="504" y="148" width="6" height="16" class="ev"/>
  <rect x="520" y="148" width="6" height="16" class="ev"/>
  <rect x="536" y="148" width="6" height="16" class="ev"/>
  <rect x="552" y="148" width="6" height="16" class="ev"/>
  <rect x="568" y="148" width="6" height="16" class="ev"/>
  <rect x="584" y="148" width="6" height="16" class="ev"/>
  <rect x="600" y="148" width="6" height="16" class="ev"/>

  <!-- Bouton : lu a chaque tour de boucle -->
  <text x="40" y="220" class="taskLbl" text-anchor="start">Bouton — lu à chaque tour de boucle</text>
  <line x1="200" y1="216" x2="600" y2="216" class="axis"/>
  <rect x="200" y="208" width="406" height="16" rx="2" class="evBar"/>

  <!-- Axe du temps commun -->
  <line x1="200" y1="256" x2="600" y2="256" class="axis"/>
  <text x="200" y="274" class="tlbl" text-anchor="middle">0</text>
  <text x="360" y="274" class="tlbl" text-anchor="middle">1 s</text>
  <text x="520" y="274" class="tlbl" text-anchor="middle">2 s</text>
  <text x="320" y="292" class="tlbl" text-anchor="middle">temps</text>

  <text x="40" y="320" class="nStrong" text-anchor="start">Aucune tâche n'attend les autres : la boucle tourne très vite ; le bouton, lu à chaque tour, est vu dès l'appui.</text>
</svg>
